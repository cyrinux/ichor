[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
serialization = "1.12.0"
coroutines = "1.11.0"
camerax = "1.6.2"
zxing = "3.5.4"
coreKtx = "1.19.1"
junit = "4.13.2"
# The demo-mode smoke test on an emulator (androidTest, CI job ui-smoke).
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
biometric = "1.1.0"
fragment = "1.9.1"
work = "2.12.0"
glance = "1.2.0"
