org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# R8 shrinks resources together with code (Play's "Resource Shrinking Optimized").
android.r8.optimizedResourceShrinking=true
# Task outputs are reused from the local build cache in GRADLE_USER_HOME, which CI restores
# between runs (.github/actions/android-toolchain).
org.gradle.caching=true
