---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  mode: "prod"
---
# The worker.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
spec:
  serviceName: worker
  # replicas come from the default
  selector:
    matchLabels: {app: worker}
  template:
    spec:
      containers:
        - name: worker
          image: ghcr.io/example-org/worker:3.2.1
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  ports: [{port: 80}]
