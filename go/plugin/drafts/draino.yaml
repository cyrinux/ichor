# yaml-language-server: $schema=../schema/plugin.schema.json
# Draft written by probe plugin-from-crd from nodedrains.draino.acides.org (v1alpha1). Review the health rules, translate the labels (i18n), then move it to go/plugin/builtin/.

schemaVersion: ichor.dev/plugin/v1alpha1
id: draino
name: draino
website: https://github.com/cyrinux/draino
category: data-services
detect:
  - group: draino.acides.org
    resource: nodedrains
resources:
  nodedrain:
    group: draino.acides.org
    version: v1alpha1
    resource: nodedrains
    kind: NodeDrain
    scope: Cluster
fields:
  nodedrain:
    # Node is the name of the node to drain
    node: $.spec.node
    # Query is the PromQL query to evaluate
    query: $.spec.query
    # Schedule is the cron schedule for when to run the query
    schedule: $.spec.schedule
    # LastScheduleTime is the last time the Job was successfully scheduled
    lastScheduleTime: $.status.lastScheduleTime
    # ValidationError holds any validation error message
    validationError: $.status.validationError
dataServices:
  summary:
    aggregate:
      total: count(nodedrain)
      warnings: 'count(nodedrain, health == "warning")'
      critical: 'count(nodedrain, health == "critical")'
    health: worst(nodedrain.health)
cards:
  summary:
    title:
      count: dataServices.summary.total
      one: "%d NodeDrain"
      other: "%d NodeDrains"
    health: dataServices.summary.health
    badges:
      - label: "warnings"
        value: dataServices.summary.warnings
        tone: warning
        hideWhenZero: true
      - label: "critical"
        value: dataServices.summary.critical
        tone: critical
        hideWhenZero: true
  list:
    from: nodedrain
    sort:
      - health desc
      - $.metadata.name
    empty: "No NodeDrains."
    row:
      title: $.metadata.name
      status:
        tone: health
# Invented names. The first sample is healthy, the second fails.
samples:
  nodedrain:
    - metadata:
        creationTimestamp: now-4m
        name: demo-one
      spec:
        node: demo-node
        query: demo-query
        schedule: demo-schedule
    - metadata:
        creationTimestamp: now-4m
        name: demo-two
      spec:
        node: demo-node
        query: demo-query
        schedule: demo-schedule
