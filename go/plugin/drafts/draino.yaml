# yaml-language-server: $schema=../schema/plugin.schema.json
# Draft written by probe plugin-from-crd from nodedrains.draino.acides.org (v1alpha1). Review the health rules, translate the labels (i18n), then move it to go/plugin/builtin/.

schemaVersion: ichor.dev/plugin/v1alpha1
id: draino
name: draino
website: https://forge.tedomum.net/acides/draino
category: data-services
detect:
  - group: draino.acides.org
    resource: nodedrains
resources:
  nodedrain:
    group: draino.acides.org
    version: v1alpha1
    resource: nodedrains
    kind: NodeDrain
    scope: Cluster
fields:
  nodedrain:
    # Type indicates the type of condition.
    conditionType: $.spec.condition.type
    # Do a dry-run drain for debugging
    debug: $.spec.debug | default(false)
    # Enable the drain
    enable: $.spec.enable | default(false)
    # Force drain
    force: $.spec.force | default(true)
    # DrainImage is the that run the drain kubectl pod
    image: '$.spec.image | default("bitnami/kubectl:latest")'
    # Interval is the interval when to evaluate the condition (e.g., "30s", "2m")
    interval: '$.spec.interval | default("2m")'
    # Node is the name of the node to drain
    node: $.spec.node
    # LastCheckTime is the last time the condition was evaluated.
    lastCheckTime: $.status.lastCheckTime
    # LastDrainTime is the last time the node was successfully drained.
    lastDrainTime: $.status.lastDrainTime
    # ValidationError holds any validation error message.
    validationError: $.status.validationError
dataServices:
  summary:
    aggregate:
      total: count(nodedrain)
      warnings: 'count(nodedrain, health == "warning")'
      critical: 'count(nodedrain, health == "critical")'
    health: worst(nodedrain.health)
cards:
  summary:
    title:
      count: dataServices.summary.total
      one: "%d NodeDrain"
      other: "%d NodeDrains"
    health: dataServices.summary.health
    badges:
      - label: "warnings"
        value: dataServices.summary.warnings
        tone: warning
        hideWhenZero: true
      - label: "critical"
        value: dataServices.summary.critical
        tone: critical
        hideWhenZero: true
  list:
    from: nodedrain
    sort:
      - health desc
      - $.metadata.name
    empty: "No NodeDrains."
    row:
      title: $.metadata.name
      status:
        tone: health
        text: $.spec.node
      trailing:
        text: $.status.lastDrainTime | relativeTime()
      detail:
        - type: keyValues
          items:
            - label: "Node"
              value: $.spec.node
            - label: "Condition Type"
              value: $.spec.condition.type
            - label: "Interval"
              value: $.spec.interval
            - label: "Enable"
              value: $.spec.enable
            - label: "Force"
              value: $.spec.force
            - label: "Age"
              value: $.metadata.creationTimestamp | relativeTime()
# Invented names. The first sample is healthy, the second fails.
samples:
  nodedrain:
    - metadata:
        creationTimestamp: now-4m
        name: demo-one
      spec:
        condition:
          type: PromQLQuery
        node: demo-node
    - metadata:
        creationTimestamp: now-4m
        name: demo-two
      spec:
        condition:
          type: PromQLQuery
        node: demo-node
