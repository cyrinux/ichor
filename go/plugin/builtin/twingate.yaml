# Invented names and IDs (base64-looking Twingate IDs are made up). demo-shop's storefront is
# generated from its Service; demo-lab's lab-db has waited for its id for an hour; an access
# names a resource that does not exist.
samples:
  connector:
    - metadata: { name: relay-a, namespace: demo-shop, creationTimestamp: now-30d }
      spec:
        id: Q29ubmVjdG9yOmRlbW8tYQ==
        name: demo-relay-a
        image: { repository: twingate/connector, tag: "1" }
      status:
        twingate_connector_create: { success: true, twingate_id: Q29ubmVjdG9yOmRlbW8tYQ==, ts: "2026-10-11T08:00:00" }
    - metadata: { name: relay-b, namespace: demo-lab, creationTimestamp: now-2d }
      spec:
        imagePolicy: { provider: dockerhub, version: "^1.0.0" }
      status:
        twingate_connector_update: { success: false, error: "Update called before Connector has an ID", ts: "2026-11-08T09:00:00" }
    - metadata: { name: relay-c, namespace: demo-lab, creationTimestamp: now-2h }
      spec: { logLevel: 7 }
    - metadata: { name: relay-d, namespace: demo-lab, creationTimestamp: now-1m }
      spec: {}
  resource:
    - metadata:
        name: storefront-resource
        namespace: demo-shop
        creationTimestamp: now-20d
        ownerReferences: [{ apiVersion: v1, kind: Service, name: storefront, uid: 00000000-0000-0000-0000-000000000001 }]
      spec:
        id: UmVzb3VyY2U6ZGVtby1zaG9w
        name: storefront-resource
        address: storefront.demo-shop.svc.cluster.local
        protocols: { allowIcmp: false, tcp: { policy: RESTRICTED, ports: [{ start: 443, end: 443 }] }, udp: { policy: DENY_ALL } }
      status:
        twingate_resource_create: { success: true, twingate_id: UmVzb3VyY2U6ZGVtby1zaG9w, ts: "2026-10-21T08:00:00" }
    - metadata: { name: grafana, namespace: demo-shop, creationTimestamp: now-10d }
      spec:
        id: UmVzb3VyY2U6ZGVtby1ncmFm
        name: Grafana
        address: 10.20.0.15
