# yaml-language-server: $schema=../schema/plugin.schema.json
# The Twingate operator (twingate.com/v1beta, Python on kopf) declares Twingate objects from
# Kubernetes: a TwingateConnector runs a relay in the cluster, a TwingateResource is an address
# reachable through Twingate (generated as <service>-resource from a Service annotated
# resource.twingate.com: "true", which then owns it), a TwingateResourceAccess lets a principal
# or a TwingateGroup reach a resource. The CRDs leave status free-form; what the operator
# writes, read from its sources (app/handlers/*.py, 2026-11-10):
# * spec.id once the object exists in Twingate (the printer column ID);
# * status.<handler name> = each handler's result {ts, success, twingate_id…}; a handler
#   that fails without raising writes success: false and error (an update called before the
#   object has an id, a GraphQL mutation refused for an access). A raised error retries and
#   leaves no status key: "not created after 5 minutes" is the only sign of it (a heuristic);
# * status.resourceId and status.principalId on an access once the grant landed.
# Gateway and CertificateAuthority (newer, for the Kubernetes-type resources) are not listed.
schemaVersion: ichor.dev/plugin/v1alpha1
id: twingate
name: Twingate
website: https://github.com/Twingate/kubernetes-operator/wiki/Getting-Started
icon: twingate
category: networking
catalogId: twingate

detect:
  - group: twingate.com

resources:
  connector:
    group: twingate.com
    version: v1beta
    resource: twingateconnectors
    kind: TwingateConnector
    scope: Namespaced
  resource:
    group: twingate.com
    version: v1beta
    resource: twingateresources
    kind: TwingateResource
    scope: Namespaced
  access:
    group: twingate.com
    version: v1beta
    resource: twingateresourceaccesses
    kind: TwingateResourceAccess
    scope: Namespaced
  # An access's group: only for its link.
  group:
    group: twingate.com
    version: v1beta
    resource: twingategroups
    kind: TwingateGroup
    scope: Namespaced
    optional: true
  # The Service a generated resource comes from: names only.
  service:
    group: ""
    version: v1
    resource: services
    kind: Service
    scope: Namespaced
    list: { metadataOnly: true, limit: 2000 }
    optional: true

fields:
  connector:
    twingateID: $.spec.id | default("")
    displayName: $.spec.name | default("")
    remoteNetwork: $.spec.remoteNetworkId | default("")
    logLevel: $.spec.logLevel | default(3)
    image: >-
      has($.spec.image.repository)
      ? $.spec.image.repository + ":" + ($.spec.image.tag | default("latest"))
      : (has($.spec.imagePolicy) ? ($.spec.imagePolicy.provider | default("")) + " " + ($.spec.imagePolicy.version | default("")) : "")
    # The first handler result with success: false (kopf keeps one per handler).
    error: '$.status[?(@.success == false)].error | first() | default("")'
    failed: '$.status[?(@.success == false)] | first() | has()'
    ageMs: age($.metadata.creationTimestamp)
  resource:
    twingateID: $.spec.id | default("")
    displayName: $.spec.name | default($.metadata.name)
    address: $.spec.address | default("")
    alias: $.spec.alias | default("")
    type: $.spec.type | default("Network")
    browserShortcut: $.spec.isBrowserShortcutEnabled | default(false)
    visible: $.spec.isVisible | default(true)
    tcp: $.spec.protocols.tcp.policy | default("ALLOW_ALL")
    udp: $.spec.protocols.udp.policy | default("ALLOW_ALL")
    icmp: $.spec.protocols.allowIcmp | default(true)
    # Generated from an annotated Service: the operator adopts it (an owner reference).
    ownerService: '$.metadata.ownerReferences[?(@.kind == "Service")].name | first() | default("")'
    generated: fields.ownerService != ""
    serviceRef: >-
      fields.generated
      ? join(service, $.metadata.namespace == left.metadata.namespace && $.metadata.name == fields.ownerService)
      : null
    error: '$.status[?(@.success == false)].error | first() | default("")'
    failed: '$.status[?(@.success == false)] | first() | has()'
    ageMs: age($.metadata.creationTimestamp)
  access:
    resourceName: $.spec.resourceRef.name | default("")
    resourceNamespace: $.spec.resourceRef.namespace | default($.metadata.namespace)
    principal: >-
      has($.spec.principalId) ? $.spec.principalId
      : (has($.spec.groupRef.name) ? "group " + $.spec.groupRef.name
      : (has($.spec.principalExternalRef.name) ? lower($.spec.principalExternalRef.type | default("")) + " " + $.spec.principalExternalRef.name : ""))
    expiresAt: $.spec.expiresAt | time()
    expired: fields.expiresAt != 0 && fields.expiresAt < now
    resourceRef: join(resource, $.metadata.namespace == fields.resourceNamespace && $.metadata.name == fields.resourceName)
    resourceMissing: '!has(fields.resourceRef)'
    resourcePending: 'has(fields.resourceRef) && (fields.resourceRef.spec.id | default("")) == ""'
    groupRef: >-
      has($.spec.groupRef.name)
      ? join(group, $.metadata.name == left.spec.groupRef.name && $.metadata.namespace == (left.spec.groupRef.namespace | default(left.metadata.namespace)))
      : null
    resourceID: $.status.resourceId | default($.status.twingate_resource_access_change.resource_id) | default("")
    principalID: $.status.principalId | default($.status.twingate_resource_access_change.principal_id) | default("")
    granted: $.status.twingate_resource_access_change.success | default(false)
    error: '$.status[?(@.success == false)].error | first() | default("")'
    failed: '$.status[?(@.success == false)] | first() | has()'
    ageMs: age($.metadata.creationTimestamp)

# First match wins. "Not created" is a heuristic (see the header); the rest is what the
# operator writes.
health:
  connector:
    - when: fields.failed
      health: critical
      reason: failed
      message: "failed: {{ fields.error }}"
    - when: fields.twingateID == "" && fields.ageMs > 300000
      health: warning
      reason: notCreated
      message: "not created in Twingate after 5 minutes"
    - when: fields.twingateID == ""
      health: info
      reason: creating
      message: "being created in Twingate"
  resource:
    - when: fields.failed
      health: critical
      reason: failed
      message: "failed: {{ fields.error }}"
    - when: fields.twingateID == "" && fields.ageMs > 300000
      health: warning
      reason: notCreated
      message: "not created in Twingate after 5 minutes"
    - when: fields.twingateID == ""
      health: info
      reason: creating
      message: "being created in Twingate"
  access:
    - when: fields.failed
      health: critical
      reason: failed
      message: "failed: {{ fields.error }}"
    - when: fields.resourceMissing
      health: warning
      reason: resourceMissing
      message: "its resource {{ fields.resourceNamespace }}/{{ fields.resourceName }} does not exist"
    - when: fields.expired
      health: info
      reason: expired
      message: "expired"
    - when: fields.resourcePending
      health: info
      reason: resourcePending
      message: "waiting for its resource to be created in Twingate"
    - when: fields.resourceID == "" && fields.ageMs > 300000
      health: warning
      reason: notGranted
      message: "not granted after 5 minutes"
    - when: fields.resourceID == ""
      health: info
      reason: granting
      message: "being granted"

dataServices:
  summary:
    aggregate:
      connectors: count(connector)
      resources: count(resource)
      generated: count(resource, fields.generated)
      accesses: count(access)
      errors: 'count(connector, health == "critical") + count(resource, health == "critical") + count(access, health == "critical")'
      warnings: 'count(connector, health == "warning") + count(resource, health == "warning") + count(access, health == "warning")'
    health: worst([worst(connector.health), worst(resource.health), worst(access.health)])

cards:
  summary:
    title: { count: dataServices.summary.resources, one: "%d Twingate resource", other: "%d Twingate resources" }
    health: dataServices.summary.health
    badges:
      - { label: "connectors", value: dataServices.summary.connectors, tone: info }
      - { label: "from Services", value: dataServices.summary.generated, tone: info, hideWhenZero: true }
      - { label: "accesses", value: dataServices.summary.accesses, tone: info, hideWhenZero: true }
      - { label: "errors", value: dataServices.summary.errors, tone: critical, hideWhenZero: true }
      - { label: "warnings", value: dataServices.summary.warnings, tone: warning, hideWhenZero: true }
  resources:
    from: resource
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No Twingate resources."
    row:
      title: fields.displayName
      subtitle: '$.metadata.namespace + " · " + (fields.alias != "" ? fields.alias : fields.address)'
      status:
        tone: health
        text: 'fields.generated ? "From Service" : fields.type'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "Address", value: fields.address, mono: true }
            - { label: "Alias", value: fields.alias, mono: true }
            - { label: "Type", value: fields.type }
            - { label: "Twingate ID", value: fields.twingateID, mono: true }
            - { label: "TCP", value: fields.tcp }
            - { label: "UDP", value: fields.udp }
            - { label: "ICMP", value: fields.icmp }
            - { label: "Browser shortcut", value: fields.browserShortcut }
            - { label: "Visible", value: fields.visible }
        - type: relations
          items:
            - { label: "Service", ref: fields.serviceRef }
  connectors:
    from: connector
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No Twingate connectors."
    row:
      title: '$.metadata.name'
      subtitle: '$.metadata.namespace + (fields.displayName != "" ? " · " + fields.displayName : "")'
      status:
        tone: health
        text: 'fields.twingateID != "" ? "Created" : "Pending"'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "Twingate ID", value: fields.twingateID, mono: true }
            - { label: "Remote network", value: fields.remoteNetwork, mono: true }
            - { label: "Image", value: fields.image, mono: true }
            - { label: "Log level", value: fields.logLevel }
  accesses:
    from: access
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No Twingate accesses."
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + " · " + fields.principal + " → " + fields.resourceName'
      status:
        tone: health
        text: 'fields.expired ? "Expired" : (fields.resourceID != "" ? "Granted" : "Pending")'
      trailing: { text: 'fields.expiresAt != 0 ? relativeTime(fields.expiresAt) : ""' }
      detail:
        - type: keyValues
          items:
            - { label: "Principal", value: fields.principal, mono: true }
            - { label: "Resource", value: 'fields.resourceNamespace + "/" + fields.resourceName', mono: true }
            - { label: "Resource ID", value: fields.resourceID, mono: true }
            - { label: "Principal ID", value: fields.principalID, mono: true }
            - { label: "Granted", value: fields.granted }
            - { label: "Expires", value: 'fields.expiresAt != 0 ? relativeTime(fields.expiresAt) : ""' }
        - type: relations
          items:
            - { label: "Resource", ref: fields.resourceRef }
            - { label: "Group", ref: fields.groupRef }

findings:
  - id: connector-failed
    from: connector
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: connectors
  - id: connector-not-created
    from: connector
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: connectors
  - id: resource-failed
    from: resource
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: resources
  - id: resource-not-created
    from: resource
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: resources
  - id: access-failed
    from: access
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: accesses
  - id: access-problem
    from: access
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: accesses

