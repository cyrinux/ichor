# yaml-language-server: $schema=../schema/plugin.schema.json
# The ngrok operator puts a Service on a public or internal ngrok URL (ngrok.k8s.ngrok.com):
# an AgentEndpoint is an agent in the cluster forwarding its URL to upstream.url, a
# CloudEndpoint lives on ngrok's edge with a traffic policy. Each shows its URL, where it
# forwards to and its conditions, problems first. Ready is the operator's summary: when it
# is False its reason names the cause (the EndpointCreated / CloudEndpointCreated failure, a
# TrafficPolicyApplied error, or the Domain's own Ready reason, there is no DomainReady
# condition). The Domains are read from both groups: ngrok.com/v1 (operator 0.23 and later)
# and the deprecated ingress.k8s.ngrok.com/v1alpha1 (0.22 and earlier), whose objects read
# SupersededByV1 once migrated. The KubernetesOperator row is the operator's own
# registration with ngrok. Condition types and reasons from the operator's sources
# (internal/controller/agent, internal/controller/ngrok, internal/domain, read 2026-11-10).
schemaVersion: ichor.dev/plugin/v1alpha1
id: ngrok
name: ngrok
website: https://ngrok.com/docs/k8s/crds
icon: ngrok
category: networking
catalogId: ngrok

detect:
  - group: ngrok.k8s.ngrok.com

resources:
  agentEndpoint:
    group: ngrok.k8s.ngrok.com
    version: v1alpha1
    resource: agentendpoints
    kind: AgentEndpoint
    scope: Namespaced
  cloudEndpoint:
    group: ngrok.k8s.ngrok.com
    version: v1alpha1
    resource: cloudendpoints
    kind: CloudEndpoint
    scope: Namespaced
  # Optional: an operator before 0.23 does not serve ngrok.com, one after the migration may no
  # longer serve ingress.k8s.ngrok.com; the endpoints show either way.
  domain:
    group: ngrok.com
    version: v1
    resource: domains
    kind: Domain
    scope: Namespaced
    optional: true
  legacyDomain:
    group: ingress.k8s.ngrok.com
    version: v1alpha1
    resource: domains
    kind: Domain
    scope: Namespaced
    optional: true
  operator:
    group: ngrok.k8s.ngrok.com
    version: v1alpha1
    resource: kubernetesoperators
    kind: KubernetesOperator
    scope: Namespaced
    optional: true
  # The Service an agent endpoint forwards to, when its upstream URL names one: names only.
  service:
    group: ""
    version: v1
    resource: services
    kind: Service
    scope: Namespaced
    list: { metadataOnly: true, limit: 2000 }
    optional: true

fields:
  agentEndpoint:
    # The URL asked for: a domain, an origin, a bare scheme (a random ngrok URL) or "".
    url: $.spec.url | default("")
    # The URL ngrok gave: the one asked for, or the generated one.
    assignedURL: $.status.assignedURL | default("")
    address: 'fields.assignedURL != "" ? fields.assignedURL : fields.url'
    upstream: $.spec.upstream.url | default("")
    protocol: $.spec.upstream.protocol | default("http1")
    # public, internal or kubernetes (one today).
    bindings: $.spec.bindings | default([])
    # "inline", "none" or the NgrokTrafficPolicy's name.
    trafficPolicy: $.status.trafficPolicy | default("")
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
    createdStatus: condition("EndpointCreated").status | default("")
    createdReason: condition("EndpointCreated").reason | default("")
    createdMessage: condition("EndpointCreated").message | default("")
    policyStatus: condition("TrafficPolicyApplied").status | default("")
    policyMessage: condition("TrafficPolicyApplied").message | default("")
    # The upstream's host: "http://shop.demo-shop:8080/x" → shop.demo-shop. A cluster host is
    # <service>, <service>.<namespace> or <service>.<namespace>.svc[.cluster.local]; a bare
    # port, localhost or an outside domain links nothing (the join finds no Service).
    upstreamHostPort: '"://" in fields.upstream ? split(fields.upstream, "://")[1] : fields.upstream'
    upstreamHost: split(split(fields.upstreamHostPort, "/")[0], ":")[0] | lower()
    upstreamParts: split(fields.upstreamHost, ".")
    clusterHost: >-
      fields.upstreamHost != "localhost"
      && !matches(fields.upstreamHost, "^[0-9.]*$")
      && matches(fields.upstreamHost, "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)?(\\.svc(\\.cluster\\.local)?)?$")
    upstreamService: >-
      fields.clusterHost
      ? join(service, $.metadata.name == fields.upstreamParts[0]
        && $.metadata.namespace == (len(fields.upstreamParts) > 1 ? fields.upstreamParts[1] : left.metadata.namespace))
      : null
    domainRef: >-
      coalesce(
        join(domain, $.metadata.name == left.status.domainRef.name && $.metadata.namespace == (left.status.domainRef.namespace | default(left.metadata.namespace))),
        join(legacyDomain, $.metadata.name == left.status.domainRef.name && $.metadata.namespace == (left.status.domainRef.namespace | default(left.metadata.namespace))))
  cloudEndpoint:
    url: $.spec.url | default("")
    assignedURL: $.status.assignedURL | default("")
    address: 'fields.assignedURL != "" ? fields.assignedURL : fields.url'
    id: $.status.id | default("")
    bindings: $.spec.bindings | default([])
    trafficPolicy: '$.spec.trafficPolicy.targetRef.name | default(has($.spec.trafficPolicy.inline) ? "inline" : "")'
    pooling: $.spec.poolingEnabled | default(false)
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
    createdStatus: condition("CloudEndpointCreated").status | default("")
    createdReason: condition("CloudEndpointCreated").reason | default("")
    createdMessage: condition("CloudEndpointCreated").message | default("")
    policyStatus: condition("TrafficPolicyApplied").status | default("")
    policyMessage: condition("TrafficPolicyApplied").message | default("")
    domainRef: >-
      coalesce(
        join(domain, $.metadata.name == left.status.domainRef.name && $.metadata.namespace == (left.status.domainRef.namespace | default(left.metadata.namespace))),
        join(legacyDomain, $.metadata.name == left.status.domainRef.name && $.metadata.namespace == (left.status.domainRef.namespace | default(left.metadata.namespace))))
  domain:
    domain: $.status.domain | default($.spec.domain) | default("")
    id: $.status.id | default("")
    reclaimPolicy: $.spec.reclaimPolicy | default("Delete")
    # The CNAME a custom domain's DNS must point at, and the one the ACME challenge needs.
    cnameTarget: $.status.cnameTarget | default("")
    acmeTarget: $.status.acmeChallengeCNAMETarget | default("")
    wildcard: $.status.coveredByWildcardDomain.domain | default("")
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  legacyDomain:
    domain: $.status.domain | default($.spec.domain) | default("")
    id: $.status.id | default("")
    reclaimPolicy: $.spec.reclaimPolicy | default("Delete")
    cnameTarget: $.status.cnameTarget | default("")
    acmeTarget: $.status.acmeChallengeCNAMETarget | default("")
    wildcard: $.status.coveredByWildcardDomain.domain | default("")
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  operator:
    id: $.status.id | default("")
    region: $.spec.region | default("global")
    features: $.status.enabledFeatures | default($.spec.enabledFeatures) | default([])
    endpointSelectors: $.spec.binding.endpointSelectors | default([])
    ingressEndpoint: $.spec.binding.ingressEndpoint | default("")
    drained: $.status.drain.drainedResources | default(0)
    drainTotal: $.status.drain.totalResources | default(0)
    ready: conditions.Ready
    draining: conditions.Draining
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")

# First match wins. Ready's reason is the operator's own diagnosis; the Domain reasons it can
# carry are split into errors (critical) and the wait for a certificate (info).
health:
  agentEndpoint:
    - when: fields.createdStatus == "False"
      health: critical
      reason: notCreated
      message: "not created: {{ fields.createdReason }}: {{ fields.createdMessage }}"
    - when: fields.ready == false && fields.readyReason in ["DomainNotReady", "DomainInvalid", "ProvisioningError", "DomainCreationFailed", "DNSError", "DanglingDNSRecord", "ProtectedDomain"]
      health: critical
      reason: domainNotReady
      message: "domain not ready: {{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: fields.policyStatus == "False"
      health: warning
      reason: trafficPolicy
      message: "traffic policy not applied: {{ fields.policyMessage }}"
    - when: fields.ready == false && fields.readyReason in ["Pending", "Unknown", "WaitingForCertificate", "CertificateProvisioning", "DomainCreated"]
      health: info
      reason: provisioning
      message: "provisioning: {{ fields.readyMessage }}"
    - when: fields.ready == false
      health: warning
      reason: notReady
      message: "not ready: {{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: "!has(fields.ready)"
      health: info
      reason: waiting
      message: "waiting for the operator"
  cloudEndpoint:
    - when: fields.createdStatus == "False"
      health: critical
      reason: notCreated
      message: "not created: {{ fields.createdReason }}: {{ fields.createdMessage }}"
    - when: fields.ready == false && fields.readyReason in ["DomainNotReady", "DomainInvalid", "ProvisioningError", "DomainCreationFailed", "DNSError", "DanglingDNSRecord", "ProtectedDomain"]
      health: critical
      reason: domainNotReady
      message: "domain not ready: {{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: fields.policyStatus == "False"
      health: warning
      reason: trafficPolicy
      message: "traffic policy not applied: {{ fields.policyMessage }}"
    - when: fields.ready == false && fields.readyReason in ["Pending", "Unknown", "WaitingForCertificate", "CertificateProvisioning", "DomainCreated"]
      health: info
      reason: provisioning
      message: "provisioning: {{ fields.readyMessage }}"
    - when: fields.ready == false
      health: warning
      reason: notReady
      message: "not ready: {{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: "!has(fields.ready)"
      health: info
      reason: waiting
      message: "waiting for the operator"
  domain:
    - when: fields.ready == false && fields.readyReason in ["DomainInvalid", "ProvisioningError", "DomainCreationFailed", "DNSError", "DanglingDNSRecord", "ProtectedDomain"]
      health: critical
      reason: domainError
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: fields.ready == false && fields.readyReason == "ACMEChallengeRequired"
      health: warning
      reason: dnsRecordNeeded
      message: "DNS record needed: {{ fields.readyMessage }}"
    - when: fields.ready == false
      health: info
      reason: provisioning
      message: "provisioning: {{ fields.readyMessage }}"
    - when: "!has(fields.ready)"
      health: info
      reason: waiting
      message: "waiting for the operator"
  legacyDomain:
    - when: fields.readyReason == "SupersededByV1"
      health: idle
      reason: superseded
      message: "replaced by its ngrok.com/v1 Domain"
    - when: fields.ready == false && fields.readyReason in ["DomainInvalid", "ProvisioningError", "DomainCreationFailed", "DNSError", "DanglingDNSRecord", "ProtectedDomain"]
      health: critical
      reason: domainError
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: fields.ready == false && fields.readyReason == "ACMEChallengeRequired"
      health: warning
      reason: dnsRecordNeeded
      message: "DNS record needed: {{ fields.readyMessage }}"
    - when: fields.ready == false
      health: info
      reason: provisioning
      message: "provisioning: {{ fields.readyMessage }}"
    - when: "!has(fields.ready)"
      health: info
      reason: waiting
      message: "waiting for the operator"
  operator:
    - when: fields.ready == false && fields.readyReason in ["RegistrationFailed", "ConfigurationFailed"]
      health: critical
      reason: notRegistered
      message: "not registered with ngrok: {{ fields.readyMessage }}"
    - when: fields.draining == true
      health: info
      reason: draining
      message: "draining: {{ fields.drained }} of {{ fields.drainTotal }} resources"
    - when: fields.ready == false
      health: warning
      reason: notReady
      message: "not ready: {{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: "!has(fields.ready)"
      health: info
      reason: waiting
      message: "waiting for the operator"

dataServices:
  summary:
    aggregate:
      endpoints: count(agentEndpoint) + count(cloudEndpoint)
      failing: 'count(agentEndpoint, health == "critical") + count(cloudEndpoint, health == "critical")'
      notReady: 'count(agentEndpoint, health == "warning") + count(cloudEndpoint, health == "warning")'
      domainProblems: >-
        count(domain, health == "critical" || health == "warning")
        + count(legacyDomain, health == "critical" || health == "warning")
    health: >-
      worst([worst(agentEndpoint.health), worst(cloudEndpoint.health), worst(domain.health),
        worst(legacyDomain.health), worst(operator.health)])

cards:
  summary:
    title: { count: dataServices.summary.endpoints, one: "%d ngrok endpoint", other: "%d ngrok endpoints" }
    health: dataServices.summary.health
    badges:
      - { label: "failing", value: dataServices.summary.failing, tone: critical, hideWhenZero: true }
      - { label: "not ready", value: dataServices.summary.notReady, tone: warning, hideWhenZero: true }
      - { label: "domain problems", value: dataServices.summary.domainProblems, tone: warning, hideWhenZero: true }
  agentEndpoints:
    from: agentEndpoint
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No agent endpoints."
    row:
      title: 'fields.address != "" ? fields.address : $.metadata.name'
      subtitle: '$.metadata.namespace + "/" + $.metadata.name + " → " + fields.upstream'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Waiting")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "URL", value: fields.url, mono: true }
            - { label: "Assigned URL", value: fields.assignedURL, mono: true }
            - { label: "Upstream", value: fields.upstream, mono: true }
            - { label: "Protocol", value: fields.protocol }
            - { label: "Traffic policy", value: fields.trafficPolicy }
            - { label: "Message", value: fields.readyMessage }
        - type: badges
          items:
            - { label: "public", on: '"public" in fields.bindings' }
            - { label: "internal", on: '"internal" in fields.bindings' }
            - { label: "kubernetes", on: '"kubernetes" in fields.bindings' }
        - type: conditions
        - type: relations
          items:
            - { label: "Upstream Service", ref: fields.upstreamService }
            - { label: "Domain", ref: fields.domainRef }
  cloudEndpoints:
    from: cloudEndpoint
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No cloud endpoints."
    row:
      title: 'fields.address != "" ? fields.address : $.metadata.name'
      subtitle: '$.metadata.namespace + "/" + $.metadata.name'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Waiting")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "URL", value: fields.url, mono: true }
            - { label: "ID", value: fields.id, mono: true }
            - { label: "Traffic policy", value: fields.trafficPolicy }
            - { label: "Bindings", value: fields.bindings }
            - { label: "Pooling", value: fields.pooling }
            - { label: "Message", value: fields.readyMessage }
        - type: conditions
        - type: relations
          items:
            - { label: "Domain", ref: fields.domainRef }
  domains:
    from: domain
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No domains."
    row:
      title: 'fields.domain != "" ? fields.domain : $.metadata.name'
      subtitle: '$.metadata.namespace + "/" + $.metadata.name'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Waiting")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "ID", value: fields.id, mono: true }
            - { label: "CNAME target", value: fields.cnameTarget, mono: true }
            - { label: "ACME challenge target", value: fields.acmeTarget, mono: true }
            - { label: "Wildcard", value: fields.wildcard, mono: true }
            - { label: "Reclaim policy", value: fields.reclaimPolicy }
            - { label: "Message", value: fields.readyMessage }
        - type: conditions
  legacyDomains:
    from: legacyDomain
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No ingress.k8s.ngrok.com domains."
    row:
      title: 'fields.domain != "" ? fields.domain : $.metadata.name'
      subtitle: '$.metadata.namespace + "/" + $.metadata.name + " (ingress.k8s.ngrok.com)"'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Waiting")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "ID", value: fields.id, mono: true }
            - { label: "CNAME target", value: fields.cnameTarget, mono: true }
            - { label: "ACME challenge target", value: fields.acmeTarget, mono: true }
            - { label: "Wildcard", value: fields.wildcard, mono: true }
            - { label: "Reclaim policy", value: fields.reclaimPolicy }
            - { label: "Message", value: fields.readyMessage }
        - type: conditions
  operators:
    from: operator
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No operator registration."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: 'fields.ready == true ? "Registered" : (fields.readyReason != "" ? fields.readyReason : "Waiting")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "ID", value: fields.id, mono: true }
            - { label: "Region", value: fields.region }
            - { label: "Features", value: fields.features }
            - { label: "Endpoint selectors", value: fields.endpointSelectors, mono: true }
            - { label: "Ingress endpoint", value: fields.ingressEndpoint, mono: true }
            - { label: "Drained", value: 'fields.drainTotal > 0 ? string(fields.drained) + " / " + string(fields.drainTotal) : ""' }
            - { label: "Message", value: fields.readyMessage }
        - type: conditions

findings:
  - id: agent-endpoint-down
    from: agentEndpoint
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: agentEndpoints
  - id: agent-endpoint-not-ready
    from: agentEndpoint
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: agentEndpoints
  - id: cloud-endpoint-down
    from: cloudEndpoint
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: cloudEndpoints
  - id: cloud-endpoint-not-ready
    from: cloudEndpoint
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: cloudEndpoints
  - id: domain-error
    from: domain
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: domains
  - id: domain-dns-record
    from: domain
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: domains
  - id: legacy-domain-error
    from: legacyDomain
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: legacyDomains
  - id: legacy-domain-dns-record
    from: legacyDomain
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: legacyDomains
  - id: operator-not-registered
    from: operator
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: operators
  - id: operator-not-ready
    from: operator
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: operators

