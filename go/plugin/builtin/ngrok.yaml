# Invented names and hosts (example.ngrok.app, example.com, demo IDs). demo-shop's storefront
# is up behind its Domain; demo-lab's api-preview cannot reach its upstream (critical, linked
# to its Service), checkout's domain is invalid, docs' traffic policy is missing, metrics is
# still being created, reports waits on an ACME record, and queue has no status yet.
samples:
  agentEndpoint:
    - metadata: { name: storefront, namespace: demo-shop, creationTimestamp: now-12d }
      spec:
        url: https://shop-demo.example.ngrok.app
        upstream: { url: "http://storefront.demo-shop:8080" }
        bindings: [public]
      status:
        assignedURL: https://shop-demo.example.ngrok.app
        trafficPolicy: none
        domainRef: { name: shop-demo-example-ngrok-app, namespace: demo-shop }
        conditions:
          - { type: Ready, status: "True", reason: EndpointActive, message: "AgentEndpoint is active and ready", lastTransitionTime: now-12d }
          - { type: EndpointCreated, status: "True", reason: EndpointCreated, message: "Endpoint created", lastTransitionTime: now-12d }
    - metadata: { name: api-preview, namespace: demo-lab, creationTimestamp: now-2h }
      spec:
        url: https://api-preview.example.ngrok.app
        upstream: { url: "http://api-preview:9000", protocol: http2 }
        bindings: [public]
      status:
        domainRef: { name: api-preview-example-ngrok-app }
        conditions:
          - { type: Ready, status: "False", reason: UpstreamError, message: "dial tcp 10.96.14.2:9000: connect: connection refused", lastTransitionTime: now-2h }
          - { type: EndpointCreated, status: "False", reason: UpstreamError, message: "dial tcp 10.96.14.2:9000: connect: connection refused", lastTransitionTime: now-2h }
    - metadata: { name: checkout, namespace: demo-shop, creationTimestamp: now-1d }
      spec:
        url: https://checkout.example.com
        upstream: { url: "http://checkout.demo-shop.svc.cluster.local:8080" }
        bindings: [public]
      status:
        domainRef: { name: checkout-example-com, namespace: demo-shop }
        conditions:
          - { type: Ready, status: "False", reason: DomainInvalid, message: "the domain checkout.example.com is not a valid hostname for this account", lastTransitionTime: now-1d }
    - metadata: { name: docs, namespace: demo-lab, creationTimestamp: now-3d }
      spec:
        url: https://docs-demo.example.ngrok.app
        upstream: { url: "http://docs.demo-lab:80" }
        bindings: [public]
        trafficPolicy: { targetRef: { name: docs-auth } }
      status:
        trafficPolicy: docs-auth
        conditions:
          - { type: Ready, status: "False", reason: TrafficPolicyNotFound, message: "NgrokTrafficPolicy demo-lab/docs-auth not found", lastTransitionTime: now-3h }
          - { type: TrafficPolicyApplied, status: "False", reason: TrafficPolicyError, message: "NgrokTrafficPolicy demo-lab/docs-auth not found", lastTransitionTime: now-3h }
    - metadata: { name: metrics, namespace: demo-lab, creationTimestamp: now-30s }
      spec:
        url: https://metrics.demo.internal
        upstream: { url: "9090" }
        bindings: [internal]
      status:
        conditions:
          - { type: Ready, status: "False", reason: Pending, message: "Waiting for endpoint creation", lastTransitionTime: now-30s }
    - metadata: { name: reports, namespace: demo-shop, creationTimestamp: now-40m }
      spec:
        url: https://reports.example.com
        upstream: { url: "http://reports:8080" }
        bindings: [public]
      status:
        conditions:
          - { type: Ready, status: "False", reason: ACMEChallengeRequired, message: "add the CNAME _acme-challenge.reports.example.com to complete the challenge", lastTransitionTime: now-40m }
          - { type: EndpointCreated, status: "True", reason: EndpointCreated, message: "Endpoint created", lastTransitionTime: now-40m }
    - metadata: { name: queue, namespace: demo-lab, creationTimestamp: now-5s }
      spec:
        url: tcp://
        upstream: { url: "tcp://queue.demo-lab:5672" }
  cloudEndpoint:
    - metadata: { name: shop-edge, namespace: demo-shop, creationTimestamp: now-12d }
      spec:
        url: https://shop-edge.example.ngrok.app
        bindings: [public]
        poolingEnabled: true
        trafficPolicy: { targetRef: { name: edge-routes } }
      status:
        id: ep_2demoShopEdge0000000000000
        domainRef: { name: shop-edge-example-ngrok-app, namespace: demo-shop }
        conditions:
          - { type: Ready, status: "True", reason: CloudEndpointActive, message: "CloudEndpoint is active and ready", lastTransitionTime: now-12d }
          - { type: CloudEndpointCreated, status: "True", reason: CloudEndpointCreated, message: "CloudEndpoint created", lastTransitionTime: now-12d }
    - metadata: { name: lab-edge, namespace: demo-lab, creationTimestamp: now-1h }
      spec:
        url: https://lab-edge.example.ngrok.app
        trafficPolicy: { inline: { on_http_request: [] } }
      status:
        conditions:
          - { type: Ready, status: "False", reason: CloudEndpointCreationFailed, message: "the account has reached its endpoint limit", lastTransitionTime: now-1h }
          - { type: CloudEndpointCreated, status: "False", reason: CloudEndpointCreationFailed, message: "the account has reached its endpoint limit", lastTransitionTime: now-1h }
    - metadata: { name: beta-edge, namespace: demo-lab, creationTimestamp: now-6h }
      spec:
        url: https://beta.example.com
      status:
        domainRef: { name: beta-example-com, namespace: demo-lab }
        conditions:
          - { type: Ready, status: "False", reason: DomainInvalid, message: "the domain beta.example.com is not a valid hostname for this account", lastTransitionTime: now-6h }
    - metadata: { name: auth-edge, namespace: demo-shop, creationTimestamp: now-2d }
      spec:
        url: https://auth-edge.example.ngrok.app
        trafficPolicy: { targetRef: { name: sso } }
      status:
        conditions:
          - { type: Ready, status: "False", reason: TrafficPolicyError, message: "invalid traffic policy: unknown action \"oauth2\"", lastTransitionTime: now-2d }
          - { type: TrafficPolicyApplied, status: "False", reason: TrafficPolicyError, message: "invalid traffic policy: unknown action \"oauth2\"", lastTransitionTime: now-2d }
    - metadata: { name: status-edge, namespace: demo-shop, creationTimestamp: now-1m }
      spec:
        url: https://status-demo.example.ngrok.app
      status:
        conditions:
          - { type: Ready, status: "False", reason: Pending, message: "Waiting for CloudEndpoint to be ready", lastTransitionTime: now-1m }
    - metadata: { name: blog-edge, namespace: demo-shop, creationTimestamp: now-20m }
      spec:
        url: https://blog.example.com
      status:
        conditions:
          - { type: Ready, status: "False", reason: ACMEChallengeRequired, message: "add the CNAME _acme-challenge.blog.example.com to complete the challenge", lastTransitionTime: now-20m }
    - metadata: { name: new-edge, namespace: demo-lab, creationTimestamp: now-5s }
      spec:
        url: https://new-edge.example.ngrok.app
  domain:
    - metadata: { name: shop-demo-example-ngrok-app, namespace: demo-shop, creationTimestamp: now-12d }
      spec: { domain: shop-demo.example.ngrok.app, reclaimPolicy: Delete }
      status:
        id: rd_2demoShopDomain00000000000
        domain: shop-demo.example.ngrok.app
        conditions:
          - { type: Ready, status: "True", reason: DomainActive, message: "Domain is ready", lastTransitionTime: now-12d }
    - metadata: { name: checkout-example-com, namespace: demo-shop, creationTimestamp: now-1d }
      spec: { domain: checkout.example.com, reclaimPolicy: Retain }
      status:
        domain: checkout.example.com
        conditions:
          - { type: Ready, status: "False", reason: DomainInvalid, message: "the domain checkout.example.com is not a valid hostname for this account", lastTransitionTime: now-1d }
    - metadata: { name: reports-example-com, namespace: demo-shop, creationTimestamp: now-40m }
      spec: { domain: reports.example.com }
      status:
        id: rd_2demoReportsDomain000000000
        domain: reports.example.com
        cnameTarget: 3demo.cname.example.ngrok-dns.com
        acmeChallengeCNAMETarget: 3demo.acme.example.ngrok-dns.com
        conditions:
          - { type: Ready, status: "False", reason: ACMEChallengeRequired, message: "add the CNAME _acme-challenge.reports.example.com to complete the challenge", lastTransitionTime: now-40m }
    - metadata: { name: api-example-com, namespace: demo-lab, creationTimestamp: now-5m }
      spec: { domain: api.example.com }
      status:
        domain: api.example.com
        coveredByWildcardDomain: { domain: "*.example.com" }
        conditions:
          - { type: Ready, status: "False", reason: WaitingForCertificate, message: "waiting for the certificate to be issued", lastTransitionTime: now-5m }
    - metadata: { name: fresh-example-com, namespace: demo-lab, creationTimestamp: now-5s }
      spec: { domain: fresh.example.com }
  legacyDomain:
    - metadata: { name: shop-demo-example-ngrok-app, namespace: demo-shop, creationTimestamp: now-90d }
      spec: { domain: shop-demo.example.ngrok.app }
      status:
        domain: shop-demo.example.ngrok.app
        conditions:
          - { type: Ready, status: "False", reason: SupersededByV1, message: "superseded by the ngrok.com/v1 Domain", lastTransitionTime: now-12d }
    - metadata: { name: api-preview-example-ngrok-app, namespace: demo-lab, creationTimestamp: now-30d }
      spec: { domain: api-preview.example.ngrok.app }
      status:
        id: rd_2demoPreviewDomain0000000000
        domain: api-preview.example.ngrok.app
        conditions:
          - { type: Ready, status: "True", reason: DomainActive, message: "Domain is ready", lastTransitionTime: now-30d }
    - metadata: { name: beta-example-com, namespace: demo-lab, creationTimestamp: now-6h }
      spec: { domain: beta.example.com }
      status:
        domain: beta.example.com
        conditions:
          - { type: Ready, status: "False", reason: DomainInvalid, message: "the domain beta.example.com is not a valid hostname for this account", lastTransitionTime: now-6h }
    - metadata: { name: blog-example-com, namespace: demo-shop, creationTimestamp: now-20m }
      spec: { domain: blog.example.com }
      status:
        domain: blog.example.com
        acmeChallengeCNAMETarget: 4demo.acme.example.ngrok-dns.com
        conditions:
          - { type: Ready, status: "False", reason: ACMEChallengeRequired, message: "add the CNAME _acme-challenge.blog.example.com to complete the challenge", lastTransitionTime: now-20m }
    - metadata: { name: status-demo-example-ngrok-app, namespace: demo-shop, creationTimestamp: now-1m }
      spec: { domain: status-demo.example.ngrok.app }
      status:
        domain: status-demo.example.ngrok.app
        conditions:
          - { type: Ready, status: "False", reason: CertificateProvisioning, message: "provisioning the certificate", lastTransitionTime: now-1m }
    - metadata: { name: new-edge-example-ngrok-app, namespace: demo-lab, creationTimestamp: now-5s }
      spec: { domain: new-edge.example.ngrok.app }
  operator:
    - metadata: { name: ngrok-operator, namespace: demo-ngrok, creationTimestamp: now-90d }
      spec:
        region: global
        enabledFeatures: [ingress, gateway, bindings]
        binding: { endpointSelectors: ["true"], ingressEndpoint: "kubernetes-binding-ingress.example.ngrok.app:443" }
      status:
        id: k8sop_2demoOperator000000000
        enabledFeatures: [ingress, gateway, bindings]
        conditions:
          - { type: Ready, status: "True", reason: Registered, message: "registered with ngrok", lastTransitionTime: now-90d }
          - { type: Registered, status: "True", reason: Registered, message: "registered with ngrok", lastTransitionTime: now-90d }
    - metadata: { name: ngrok-operator, namespace: demo-lab, creationTimestamp: now-10m }
      spec: { enabledFeatures: [ingress] }
      status:
        conditions:
          - { type: Ready, status: "False", reason: RegistrationFailed, message: "the API key is not valid", lastTransitionTime: now-10m }
          - { type: Registered, status: "False", reason: RegistrationFailed, message: "the API key is not valid", lastTransitionTime: now-10m }
    - metadata: { name: ngrok-operator, namespace: demo-old, creationTimestamp: now-200d }
      spec: { enabledFeatures: [ingress] }
      status:
        id: k8sop_2demoOldOperator0000000
        drain: { drainedResources: 7, totalResources: 12 }
        conditions:
          - { type: Ready, status: "False", reason: Draining, message: "draining the operator's resources", lastTransitionTime: now-3m }
          - { type: Draining, status: "True", reason: DrainInProgress, message: "7 of 12 resources drained", lastTransitionTime: now-3m }
    - metadata: { name: ngrok-operator, namespace: demo-preview, creationTimestamp: now-1h }
      spec: { enabledFeatures: [ingress] }
      status:
        conditions:
          - { type: Ready, status: "False", reason: Pending, message: "waiting for the API", lastTransitionTime: now-1h }
    - metadata: { name: ngrok-operator, namespace: demo-new, creationTimestamp: now-5s }
      spec: { enabledFeatures: [ingress] }
  service:
    - metadata: { name: storefront, namespace: demo-shop }
    - metadata: { name: api-preview, namespace: demo-lab }
    - metadata: { name: checkout, namespace: demo-shop }
    - metadata: { name: docs, namespace: demo-lab }
