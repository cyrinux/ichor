# yaml-language-server: $schema=../schema/plugin.schema.json
# The community Cloudflare operator (adyanth/cloudflare-operator, networking.cfargotunnel.com)
# runs cloudflared for a Tunnel (namespaced) or a ClusterTunnel, and a TunnelBinding routes
# hostnames of the tunnel's domain to Services of its own namespace (subjects[], with tunnelRef
# at the top level, not under spec). Cloudflare ships no operator of its own; a cluster running
# bare cloudflared serves no group and gets no tile (it stays an app catalog row).
# The objects carry no conditions: a Tunnel's status holds the tunnel ID and name once it exists
# on Cloudflare (the rest is reported as events), and a binding's status lists the hostnames it
# published. The operator runs cloudflared as a Deployment named after the tunnel, labelled
# cfargotunnel.com/app=cloudflared, in the tunnel's namespace (a ClusterTunnel's in the
# operator's own namespace): its ready replicas are the tunnel's health.
# The tunnel spec names a credentials Secret and a Cloudflare account: neither is shown.
# Read from config/crd/bases/ and internal/controller/*.go (main, 2026-11-11): Tunnel and
# ClusterTunnel are stored as v1alpha2 (v1alpha1 is still served), TunnelBinding is v1alpha1.
# A fork (networking.cloudflare-operator.io, other kinds) is not built in: its users import a
# copy of this file as a user plugin with the group, versions and kinds changed.
schemaVersion: ichor.dev/plugin/v1alpha1
id: cloudflare-tunnel
name: Cloudflare Tunnel
website: https://github.com/adyanth/cloudflare-operator
icon: cloudflare
category: networking
catalogId: cloudflared

detect:
  - group: networking.cfargotunnel.com

resources:
  tunnel:
    group: networking.cfargotunnel.com
    version: v1alpha2
    resource: tunnels
    kind: Tunnel
    scope: Namespaced
    optional: true
  clusterTunnel:
    group: networking.cfargotunnel.com
    version: v1alpha2
    resource: clustertunnels
    kind: ClusterTunnel
    scope: Cluster
    optional: true
  binding:
    group: networking.cfargotunnel.com
    version: v1alpha1
    resource: tunnelbindings
    kind: TunnelBinding
    scope: Namespaced
    optional: true
  # The cloudflared Deployments the operator runs, one per tunnel.
  deployment:
    group: apps
    version: v1
    resource: deployments
    kind: Deployment
    scope: Namespaced
    list: { labelSelector: cfargotunnel.com/app=cloudflared }
    optional: true
  # The Services a binding routes to: names only.
  service:
    group: ""
    version: v1
    resource: services
    kind: Service
    scope: Namespaced
    list: { metadataOnly: true, limit: 2000 }
    optional: true

fields:
  tunnel:
    tunnelName: $.status.tunnelName | default($.spec.newTunnel.name) | default($.spec.existingTunnel.name) | default("")
    tunnelID: $.status.tunnelId | default("")
    domain: $.spec.cloudflare.domain | default("")
    mode: 'has($.spec.existingTunnel) ? "existing" : "new"'
    protocol: $.spec.protocol | default("auto")
    fallback: $.spec.fallbackTarget | default("http_status:404")
    deploymentRef: join(deployment, $.metadata.namespace == left.metadata.namespace && $.metadata.name == left.metadata.name)
    readyReplicas: fields.deploymentRef.status.readyReplicas | default(0)
    wantedReplicas: fields.deploymentRef.spec.replicas | default(1)
  clusterTunnel:
    tunnelName: $.status.tunnelName | default($.spec.newTunnel.name) | default($.spec.existingTunnel.name) | default("")
    tunnelID: $.status.tunnelId | default("")
    domain: $.spec.cloudflare.domain | default("")
    mode: 'has($.spec.existingTunnel) ? "existing" : "new"'
    protocol: $.spec.protocol | default("auto")
    fallback: $.spec.fallbackTarget | default("http_status:404")
    # In the operator's namespace, which the object does not name: matched by name.
    deploymentRef: join(deployment, $.metadata.name == left.metadata.name)
    readyReplicas: fields.deploymentRef.status.readyReplicas | default(0)
    wantedReplicas: fields.deploymentRef.spec.replicas | default(1)
  binding:
    tunnelKind: $.tunnelRef.kind | default("Tunnel")
    tunnelName: $.tunnelRef.name | default("")
    dnsUpdates: '$.tunnelRef.disableDNSUpdates == true ? "off" : "on"'
    subjects: len($.subjects)
    subjectNames: join($.subjects[*].name, ", ")
    # The FQDNs printer column: the hostnames, comma-separated.
    hostnames: join(split($.status.hostnames | default(""), ","), ", ")
    hostname: $.status.services[*].hostname | first() | default("")
    targets: join($.status.services[*].target, ", ")
    tunnelRef: >-
      fields.tunnelKind == "ClusterTunnel"
        ? join(clusterTunnel, $.metadata.name == fields.tunnelName)
        : join(tunnel, $.metadata.namespace == left.metadata.namespace && $.metadata.name == fields.tunnelName)
    service0: join(service, $.metadata.namespace == left.metadata.namespace && $.metadata.name == left.subjects[0].name)
    service1: join(service, $.metadata.namespace == left.metadata.namespace && $.metadata.name == left.subjects[1].name)
    service2: join(service, $.metadata.namespace == left.metadata.namespace && $.metadata.name == left.subjects[2].name)
    service3: join(service, $.metadata.namespace == left.metadata.namespace && $.metadata.name == left.subjects[3].name)

# First match wins. A tunnel that is not on Cloudflare after ten minutes is stuck (bad
# credentials, a name already in use: the events say which); before that it is being created.
health:
  tunnel:
    - when: fields.tunnelID == "" && age($.metadata.creationTimestamp) > 600000
      health: warning
      reason: notCreated
      message: "not created on Cloudflare: see the object's events"
    - when: fields.tunnelID == ""
      health: info
      reason: creating
      message: "being created on Cloudflare"
    - when: has(fields.deploymentRef) && fields.readyReplicas == 0
      health: critical
      reason: down
      message: "cloudflared: 0 of {{ fields.wantedReplicas }} replicas ready"
    - when: has(fields.deploymentRef) && fields.readyReplicas < fields.wantedReplicas
      health: warning
      reason: degraded
      message: "cloudflared: {{ fields.readyReplicas }} of {{ fields.wantedReplicas }} replicas ready"
  clusterTunnel:
    - when: fields.tunnelID == "" && age($.metadata.creationTimestamp) > 600000
      health: warning
      reason: notCreated
      message: "not created on Cloudflare: see the object's events"
    - when: fields.tunnelID == ""
      health: info
      reason: creating
      message: "being created on Cloudflare"
    - when: has(fields.deploymentRef) && fields.readyReplicas == 0
      health: critical
      reason: down
      message: "cloudflared: 0 of {{ fields.wantedReplicas }} replicas ready"
    - when: has(fields.deploymentRef) && fields.readyReplicas < fields.wantedReplicas
      health: warning
      reason: degraded
      message: "cloudflared: {{ fields.readyReplicas }} of {{ fields.wantedReplicas }} replicas ready"
  binding:
    - when: fields.tunnelName != "" && !has(fields.tunnelRef)
      health: warning
      reason: tunnelMissing
      message: "its {{ fields.tunnelKind }} {{ fields.tunnelName }} does not exist"
    - when: fields.hostname == ""
      health: info
      reason: notPublished
      message: "no hostname published yet"

dataServices:
  summary:
    aggregate:
      tunnels: count(tunnel) + count(clusterTunnel)
      tunnelsDown: 'count(tunnel, health == "critical") + count(clusterTunnel, health == "critical")'
      tunnelProblems: 'count(tunnel, health == "warning") + count(clusterTunnel, health == "warning")'
      bindings: count(binding)
      bindingProblems: 'count(binding, health == "warning")'
    health: worst([worst(tunnel.health), worst(clusterTunnel.health), worst(binding.health)])

cards:
  summary:
    title: { count: dataServices.summary.tunnels, one: "%d Cloudflare tunnel", other: "%d Cloudflare tunnels" }
    health: dataServices.summary.health
    badges:
      - { label: "bindings", value: dataServices.summary.bindings, tone: info }
      - { label: "tunnels down", value: dataServices.summary.tunnelsDown, tone: critical, hideWhenZero: true }
      - { label: "tunnel problems", value: dataServices.summary.tunnelProblems, tone: warning, hideWhenZero: true }
      - { label: "binding problems", value: dataServices.summary.bindingProblems, tone: warning, hideWhenZero: true }
  bindings:
    from: binding
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No tunnel bindings."
    row:
      title: 'fields.hostname != "" ? fields.hostname : $.metadata.name'
      subtitle: '$.metadata.namespace + "/" + $.metadata.name + " → " + fields.tunnelName'
      status:
        tone: health
        text: 'fields.hostname != "" ? "Published" : "Pending"'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "Hostnames", value: fields.hostnames, mono: true }
            - { label: "Targets", value: fields.targets, mono: true }
            - { label: "Services", value: fields.subjectNames, mono: true }
            - { label: "Tunnel", value: 'fields.tunnelKind + " " + fields.tunnelName', mono: true }
            - { label: "DNS updates", value: fields.dnsUpdates }
        - type: relations
          items:
            - { label: "Tunnel", ref: fields.tunnelRef }
            - { label: "Service", ref: '[fields.service0, fields.service1, fields.service2, fields.service3]' }
  tunnels:
    from: tunnel
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No tunnels."
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + (fields.domain != "" ? " · " + fields.domain : "")'
      status:
        tone: health
        text: 'fields.tunnelID == "" ? "Pending" : (has(fields.deploymentRef) ? string(fields.readyReplicas) + "/" + string(fields.wantedReplicas) : "Created")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "Tunnel name", value: fields.tunnelName, mono: true }
            - { label: "Tunnel ID", value: fields.tunnelID, mono: true }
            - { label: "Domain", value: fields.domain, mono: true }
            - { label: "Tunnel", value: fields.mode }
            - { label: "Protocol", value: fields.protocol }
            - { label: "Fallback", value: fields.fallback, mono: true }
        - type: relations
          items:
            - { label: "cloudflared", ref: fields.deploymentRef }
  clusterTunnels:
    from: clusterTunnel
    sort: [health desc, $.metadata.name]
    empty: "No cluster tunnels."
    row:
      title: $.metadata.name
      subtitle: 'fields.domain != "" ? "ClusterTunnel · " + fields.domain : "ClusterTunnel"'
      status:
        tone: health
        text: 'fields.tunnelID == "" ? "Pending" : (has(fields.deploymentRef) ? string(fields.readyReplicas) + "/" + string(fields.wantedReplicas) : "Created")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "Tunnel name", value: fields.tunnelName, mono: true }
            - { label: "Tunnel ID", value: fields.tunnelID, mono: true }
            - { label: "Domain", value: fields.domain, mono: true }
            - { label: "Tunnel", value: fields.mode }
            - { label: "Protocol", value: fields.protocol }
            - { label: "Fallback", value: fields.fallback, mono: true }
        - type: relations
          items:
            - { label: "cloudflared", ref: fields.deploymentRef }

findings:
  - { id: tunnel-down, from: tunnel, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: tunnels }
  - { id: tunnel-problem, from: tunnel, when: 'health == "warning"', severity: warning, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: tunnels }
  - { id: cluster-tunnel-down, from: clusterTunnel, when: 'health == "critical"', severity: critical, title: "{{ name }}", detail: "{{ message }}", opens: clusterTunnels }
  - { id: cluster-tunnel-problem, from: clusterTunnel, when: 'health == "warning"', severity: warning, title: "{{ name }}", detail: "{{ message }}", opens: clusterTunnels }
  - { id: binding-problem, from: binding, when: 'health == "warning"', severity: warning, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: bindings }

