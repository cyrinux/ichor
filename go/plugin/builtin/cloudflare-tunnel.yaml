samples:
  tunnel:
    - metadata: { name: shop-tunnel, namespace: demo-shop, creationTimestamp: now-30d }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: shop-tunnel }
        protocol: quic
      status: { tunnelId: 00000000-0000-4000-8000-000000000001, tunnelName: shop-tunnel, accountId: "", zoneId: "" }
    - metadata: { name: lab-tunnel, namespace: demo-lab, creationTimestamp: now-5d }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        existingTunnel: { name: lab }
      status: { tunnelId: 00000000-0000-4000-8000-000000000002, tunnelName: lab, accountId: "", zoneId: "" }
    - metadata: { name: api-tunnel, namespace: demo-shop, creationTimestamp: now-12d }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: api-tunnel }
      status: { tunnelId: 00000000-0000-4000-8000-000000000005, tunnelName: api-tunnel, accountId: "", zoneId: "" }
    - metadata: { name: stuck-tunnel, namespace: demo-lab, creationTimestamp: now-2h }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: stuck-tunnel }
    - metadata: { name: new-tunnel, namespace: demo-shop, creationTimestamp: now-30s }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: new-tunnel }
  clusterTunnel:
    - metadata: { name: edge, creationTimestamp: now-60d }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: edge }
        protocol: http2
      status: { tunnelId: 00000000-0000-4000-8000-000000000003, tunnelName: edge, accountId: "", zoneId: "" }
    - metadata: { name: backoffice, creationTimestamp: now-20d }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: backoffice }
      status: { tunnelId: 00000000-0000-4000-8000-000000000004, tunnelName: backoffice, accountId: "", zoneId: "" }
    - metadata: { name: intranet, creationTimestamp: now-90d }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        existingTunnel: { name: intranet }
      status: { tunnelId: 00000000-0000-4000-8000-000000000006, tunnelName: intranet, accountId: "", zoneId: "" }
    - metadata: { name: partner, creationTimestamp: now-1d }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: partner }
    - metadata: { name: staging, creationTimestamp: now-1m }
      spec:
        cloudflare: { domain: demo-lab.example, secret: cloudflare-api }
        newTunnel: { name: staging }
  binding:
    - metadata: { name: storefront, namespace: demo-shop, creationTimestamp: now-29d }
      subjects: [{ kind: Service, name: storefront, spec: { fqdn: shop.demo-lab.example } }]
      tunnelRef: { kind: Tunnel, name: shop-tunnel }
      status:
        hostnames: shop.demo-lab.example
        services: [{ hostname: shop.demo-lab.example, target: "http://storefront.demo-shop.svc:80" }]
    - metadata: { name: wiki, namespace: demo-lab, creationTimestamp: now-3h }
      subjects: [{ kind: Service, name: wiki }]
      tunnelRef: { kind: Tunnel, name: old-tunnel }
      status:
        hostnames: wiki.demo-lab.example
        services: [{ hostname: wiki.demo-lab.example, target: "http://wiki.demo-lab.svc:80" }]
    - metadata: { name: dashboards, namespace: demo-lab, creationTimestamp: now-10d }
      subjects: [{ kind: Service, name: grafana }, { kind: Service, name: prometheus, spec: { fqdn: metrics.demo-lab.example } }]
      tunnelRef: { kind: ClusterTunnel, name: edge }
      status:
        hostnames: grafana.demo-lab.example,metrics.demo-lab.example
        services:
          - { hostname: grafana.demo-lab.example, target: "http://grafana.demo-lab.svc:3000" }
          - { hostname: metrics.demo-lab.example, target: "http://prometheus.demo-lab.svc:9090" }
