# yaml-language-server: $schema=../schema/plugin.schema.json
# draino (draino.acides.org) drains a node when a condition holds: one cluster-scoped NodeDrain
# names the node, the condition (a PromQL query…) and how often it is evaluated, and the
# controller runs a kubectl drain pod when it matches. A NodeDrain the controller refuses
# (status.validationError) never drains anything: that is the one critical state. A disabled
# one, a dry run (spec.debug) and one not evaluated yet are shown for information. Each row
# shows its node and when it last drained; the details hold the condition, the interval, the
# flags and the last evaluation.
schemaVersion: ichor.dev/plugin/v1alpha1
id: draino
name: draino
website: https://forge.tedomum.net/acides/draino
category: compute

detect:
  - group: draino.acides.org
    resource: nodedrains

resources:
  nodedrain:
    group: draino.acides.org
    version: v1alpha1
    resource: nodedrains
    kind: NodeDrain
    scope: Cluster

fields:
  nodedrain:
    # Type indicates the type of condition.
    conditionType: $.spec.condition.type | default("")
    # Do a dry-run drain for debugging.
    debug: $.spec.debug | default(false)
    # Enable the drain.
    enable: $.spec.enable | default(false)
    # Force drain.
    force: $.spec.force | default(true)
    # The image of the kubectl pod that runs the drain.
    image: '$.spec.image | default("bitnami/kubectl:latest")'
    # How often the condition is evaluated (e.g., "30s", "2m").
    interval: '$.spec.interval | default("2m")'
    # The node to drain.
    node: $.spec.node | default("")
    # When the condition was last evaluated; null until the first evaluation.
    checkedAt: $.status.lastCheckTime | time()
    # When the node was last drained successfully; null when it never was.
    drainedAt: $.status.lastDrainTime | time()
    # The controller's validation error, "" when the NodeDrain is accepted.
    validationError: $.status.validationError | default("")
    notEvaluated: $.status.lastCheckTime == null

health:
  nodedrain:
    - { when: fields.validationError != "", health: critical, reason: invalid, message: "invalid: {{ fields.validationError }}" }
    - { when: "!fields.enable", health: info, reason: disabled, message: "disabled: the node is never drained" }
    - { when: fields.debug, health: info, reason: dryRun, message: "dry run: the condition is evaluated but the node is not drained" }
    - { when: fields.notEvaluated, health: info, reason: notEvaluatedYet, message: "not evaluated yet" }

dataServices:
  summary:
    aggregate:
      total: count(nodedrain)
      invalid: 'count(nodedrain, health == "critical")'
      disabled: 'count(nodedrain, !fields.enable)'
    health: worst(nodedrain.health)

cards:
  summary:
    title:
      count: dataServices.summary.total
      one: "%d NodeDrain"
      other: "%d NodeDrains"
    health: dataServices.summary.health
    badges:
      - label: "invalid"
        value: dataServices.summary.invalid
        tone: critical
        hideWhenZero: true
      - label: "disabled"
        value: dataServices.summary.disabled
        tone: info
        hideWhenZero: true
  list:
    from: nodedrain
    sort:
      - health desc
      - $.metadata.name
    empty: "No NodeDrains."
    row:
      title: $.metadata.name
      status:
        tone: health
        text: fields.node
      trailing:
        text: fields.drainedAt | relativeTime()
      detail:
        - type: keyValues
          items:
            - label: "Node"
              value: fields.node
            - label: "Condition type"
              value: fields.conditionType
            - label: "Interval"
              value: fields.interval
            - label: "Enabled"
              value: fields.enable
            - label: "Force"
              value: fields.force
            - label: "Dry run"
              value: fields.debug
            - label: "Image"
              value: fields.image
            - label: "Last check"
              value: fields.checkedAt | relativeTime()
            - label: "Last drain"
              value: fields.drainedAt | relativeTime()
            - label: "Age"
              value: $.metadata.creationTimestamp | relativeTime()

findings:
  - id: invalid
    from: nodedrain
    when: health == "critical"
    severity: critical
    title: "{{ name }}"
    detail: "{{ message }}"
    opens: list

