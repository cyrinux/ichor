# Invented names. demo-shop is healthy and drained once; demo-lab is refused by the controller;
# demo-idle is disabled; demo-dry is a dry run; demo-fresh was never evaluated.
samples:
  nodedrain:
    - metadata:
        creationTimestamp: now-3d
        name: demo-shop
      spec:
        condition:
          type: PromQLQuery
        enable: true
        interval: 2m
        node: demo-node-1
      status:
        lastCheckTime: now-1m
        lastDrainTime: now-2d
    - metadata:
        creationTimestamp: now-4m
        name: demo-lab
      spec:
        condition:
          type: PromQLQuery
        enable: true
        interval: soon
        node: demo-node-2
      status:
        validationError: "interval: invalid duration \"soon\""
    - metadata:
        creationTimestamp: now-5d
        name: demo-idle
      spec:
        condition:
          type: PromQLQuery
        enable: false
        node: demo-node-3
      status:
        lastCheckTime: now-5d
    - metadata:
        creationTimestamp: now-2h
        name: demo-dry
      spec:
        condition:
          type: PromQLQuery
        debug: true
        enable: true
        node: demo-node-4
      status:
        lastCheckTime: now-2m
    - metadata:
        creationTimestamp: now-30s
        name: demo-fresh
      spec:
        condition:
          type: PromQLQuery
        enable: true
        node: demo-node-5
