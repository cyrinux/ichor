# yaml-language-server: $schema=../schema/plugin.schema.json
# Sealed Secrets (bitnami.com) decrypts each SealedSecret into a Secret with a key the
# controller keeps in its namespace. A SealedSecret that does not unseal leaves its workload
# without its Secret, silently: each one shows whether it unsealed (its Synced condition),
# with its scope and how many values it carries (never their values). The controller is the
# Deployment running the catalog's Sealed Secrets image (source: native, so that an install
# renamed by hand is found too); the sealing keys are the Secrets it labels (their values
# masked). Without a ready controller or an active key, nothing unseals.
# go/ichorgo/plugin_sealedsecrets_test.go holds it to the reader the apps used before.
schemaVersion: ichor.dev/plugin/v1alpha1
id: sealed-secrets
name: Sealed Secrets
website: https://github.com/bitnami-labs/sealed-secrets
icon: sealed-secrets
category: security
catalogId: sealed-secrets

# bitnami.com is shared: the resource tells Sealed Secrets apart.
detect:
  - group: bitnami.com
    resource: sealedsecrets

resources:
  sealedSecret:
    group: bitnami.com
    version: v1alpha1
    resource: sealedsecrets
    kind: SealedSecret
    scope: Namespaced
  sealingKey:
    group: ""
    version: v1
    resource: secrets
    kind: Secret
    scope: Namespaced
    # Metadata only: the private keys never leave the API server.
    list: { labelSelector: "sealedsecrets.bitnami.com/sealed-secrets-key", metadataOnly: true }
  controller:
    group: apps
    version: v1
    resource: deployments
    kind: Deployment
    scope: Namespaced
    source: native:sealed-secrets-controller

fields:
  sealedSecret:
    keyCount: len($.spec.encryptedData)
    type: $.spec.template.type | default("")
    immutable: $.spec.template.immutable | default(false)
    scope: |
      $.metadata.annotations["sealedsecrets.bitnami.com/cluster-wide"] == "true" ? "cluster-wide"
        : ($.metadata.annotations["sealedsecrets.bitnami.com/namespace-wide"] == "true" ? "namespace-wide" : "strict")
    synced: conditions.Synced == true
    # "Unknown" is not a failure: only False is.
    notSynced: condition("Synced").status | default("") == "False"
    syncReason: condition("Synced").reason | default("")
    # The controller leaves a SealedSecret alone when a Secret of that name is not its own.
    unmanaged: fields.notSynced && fields.syncReason == "Unmanaged"
    stale: ($.metadata.generation | default(0)) > ($.status.observedGeneration | default(0))
    createdAt: time($.metadata.creationTimestamp)
  sealingKey:
    state: $.metadata.labels["sealedsecrets.bitnami.com/sealed-secrets-key"] | default("")
    active: fields.state == "active"
    compromised: fields.state == "compromised"
    createdAt: time($.metadata.creationTimestamp)
  controller:
    replicas: $.spec.replicas | default(1)
    readyReplicas: $.status.readyReplicas | default(0)
    ready: fields.replicas > 0 && fields.readyReplicas >= fields.replicas

health:
  sealedSecret:
    - { when: fields.notSynced && !fields.unmanaged, health: critical, reason: notSynced, message: "failed to unseal: its Secret is missing or outdated" }
    - { when: fields.unmanaged, health: warning, reason: unmanaged, message: "a Secret with this name exists that it does not own" }
    - { when: fields.stale, health: warning, reason: stale, message: "a newer version is not observed yet" }
  sealingKey:
    - { when: fields.compromised, health: warning, reason: keyCompromised, message: "a sealing key is marked compromised" }
  controller:
    - { when: "!fields.ready", health: critical, reason: controllerDown, message: "the controller is not running: nothing gets unsealed" }

dataServices:
  # No active key is critical only when the keys could be read: a role that may not list
  # Secrets sees none, which says nothing.
  keys:
    aggregate:
      active: count(sealingKey, fields.active)
      compromised: count(sealingKey, fields.compromised)
      noActive: readable(sealingKey) && count(sealingKey, fields.active) == 0
      # The controller renews its key every 30 days: an older newest key means renewal is stuck.
      stale: 'max(sealingKey, fields.active ? fields.createdAt : null) > 0 && now - max(sealingKey, fields.active ? fields.createdAt : null) > 2592000000'
    health: |
      readable(sealingKey) && count(sealingKey, fields.active) == 0 ? "critical"
        : (count(sealingKey, fields.compromised) > 0
           || (max(sealingKey, fields.active ? fields.createdAt : null) > 0 && now - max(sealingKey, fields.active ? fields.createdAt : null) > 2592000000)
           ? "warning" : "ok")
  # No controller found (when the Deployments could be read) is as critical as one not ready.
  controllers:
    aggregate:
      down: readable(controller) && (count(controller) == 0 || count(controller, health == "critical") > 0)
    health: 'readable(controller) && (count(controller) == 0 || count(controller, health == "critical") > 0) ? "critical" : "ok"'
  summary:
    aggregate:
      total: count(sealedSecret)
      notUnsealed: count(sealedSecret, health == "critical")
    health: worst([worst(sealedSecret.health), dataServices.keys.health, dataServices.controllers.health])

cards:
  summary:
    title: { count: dataServices.summary.total, one: "%d SealedSecret", other: "%d SealedSecrets" }
    health: dataServices.summary.health
    badges:
      - { label: "not unsealed", value: dataServices.summary.notUnsealed, tone: critical, hideWhenZero: true }
      - { label: "compromised keys", value: dataServices.keys.compromised, tone: warning, hideWhenZero: true }
  controller:
    from: controller
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No controller found"
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: 'fields.ready ? "ready" : "not ready"'
      detail:
        - type: keyValues
          items:
            - { label: "Replicas", value: 'string(fields.readyReplicas) + "/" + string(fields.replicas)', mono: true }
        - type: text
          tone: critical
          text: '{{ dataServices.keys.noActive ? "no active sealing key" : "" }}'
        - type: text
          tone: warning
          text: '{{ dataServices.keys.compromised > 0 ? "a sealing key is marked compromised" : "" }}'
        - type: text
          tone: warning
          text: '{{ dataServices.keys.stale ? "the newest sealing key is over 30 days old: key renewal may be stuck" : "" }}'
  keys:
    from: sealingKey
    sort: [fields.createdAt desc, $.metadata.namespace, $.metadata.name]
    empty: "No sealing keys."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: 'fields.active ? "ok" : health'
        text: 'fields.active ? "active" : (fields.compromised ? "compromised" : fields.state)'
      trailing: { text: relativeTime(fields.createdAt) }
  secrets:
    from: sealedSecret
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No SealedSecrets."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: 'fields.synced ? "unsealed" : fields.syncReason'
      trailing: { text: 'fields.scope == "strict" ? "" : fields.scope' }
      detail:
        - type: keyValues
          items:
            - { label: "Keys", value: fields.keyCount }
            - { label: "Type", value: fields.type, mono: true }
            - { label: "Scope", value: fields.scope }
            - { label: "Created", value: relativeTime(fields.createdAt) }
        - type: badges
          items:
            - { label: "immutable", on: fields.immutable }
        - type: conditions

# The monitor and the checkup's former Sealed Secrets alerts: a SealedSecret that failed to
# unseal (after a minute: the controller has not had its turn yet), the controller down, no
# active key, a compromised key. One a Secret it does not own blocks is shown, not notified.
findings:
  - id: unseal-failed
    from: sealedSecret
    when: health == "critical" && now - fields.createdAt > 60000
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: secrets
  - id: unmanaged
    from: sealedSecret
    when: fields.unmanaged && now - fields.createdAt > 60000
    severity: info
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: secrets
  - { id: controller-down, from: controller, when: health == "critical", severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: controller }
  - { id: no-active-key, from: controller, when: dataServices.keys.noActive, severity: critical, title: "{{ namespace }}/{{ name }}", detail: "no active sealing key", opens: keys }
  - { id: key-compromised, from: sealingKey, when: fields.compromised, severity: warning, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: keys }

# The former demo: a controller with two active keys and a compromised one, a SealedSecret
# that cannot be decrypted next to two that unsealed.
samples:
  controller:
    - metadata: { name: sealed-secrets-controller, namespace: kube-system }
      spec:
        replicas: 1
        template: { spec: { containers: [{ name: controller, image: docker.io/bitnami/sealed-secrets-controller:0.27.1 }] } }
      status: { replicas: 1, readyReplicas: 1 }
  sealingKey:
    - metadata: { name: sealed-secrets-key-new, namespace: kube-system, creationTimestamp: now-7d, labels: { sealedsecrets.bitnami.com/sealed-secrets-key: active } }
    - metadata: { name: sealed-secrets-key-old, namespace: kube-system, creationTimestamp: now-21d, labels: { sealedsecrets.bitnami.com/sealed-secrets-key: active } }
    - metadata: { name: sealed-secrets-key-rotated, namespace: kube-system, creationTimestamp: now-30d, labels: { sealedsecrets.bitnami.com/sealed-secrets-key: compromised } }
  sealedSecret:
    - metadata: { name: legacy-cert, namespace: demo-shop, generation: 2, creationTimestamp: now-1d }
      spec:
        encryptedData: { tls.crt: AgB4c2Vh, tls.key: AgB4c2Vh }
        template: { type: kubernetes.io/tls }
      status:
        observedGeneration: 1
        conditions: [{ type: Synced, status: "False", reason: UnsealFailed, message: "failed to decrypt: no key could decrypt secret", lastTransitionTime: now-1h }]
    - metadata: { name: api-token, namespace: demo-shop, generation: 1, creationTimestamp: now-1d, annotations: { sealedsecrets.bitnami.com/namespace-wide: "true" } }
      spec: { encryptedData: { token: AgB4c2Vh }, template: { type: Opaque } }
      status: { observedGeneration: 1, conditions: [{ type: Synced, status: "True", lastTransitionTime: now-1d }] }
    - metadata: { name: database-credentials, namespace: demo-shop, generation: 1, creationTimestamp: now-1d }
      spec:
        encryptedData: { database: AgB4c2Vh, password: AgB4c2Vh, username: AgB4c2Vh }
        template: { type: Opaque, immutable: true }
      status: { observedGeneration: 1, conditions: [{ type: Synced, status: "True", lastTransitionTime: now-1d }] }
    - metadata: { name: shared-config, namespace: demo-lab, generation: 1, creationTimestamp: now-3d }
      spec: { encryptedData: { config: AgB4c2Vh }, template: { type: Opaque } }
      status:
        observedGeneration: 1
        conditions: [{ type: Synced, status: "False", reason: Unmanaged, message: "Resource \"shared-config\" already exists and is not managed by SealedSecret", lastTransitionTime: now-3d }]

