# yaml-language-server: $schema=../schema/plugin.schema.json
# ExternalDNS publishes DNS records for the hostnames its sources (Ingresses, Services,
# HTTPRoutes, DNSEndpoints) ask for, and keeps no status on them: what this plugin shows is
# what the controllers' flags and the sources say. Two Go readers do what no expression can:
# native:external-dns-controllers parses each controller's flags off its Deployment, and
# native:external-dns-records fans every source out into one record per hostname and address
# family, matched with the controller whose domain filters and record types cover it. Each row
# opens the object it comes from (ref: $.source). "Check names" resolves the hostnames from the
# phone. go/ichorgo/plugin_externaldns_test.go holds it to the reader the apps used before.
schemaVersion: ichor.dev/plugin/v1alpha1
id: external-dns
name: ExternalDNS
website: https://kubernetes-sigs.github.io/external-dns/latest/
icon: external-dns
category: networking
catalogId: external-dns

# The DNSEndpoint CRD is optional: most installs only publish Ingress and Service hosts.
detect:
  - group: externaldns.k8s.io
  - pods: external-dns

resources:
  controller:
    group: ichor.dev
    version: v1alpha1
    resource: externaldnscontrollers
    kind: ExternalDNSController
    scope: Namespaced
    source: native:external-dns-controllers
    ref: $.source
  record:
    group: ichor.dev
    version: v1alpha1
    resource: externaldnsrecords
    kind: ExternalDNSRecord
    scope: Namespaced
    source: native:external-dns-records
    ref: $.source
    list: { limit: 500 }

fields:
  controller:
    replicas: $.status.replicas | default(0)
    readyReplicas: $.status.readyReplicas | default(0)
    ready: fields.replicas > 0 && fields.readyReplicas >= fields.replicas
    dryRun: $.spec.dryRun | default(false)
  record:
    dnsName: $.spec.dnsName
    unmanaged: ($.spec.controller | default("")) == ""
    stale: $.status.stale | default(false)
    noTarget: len($.spec.targets) == 0

# One reason per object: the first rule that holds.
health:
  controller:
    - { when: fields.readyReplicas == 0, health: critical, reason: notReady, message: "no replica ready" }
    - { when: fields.dryRun, health: warning, reason: dryRun, message: "dry-run: it changes nothing" }
  record:
    - { when: fields.unmanaged, health: warning, reason: unmanaged, message: "outside every controller’s domain filters" }
    - { when: fields.stale, health: warning, reason: stale, message: "a newer version is not observed yet" }
    - { when: fields.noTarget, health: warning, reason: noTarget, message: "no address to point at yet" }

dataServices:
  # No controller found (when the Deployments could be read) is as critical as one not ready.
  controllers:
    aggregate:
      down: readable(controller) && (count(controller) == 0 || count(controller, health == "critical") > 0)
      notReady: count(controller, health == "critical")
      dryRun: count(controller, fields.dryRun)
    health: 'readable(controller) && (count(controller) == 0 || count(controller, health == "critical") > 0) ? "critical" : worst(controller.health)'
  records:
    aggregate:
      unmanaged: count(record, fields.unmanaged)
      noTarget: count(record, fields.noTarget)
    health: worst(record.health)
  summary:
    aggregate:
      total: count(record)
    health: worst([dataServices.controllers.health, dataServices.records.health])

cards:
  summary:
    title: { count: dataServices.summary.total, one: "%d hostname", other: "%d hostnames" }
    health: dataServices.summary.health
    badges:
      - { label: "controllers down", value: dataServices.controllers.notReady, tone: critical, hideWhenZero: true }
      - { label: "dry-run", value: dataServices.controllers.dryRun, tone: warning, hideWhenZero: true }
      - { label: "unmanaged", value: dataServices.records.unmanaged, tone: warning, hideWhenZero: true }
      - { label: "without target", value: dataServices.records.noTarget, tone: warning, hideWhenZero: true }
  controllers:
    from: controller
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No controller found"
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + " · " + $.spec.provider + ($.spec.policy != "" ? " · " + $.spec.policy : "") + " · " + $.spec.ownerId'
      status:
        tone: health
        text: '!fields.ready ? "not ready" : (fields.dryRun ? "dry-run" : "ready")'
      trailing: { text: 'string(fields.readyReplicas) + "/" + string(fields.replicas)' }
      detail:
        - type: keyValues
          items:
            - { label: "Provider", value: $.spec.provider }
            - { label: "Policy", value: $.spec.policy }
            - { label: "Registry", value: $.spec.registry }
            - { label: "Owner id", value: $.spec.ownerId, mono: true }
            - { label: "TXT prefix/suffix", value: '$.spec.txtPrefix == "" && $.spec.txtSuffix == "" ? "" : $.spec.txtPrefix + "/" + $.spec.txtSuffix', mono: true }
            - { label: "Domain filters", value: $.spec.domainFilters, mono: true }
            - { label: "Sources", value: $.spec.sources }
            - { label: "Interval", value: 'string($.spec.intervalSeconds) + " s"' }
            - { label: "Annotation filter", value: $.spec.annotationFilter, mono: true }
            - { label: "Record types", value: $.spec.managedRecordTypes }
  records:
    from: record
    sort: [health desc, fields.dnsName, $.spec.recordType, $.spec.sourceKind, $.metadata.namespace, $.source.name]
    empty: "No hostnames."
    row:
      title: fields.dnsName
      subtitle: '$.spec.recordType + " · " + $.spec.sourceKind + " " + $.metadata.namespace + "/" + $.source.name'
      status:
        tone: health
        text: 'fields.unmanaged ? "unmanaged" : (fields.stale ? "stale" : (fields.noTarget ? "without target" : ""))'
      trailing: { text: '$.spec.ttl > 0 ? "TTL " + string($.spec.ttl) : ""' }
      detail:
        - type: keyValues
          items:
            - { label: "Targets", value: $.spec.targets, mono: true }
            - { label: "Controller", value: $.spec.controller }
            - { label: "Source", value: '$.spec.sourceKind + " " + $.metadata.namespace + "/" + $.source.name' }

# The monitor's former ExternalDNS alert (a controller with no replica ready) and the
# reasons the tab showed. A record's finding is keyed by its source object: two hostnames of
# one Ingress make one finding.
findings:
  - { id: controller-down, from: controller, when: health == "critical", severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: controllers }
  - { id: controller-dry-run, from: controller, when: fields.dryRun, severity: info, title: "{{ namespace }}/{{ name }}", detail: "dry-run: it changes nothing", opens: controllers }
  - { id: record-unmanaged, from: record, when: fields.unmanaged, severity: info, title: "{{ fields.dnsName }}", detail: "outside every controller’s domain filters", opens: records }
  - { id: record-no-target, from: record, when: fields.noTarget, severity: warning, title: "{{ fields.dnsName }}", detail: "no address to point at yet", opens: records }
  - { id: record-stale, from: record, when: fields.stale, severity: info, title: "{{ fields.dnsName }}", detail: "a newer version is not observed yet", opens: records }

tools:
  checkNames:
    label: "Check names"
    hint: "Resolves every hostname from this phone and compares it with the record's targets. The names go to your DNS resolver."
    run: native:dns-check
    texts:
      - "%d of %d name points at this cluster"
      - "%d of %d names point at this cluster"
      - "No hostnames."
      - "Resolves here"
      - "Points elsewhere"
      - "Not found"
      - "Could not check"
      - "Resolves, nothing to compare"
      - "Answers"
      - "Targets"
      - "Owner"
      - "owned by %s"
      - "A name that points elsewhere may be split-horizon DNS at home, a change still propagating, or another ExternalDNS owning it."
      - "the resolver timed out"
      - "the resolver could not answer"
      - "a wildcard can only be the first label"

# The former demo: one controller (cloudflare, sync, owner id homelab, example.com only) and
# eight records across the four source kinds, among them a dual-stack Service (an A and an
# AAAA record), a DNSEndpoint whose newer generation is not observed yet, an Ingress without
# an address to point at and a name outside every domain filter.
samples:
  controller:
    - apiVersion: ichor.dev/v1alpha1
      kind: ExternalDNSController
      metadata: { name: external-dns, namespace: external-dns }
      spec:
        provider: cloudflare
        policy: sync
        registry: txt
        ownerId: homelab
        txtPrefix: ""
        txtSuffix: ""
        domainFilters: [example.com]
        sources: [ingress, service, gateway-httproute, crd]
        dryRun: false
        intervalSeconds: 60
        annotationFilter: ""
        managedRecordTypes: [A, AAAA, CNAME]
      status: { replicas: 1, readyReplicas: 1 }
      source: { group: apps, version: v1, resource: deployments, kind: Deployment, namespace: external-dns, name: external-dns }
  record:
    - metadata: { name: app.example.com/A/Ingress/app, namespace: demo }
      spec: { dnsName: app.example.com, recordType: A, targets: [203.0.113.10], ttl: 300, sourceKind: Ingress, controller: external-dns/external-dns }
      status: { stale: false }
      source: { group: networking.k8s.io, version: v1, resource: ingresses, kind: Ingress, namespace: demo, name: app }
    - metadata: { name: shop.example.com/A/Service/shop, namespace: demo }
      spec: { dnsName: shop.example.com, recordType: A, targets: [203.0.113.20], ttl: 60, sourceKind: Service, controller: external-dns/external-dns }
      status: { stale: false }
      source: { group: "", version: v1, resource: services, kind: Service, namespace: demo, name: shop }
    - metadata: { name: web.example.com/A/Service/web, namespace: demo }
      spec: { dnsName: web.example.com, recordType: A, targets: [203.0.113.60], ttl: 300, sourceKind: Service, controller: external-dns/external-dns }
      status: { stale: false }
      source: { group: "", version: v1, resource: services, kind: Service, namespace: demo, name: web }
    - metadata: { name: web.example.com/AAAA/Service/web, namespace: demo }
      spec: { dnsName: web.example.com, recordType: AAAA, targets: ["2001:db8::60"], ttl: 300, sourceKind: Service, controller: external-dns/external-dns }
      status: { stale: false }
      source: { group: "", version: v1, resource: services, kind: Service, namespace: demo, name: web }
    - metadata: { name: api.example.com/A/HTTPRoute/api, namespace: demo }
      spec: { dnsName: api.example.com, recordType: A, targets: [203.0.113.30], ttl: 300, sourceKind: HTTPRoute, controller: external-dns/external-dns }
      status: { stale: false }
      source: { group: gateway.networking.k8s.io, version: v1, resource: httproutes, kind: HTTPRoute, namespace: demo, name: api }
    - metadata: { name: db.example.com/A/DNSEndpoint/db, namespace: demo }
      spec: { dnsName: db.example.com, recordType: A, targets: [203.0.113.40], ttl: 300, sourceKind: DNSEndpoint, controller: external-dns/external-dns }
      status: { stale: true }
      source: { group: externaldns.k8s.io, version: v1alpha1, resource: dnsendpoints, kind: DNSEndpoint, namespace: demo, name: db }
    - metadata: { name: status.example.com/A/Ingress/status, namespace: demo }
      spec: { dnsName: status.example.com, recordType: A, targets: [], ttl: 0, sourceKind: Ingress, controller: external-dns/external-dns }
      status: { stale: false }
      source: { group: networking.k8s.io, version: v1, resource: ingresses, kind: Ingress, namespace: demo, name: status }
    - metadata: { name: "*.example.org/A/Ingress/legacy", namespace: demo }
      spec: { dnsName: "*.example.org", recordType: A, targets: [203.0.113.50], ttl: 300, sourceKind: Ingress, controller: "" }
      status: { stale: false }
      source: { group: networking.k8s.io, version: v1, resource: ingresses, kind: Ingress, namespace: demo, name: legacy }

