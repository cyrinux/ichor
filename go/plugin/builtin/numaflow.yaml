# yaml-language-server: $schema=../schema/plugin.schema.json
# Numaflow (numaflow.numaproj.io/v1alpha1) runs stream-processing pipelines: vertices (source,
# map or reduce UDFs, sink) over an inter-step buffer service (JetStream), or a single mono
# vertex. On the phone: is a pipeline running, paused or failed and why (status.message), are
# its vertices' pods ready, is its buffer service up; and pause or resume a pipeline or a mono
# vertex (spec.lifecycle.desiredPhase, the documented lever). ServingPipeline is not read (rare).
# The account needs list and get on pipelines, vertices, monovertices and
# interstepbufferservices; one it may not list lands in the render's errors, the others still
# show. Pause and resume need patch on pipelines and monovertices.
# Vertices and mono vertices have a scale subresource: no scale action yet (`plugin-lint -crd`
# warns about it; scaling is a later step).
schemaVersion: ichor.dev/plugin/v1alpha1
id: numaflow
name: Numaflow
website: https://numaflow.numaproj.io
icon: numaflow
category: workloads
catalogId: numaflow

detect:
  - group: numaflow.numaproj.io
    resource: pipelines

resources:
  pipeline:
    group: numaflow.numaproj.io
    version: v1alpha1
    resource: pipelines
    kind: Pipeline
    scope: Namespaced
  monovertex:
    group: numaflow.numaproj.io
    version: v1alpha1
    resource: monovertices
    kind: MonoVertex
    scope: Namespaced
  # A pipeline's steps, one per vertex: many on a big cluster, so at most 500 are read.
  vertex:
    group: numaflow.numaproj.io
    version: v1alpha1
    resource: vertices
    kind: Vertex
    scope: Namespaced
    list: { limit: 500 }
  isbsvc:
    group: numaflow.numaproj.io
    version: v1alpha1
    resource: interstepbufferservices
    kind: InterStepBufferService
    scope: Namespaced

fields:
  pipeline:
    # "" on a fresh object, then Running, Failed, Pausing, Paused or Deleting.
    phase: $.status.phase | default("")
    desiredPhase: $.spec.lifecycle.desiredPhase | default("Running")
    message: $.status.message | default("")
    vertexCount: $.status.vertexCount | default(0)
    sources: $.status.sourceCount | default(0)
    sinks: $.status.sinkCount | default(0)
    udfs: $.status.udfCount | default(0)
    mapUdfs: $.status.mapUDFCount | default(0)
    reduceUdfs: $.status.reduceUDFCount | default(0)
    isbsvcName: $.spec.interStepBufferServiceName | default("default")
    isbsvc: join(isbsvc, $.metadata.namespace == left.metadata.namespace && $.metadata.name == (left.spec.interStepBufferServiceName | default("default")))
    drainedOnPause: $.status.drainedOnPause | default(false)
    updatedAt: $.status.lastUpdated | time()
    createdAt: $.metadata.creationTimestamp | time()
    # The pipeline's vertices (spec.pipelineName or the pipeline-name label names it), and
    # those running.
    vertexObjects: len(vertex[?(@.metadata.namespace == $.metadata.namespace && (@.spec.pipelineName == $.metadata.name || @.metadata.labels["numaflow.numaproj.io/pipeline-name"] == $.metadata.name))])
    runningVertices: |
      len(vertex[?(@.metadata.namespace == $.metadata.namespace && (@.spec.pipelineName == $.metadata.name || @.metadata.labels["numaflow.numaproj.io/pipeline-name"] == $.metadata.name)
        && @.status.phase == "Running")])
  monovertex:
    # "" on a fresh object, then Running, Failed or Paused.
    phase: $.status.phase | default("")
    desiredPhase: $.spec.lifecycle.desiredPhase | default("Running")
    desired: $.status.desiredReplicas | default(0)
    current: $.status.replicas | default(0)
    ready: $.status.readyReplicas | default(0)
    reason: $.status.reason | default("")
    message: $.status.message | default("")
    lastScaledAt: $.status.lastScaledAt | time()
    createdAt: $.metadata.creationTimestamp | time()
  vertex:
    phase: $.status.phase | default("")
    pipeline: $.spec.pipelineName | default($.metadata.labels["numaflow.numaproj.io/pipeline-name"] | default(""))
    desired: $.status.desiredReplicas | default(0)
    current: $.status.replicas | default(0)
    ready: $.status.readyReplicas | default(0)
    reason: $.status.reason | default("")
    message: $.status.message | default("")
    createdAt: $.metadata.creationTimestamp | time()
  isbsvc:
    # jetstream (or redis on older releases).
    type: $.status.type | default("")
    # "" on a fresh object, then Pending, Running, Failed or Deleting.
    phase: $.status.phase | default("")
    message: $.status.message | default("")
    jsVersion: $.spec.jetstream.version | default("")
    jsReplicas: $.spec.jetstream.replicas | default(3)
    createdAt: $.metadata.creationTimestamp | time()

# Paused and moving pipelines first: a pipeline being paused is not unhealthy, whatever its
# vertices' conditions say meanwhile.
health:
  pipeline:
    - when: fields.phase == "Failed"
      health: critical
      reason: failed
      message: "{{ fields.message }}"
    - when: fields.phase == "Pausing" || fields.phase == "Deleting"
      health: info
      reason: transitioning
      message: "{{ fields.phase }}"
    - when: fields.phase == "Paused"
      health: idle
      reason: paused
      message: "paused"
    - when: fields.phase == ""
      health: unknown
      reason: notReconciled
      message: "not reconciled yet"
    - when: conditions.VerticesHealthy == false
      health: warning
      reason: verticesUnhealthy
      message: 'vertices not healthy: {{ condition("VerticesHealthy").message }}'
    - when: conditions.DaemonServiceHealthy == false || conditions.SideInputsManagersHealthy == false
      health: warning
      reason: daemonUnhealthy
      message: "its daemon is not healthy"
  monovertex:
    - when: fields.phase == "Failed"
      health: critical
      reason: failed
      message: "{{ fields.message }}"
    - when: fields.phase == "Paused"
      health: idle
      reason: paused
      message: "paused"
    - when: fields.phase == ""
      health: unknown
      reason: notReconciled
      message: "not reconciled yet"
    - when: conditions.DaemonHealthy == false || conditions.Deployed == false
      health: warning
      reason: daemonUnhealthy
      message: "its daemon is not healthy"
    - when: fields.ready < fields.desired
      health: warning
      reason: podsNotReady
      message: "{{ fields.ready }} of {{ fields.desired }} pods ready"
  vertex:
    - when: fields.phase == "Failed"
      health: critical
      reason: failed
      message: "{{ fields.message }}"
    - when: fields.phase == "Paused"
      health: idle
      reason: paused
      message: "paused"
    - when: conditions.PodsHealthy == false || conditions.Deployed == false || fields.ready < fields.desired
      health: warning
      reason: podsNotReady
      message: "{{ fields.ready }} of {{ fields.desired }} pods ready"
  isbsvc:
    - when: fields.phase == "Failed"
      health: critical
      reason: isbsvcFailed
      message: "{{ fields.message }}"
    - when: fields.phase == "Pending" || fields.phase == "Deleting"
      health: info
      reason: pending
      message: "{{ fields.phase }}"
    - when: conditions.ChildrenResourcesHealthy == false
      health: warning
      reason: childrenUnhealthy
      message: "its JetStream is not healthy"

dataServices:
  summary:
    aggregate:
      pipelines: count(pipeline) + count(monovertex)
      paused: count(pipeline, fields.phase == "Paused") + count(monovertex, fields.phase == "Paused")
      failed: count(pipeline, health == "critical") + count(monovertex, health == "critical")
      bufferDown: count(isbsvc, health == "critical")
    health: worst([worst(pipeline.health), worst(monovertex.health), worst(vertex.health), worst(isbsvc.health)])

cards:
  summary:
    title: { count: dataServices.summary.pipelines, one: "%d pipeline", other: "%d pipelines" }
    health: dataServices.summary.health
    badges:
      - { label: "failed", value: dataServices.summary.failed, tone: critical, hideWhenZero: true }
      - { label: "paused", value: dataServices.summary.paused, tone: info, hideWhenZero: true }
      - { label: "buffer down", value: dataServices.summary.bufferDown, tone: critical, hideWhenZero: true }
  pipelines:
    from: pipeline
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No pipelines."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.phase
      trailing: { text: 'string(fields.runningVertices) + "/" + string(fields.vertexObjects)' }
      detail:
        - type: gauge
          label: "Vertices running"
          value: fields.runningVertices
          max: fields.vertexObjects
          tone: health
        - type: keyValues
          items:
            - { label: "Phase", value: fields.phase }
            - { label: "Wanted", value: fields.desiredPhase }
            - { label: "Vertices", value: fields.vertexCount }
            - { label: "Sources", value: fields.sources }
            - { label: "Sinks", value: fields.sinks }
            - { label: "UDFs", value: fields.udfs }
            - { label: "Map UDFs", value: fields.mapUdfs }
            - { label: "Reduce UDFs", value: fields.reduceUdfs }
            - { label: "Buffer service", value: fields.isbsvcName, mono: true }
            - { label: "Drained on pause", value: fields.drainedOnPause }
            - { label: "Updated", value: fields.updatedAt | relativeTime() }
            - { label: "Created", value: fields.createdAt | relativeTime() }
            - { label: "Message", value: fields.message }
        - type: relations
          items:
            - { label: "Buffer service", ref: fields.isbsvc }
        - type: conditions
        - type: actions
          items: [pausePipeline, resumePipeline]
  monoVertices:
    from: monovertex
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No mono vertices."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.phase
      trailing: { text: 'string(fields.ready) + "/" + string(fields.desired)' }
      detail:
        - type: gauge
          label: "Pods ready"
          value: fields.ready
          max: fields.desired
          tone: health
        - type: keyValues
          items:
            - { label: "Phase", value: fields.phase }
            - { label: "Wanted", value: fields.desiredPhase }
            - { label: "Pods", value: fields.current }
            - { label: "Reason", value: fields.reason }
            - { label: "Last scaled", value: fields.lastScaledAt | relativeTime() }
            - { label: "Created", value: fields.createdAt | relativeTime() }
            - { label: "Message", value: fields.message }
        - type: conditions
        - type: actions
          items: [pauseMonoVertex, resumeMonoVertex]
  vertices:
    from: vertex
    sort: [health desc, $.metadata.namespace, fields.pipeline, $.metadata.name]
    empty: "No vertices."
    row:
      title: $.metadata.name
      subtitle: 'fields.pipeline + " · " + $.metadata.namespace'
      status:
        tone: health
        text: fields.phase
      trailing: { text: 'string(fields.ready) + "/" + string(fields.desired)' }
      detail:
        - type: gauge
          label: "Pods ready"
          value: fields.ready
          max: fields.desired
          tone: health
        - type: keyValues
          items:
            - { label: "Pipeline", value: fields.pipeline, mono: true }
            - { label: "Phase", value: fields.phase }
            - { label: "Pods", value: fields.current }
            - { label: "Reason", value: fields.reason }
            - { label: "Created", value: fields.createdAt | relativeTime() }
            - { label: "Message", value: fields.message }
        - type: conditions
  bufferServices:
    from: isbsvc
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No buffer services."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.phase
      trailing: { text: fields.type }
      detail:
        - type: keyValues
          items:
            - { label: "Type", value: fields.type }
            - { label: "Phase", value: fields.phase }
            - { label: "JetStream version", value: fields.jsVersion, mono: true }
            - { label: "Replicas", value: fields.jsReplicas }
            - { label: "Created", value: fields.createdAt | relativeTime() }
            - { label: "Message", value: fields.message }
        - type: conditions

# Pause and resume through spec.lifecycle.desiredPhase, as `kubectl patch` would: the
# controller drains then scales the vertices down, and back up.
actions:
  pausePipeline:
    label: "Pause"
    on: pipeline
    verb: mergePatch
    body: { spec: { lifecycle: { desiredPhase: Paused } } }
    rbac: { verbs: [patch], group: numaflow.numaproj.io, resource: pipelines }
    confirm: plain
    audit: numaflow.pause
    enabledWhen: fields.desiredPhase == "Running"
    disabledReason: "already paused"
  resumePipeline:
    label: "Resume"
    on: pipeline
    verb: mergePatch
    body: { spec: { lifecycle: { desiredPhase: Running } } }
    rbac: { verbs: [patch], group: numaflow.numaproj.io, resource: pipelines }
    confirm: plain
    audit: numaflow.resume
    enabledWhen: fields.desiredPhase == "Paused"
    disabledReason: "already running"
  pauseMonoVertex:
    label: "Pause"
    on: monovertex
    verb: mergePatch
    body: { spec: { lifecycle: { desiredPhase: Paused } } }
    rbac: { verbs: [patch], group: numaflow.numaproj.io, resource: monovertices }
    confirm: plain
    audit: numaflow.pause
    enabledWhen: fields.desiredPhase == "Running"
    disabledReason: "already paused"
  resumeMonoVertex:
    label: "Resume"
    on: monovertex
    verb: mergePatch
    body: { spec: { lifecycle: { desiredPhase: Running } } }
    rbac: { verbs: [patch], group: numaflow.numaproj.io, resource: monovertices }
    confirm: plain
    audit: numaflow.resume
    enabledWhen: fields.desiredPhase == "Paused"
    disabledReason: "already running"

findings:
  - id: pipeline-failed
    from: pipeline
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: pipelines
  - id: pipeline-unhealthy
    from: pipeline
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: pipelines
  - id: monovertex-failed
    from: monovertex
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: monoVertices
  - id: monovertex-unhealthy
    from: monovertex
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: monoVertices
  - id: vertex-pods-not-ready
    from: vertex
    when: health == "warning" || health == "critical"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: vertices
  - id: isbsvc-failed
    from: isbsvc
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: bufferServices

