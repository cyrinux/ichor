# Invented names. demo-shop's orders-enrich runs (in → enrich → out) on the default buffer
# service; nightly-rollup is paused; events' daemon is down; a new pipeline is not reconciled
# yet. demo-lab's clickstream failed on its buffer service, sessions has an unhealthy vertex,
# audit-trail is pausing. Mono vertices: one running, one short of pods, one failed, one
# paused, one whose daemon is down, one new. Times are relative to the clock (now-4m).
samples:
  pipeline:
    - metadata: { name: orders-enrich, namespace: demo-shop, creationTimestamp: now-3d }
      spec:
        interStepBufferServiceName: default
        vertices:
          - { name: in, source: { http: {} } }
          - { name: enrich, udf: { container: { image: demo/enrich:1.0 } } }
          - { name: out, sink: { log: {} } }
        edges:
          - { from: in, to: enrich }
          - { from: enrich, to: out }
      status:
        phase: Running
        vertexCount: 3
        sourceCount: 1
        sinkCount: 1
        udfCount: 1
        mapUDFCount: 1
        reduceUDFCount: 0
        lastUpdated: now-4m
        conditions:
          - { type: Configured, status: "True", lastTransitionTime: now-3d }
          - { type: Deployed, status: "True", lastTransitionTime: now-3d }
          - { type: DaemonServiceHealthy, status: "True", lastTransitionTime: now-3d }
          - { type: SideInputsManagersHealthy, status: "True", lastTransitionTime: now-3d }
          - { type: VerticesHealthy, status: "True", lastTransitionTime: now-1h }
    - metadata: { name: nightly-rollup, namespace: demo-shop, creationTimestamp: now-20d }
      spec: { lifecycle: { desiredPhase: Paused } }
      status: { phase: Paused, vertexCount: 2, sourceCount: 1, sinkCount: 1, drainedOnPause: true, lastUpdated: now-2h }
    - metadata: { name: events, namespace: demo-shop, creationTimestamp: now-5d }
      status:
        phase: Running
        vertexCount: 2
        lastUpdated: now-9m
        conditions:
          - { type: DaemonServiceHealthy, status: "False", reason: Progressing, message: daemon pod not ready, lastTransitionTime: now-9m }
          - { type: VerticesHealthy, status: "True", lastTransitionTime: now-1d }
    - metadata: { name: new-pipeline, namespace: demo-shop, creationTimestamp: now-1m }
    - metadata: { name: clickstream, namespace: demo-lab, creationTimestamp: now-7d }
      status:
        phase: Failed
        message: buffer service default is not ready
        vertexCount: 3
        lastUpdated: now-12m
    - metadata: { name: sessions, namespace: demo-lab, creationTimestamp: now-2d }
      status:
        phase: Running
        vertexCount: 2
        lastUpdated: now-6m
        conditions:
          - { type: VerticesHealthy, status: "False", reason: Unhealthy, message: vertex cat has 0 ready pods, lastTransitionTime: now-6m }
    - metadata: { name: audit-trail, namespace: demo-lab, creationTimestamp: now-30d }
      spec: { lifecycle: { desiredPhase: Paused } }
      status: { phase: Pausing, vertexCount: 2, lastUpdated: now-1m }
  monovertex:
    - metadata: { name: transformer, namespace: demo-shop, creationTimestamp: now-4d }
      status:
        phase: Running
        desiredReplicas: 2
        replicas: 2
        readyReplicas: 2
        lastScaledAt: now-3h
        conditions:
          - { type: DaemonHealthy, status: "True", lastTransitionTime: now-4d }
          - { type: Deployed, status: "True", lastTransitionTime: now-4d }
    - metadata: { name: fraud-score, namespace: demo-lab, creationTimestamp: now-1d }
      status: { phase: Running, desiredReplicas: 3, replicas: 3, readyReplicas: 1, lastScaledAt: now-15m }
    - metadata: { name: geo-lookup, namespace: demo-lab, creationTimestamp: now-6d }
      status: { phase: Failed, reason: CrashLoopBackOff, message: container udf keeps restarting, desiredReplicas: 1, replicas: 1, readyReplicas: 0 }
    - metadata: { name: archive, namespace: demo-shop, creationTimestamp: now-40d }
      spec: { lifecycle: { desiredPhase: Paused } }
      status: { phase: Paused, desiredReplicas: 0, replicas: 0, readyReplicas: 0 }
    - metadata: { name: enricher, namespace: demo-shop, creationTimestamp: now-2d }
      status:
        phase: Running
        desiredReplicas: 1
        replicas: 1
        readyReplicas: 1
        conditions:
          - { type: DaemonHealthy, status: "False", reason: Unavailable, message: daemon deployment unavailable, lastTransitionTime: now-20m }
    - metadata: { name: fresh, namespace: demo-lab, creationTimestamp: now-1m }
  vertex:
    - metadata: { name: orders-enrich-in, namespace: demo-shop, labels: { numaflow.numaproj.io/pipeline-name: orders-enrich }, creationTimestamp: now-3d }
      spec: { name: in, pipelineName: orders-enrich }
      status:
        phase: Running
        desiredReplicas: 1
        replicas: 1
        readyReplicas: 1
        conditions:
          - { type: Deployed, status: "True", lastTransitionTime: now-3d }
          - { type: PodsHealthy, status: "True", lastTransitionTime: now-3d }
    - metadata: { name: orders-enrich-enrich, namespace: demo-shop, labels: { numaflow.numaproj.io/pipeline-name: orders-enrich }, creationTimestamp: now-3d }
      spec: { name: enrich, pipelineName: orders-enrich }
      status: { phase: Running, desiredReplicas: 2, replicas: 2, readyReplicas: 2 }
    - metadata: { name: orders-enrich-out, namespace: demo-shop, labels: { numaflow.numaproj.io/pipeline-name: orders-enrich }, creationTimestamp: now-3d }
      spec: { name: out, pipelineName: orders-enrich }
      status: { phase: Running, desiredReplicas: 1, replicas: 1, readyReplicas: 1 }
    - metadata: { name: nightly-rollup-in, namespace: demo-shop, labels: { numaflow.numaproj.io/pipeline-name: nightly-rollup }, creationTimestamp: now-20d }
      spec: { name: in, pipelineName: nightly-rollup }
      status: { phase: Paused, desiredReplicas: 0, replicas: 0, readyReplicas: 0 }
    - metadata: { name: clickstream-in, namespace: demo-lab, labels: { numaflow.numaproj.io/pipeline-name: clickstream }, creationTimestamp: now-7d }
      spec: { name: in, pipelineName: clickstream }
      status: { phase: Failed, message: cannot reach buffer service default, desiredReplicas: 1, replicas: 1, readyReplicas: 0 }
    - metadata: { name: sessions-cat, namespace: demo-lab, labels: { numaflow.numaproj.io/pipeline-name: sessions }, creationTimestamp: now-2d }
      spec: { name: cat, pipelineName: sessions }
      status:
        phase: Running
        desiredReplicas: 1
        replicas: 1
        readyReplicas: 0
        reason: Unhealthy
        message: pod sessions-cat-0 is not ready
        conditions:
          - { type: PodsHealthy, status: "False", reason: Unhealthy, message: 0 of 1 pods ready, lastTransitionTime: now-6m }
  isbsvc:
    - metadata: { name: default, namespace: demo-shop, creationTimestamp: now-30d }
      spec: { jetstream: { version: latest, replicas: 3 } }
      status:
        type: jetstream
        phase: Running
        conditions:
          - { type: Configured, status: "True", lastTransitionTime: now-30d }
          - { type: Deployed, status: "True", lastTransitionTime: now-30d }
          - { type: ChildrenResourcesHealthy, status: "True", lastTransitionTime: now-2d }
    - metadata: { name: default, namespace: demo-lab, creationTimestamp: now-10d }
      spec: { jetstream: { version: latest } }
      status: { type: jetstream, phase: Failed, message: JetStream statefulset has 0 ready replicas }
    - metadata: { name: staging, namespace: demo-shop, creationTimestamp: now-2m }
      spec: { jetstream: { version: latest, replicas: 1 } }
      status: { type: jetstream, phase: Pending }
    - metadata: { name: analytics, namespace: demo-lab, creationTimestamp: now-15d }
      spec: { jetstream: { version: latest } }
      status:
        type: jetstream
        phase: Running
        conditions:
          - { type: ChildrenResourcesHealthy, status: "False", reason: Degraded, message: 1 of 3 JetStream pods not ready, lastTransitionTime: now-30m }
