# Invented names and IDs (*.demo-lab.example). demo-shop's router and its storefront are up;
# demo-lab's router waits for its peers, its wiki names a router that does not exist, the
# api resource's Service is gone, and an egress reaches files.demo-lab.example.
samples:
  router:
    - metadata: { name: shop-router, namespace: demo-shop, generation: 2, creationTimestamp: now-30d }
      spec: { dnsZoneRef: { name: shop.demo-lab.example } }
      status:
        observedGeneration: 2
        routingPeerID: d1demopeer0shop00000
        networkID: d1demonet00shop00000
        conditions:
          - { type: Ready, status: "True", reason: Reconciled, message: "", lastTransitionTime: now-30d }
    - metadata: { name: lab-router, namespace: demo-lab, generation: 1, creationTimestamp: now-10m }
      spec: { dnsZoneRef: { name: lab.demo-lab.example }, workloadOverride: { replicas: 2 } }
      status:
        observedGeneration: 1
        networkID: d1demonet00lab000000
        conditions:
          - { type: Ready, status: "False", reason: Progressing, message: "0 of 2 routing peers ready", lastTransitionTime: now-10m }
    - metadata: { name: edge-router, namespace: demo-lab, generation: 3, creationTimestamp: now-2d }
      spec: { dnsZoneRef: { name: edge.demo-lab.example } }
      status:
        observedGeneration: 3
        conditions:
          - { type: Ready, status: "False", reason: APIError, message: "management API: 403 permission denied", lastTransitionTime: now-1h }
    - metadata: { name: dmz-router, namespace: demo-lab, generation: 1, creationTimestamp: now-3h }
      spec: { dnsZoneRef: { name: dmz.demo-lab.example } }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: Dependency, message: "Referenced DNS zone cannot be found.", lastTransitionTime: now-3h }
    - metadata: { name: new-router, namespace: demo-lab, generation: 1, creationTimestamp: now-5s }
      spec: { dnsZoneRef: { name: new.demo-lab.example } }
    - metadata: { name: quiet-router, namespace: demo-shop, generation: 1, creationTimestamp: now-1d }
      spec: { dnsZoneRef: { name: quiet.demo-lab.example } }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "True", reason: Reconciled, message: "", lastTransitionTime: now-1d }
  resource:
    - metadata: { name: storefront, namespace: demo-shop, generation: 1, creationTimestamp: now-29d }
      spec:
        serviceRef: { name: storefront }
        networkRouterRef: { name: shop-router }
        groups: [{ localRef: { name: developers } }, { id: d1demogroup0ops0000 }]
      status:
        observedGeneration: 1
        resourceID: d1demores00store0000
        networkID: d1demonet00shop00000
        dnsZoneID: d1demozone0shop00000
        dnsRecordID: d1demorec00store0000
        conditions:
          - { type: Ready, status: "True", reason: Reconciled, message: "", lastTransitionTime: now-29d }
    - metadata: { name: wiki, namespace: demo-lab, generation: 1, creationTimestamp: now-2h }
      spec:
        serviceRef: { name: wiki }
        networkRouterRef: { name: old-router }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: Dependency, message: "Referenced NetworkRouter cannot be found.", lastTransitionTime: now-2h }
    - metadata: { name: api, namespace: demo-lab, generation: 1, creationTimestamp: now-1d }
      spec:
        serviceRef: { name: api }
        networkRouterRef: { name: lab-router }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: Dependency, message: "Referenced Service cannot be found.", lastTransitionTime: now-1d }
    - metadata: { name: grafana, namespace: demo-shop, generation: 1, creationTimestamp: now-3d }
      spec:
        serviceRef: { name: grafana }
        networkRouterRef: { name: shop-router }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: APIError, message: "management API: resource name already in use", lastTransitionTime: now-3d }
    - metadata: { name: metrics, namespace: demo-shop, generation: 2, creationTimestamp: now-20s }
      spec:
        serviceRef: { name: metrics }
        networkRouterRef: { name: shop-router }
      status:
        observedGeneration: 1
    - metadata: { name: docs, namespace: demo-shop, generation: 1, creationTimestamp: now-6h }
      spec:
        serviceRef: { name: docs }
        networkRouterRef: { name: shop-router }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "True", reason: Reconciled, message: "", lastTransitionTime: now-6h }
  egress:
    - metadata: { name: files, namespace: demo-lab, generation: 1, creationTimestamp: now-5d }
      spec:
        networkRouterRef: { name: lab-router }
        target: { fqdn: { hostname: files.demo-lab.example } }
        ports: [{ name: https, port: 443 }]
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "True", reason: Reconciled, message: "", lastTransitionTime: now-5d }
    - metadata: { name: backup-target, namespace: demo-shop, generation: 1, creationTimestamp: now-4h }
      spec:
        networkRouterRef: { name: gone-router }
        target: { ip: { address: 192.0.2.40 } }
        ports: [{ port: 22 }]
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: Dependency, message: "Referenced NetworkRouter cannot be found.", lastTransitionTime: now-4h }
    - metadata: { name: mirror, namespace: demo-lab, generation: 1, creationTimestamp: now-2h }
      spec:
        networkRouterRef: { name: dmz-router }
        target: { fqdn: { hostname: mirror.demo-lab.example } }
        ports: [{ port: 80 }]
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: Dependency, message: "Referenced NetworkRouter is not ready.", lastTransitionTime: now-2h }
    - metadata: { name: registry, namespace: demo-lab, generation: 1, creationTimestamp: now-1d }
      spec:
        networkRouterRef: { name: lab-router }
        target: { fqdn: { hostname: registry.demo-lab.example } }
        ports: [{ port: 443 }]
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: APIError, message: "management API: timeout", lastTransitionTime: now-1d }
    - metadata: { name: fresh, namespace: demo-lab, generation: 1, creationTimestamp: now-5s }
      spec:
        networkRouterRef: { name: lab-router }
        target: { ip: { address: 192.0.2.41 } }
        ports: [{ port: 443 }]
  group:
    - metadata: { name: developers, namespace: demo-shop, generation: 1 }
      spec: { name: Developers }
      status:
        observedGeneration: 1
        groupID: d1demogroup0dev0000
        conditions:
          - { type: Ready, status: "True", reason: Reconciled, message: "", lastTransitionTime: now-30d }
    - metadata: { name: contractors, namespace: demo-lab, generation: 1 }
      spec: { name: Contractors }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: APIError, message: "management API: group limit reached", lastTransitionTime: now-1h }
    - metadata: { name: interns, namespace: demo-lab, generation: 1 }
      spec: { name: Interns }
  setupKey:
    - metadata: { name: shop-peers, namespace: demo-shop, generation: 1 }
      spec: { name: shop-peers, ephemeral: true, allowExtraDnsLabels: false, duration: 720h0m0s, autoGroups: [{ localRef: { name: developers } }] }
      status:
        observedGeneration: 1
        setupKeyID: d1demokey00shop00000
        conditions:
          - { type: Ready, status: "True", reason: Reconciled, message: "", lastTransitionTime: now-30d }
    - metadata: { name: lab-peers, namespace: demo-lab, generation: 1 }
      spec: { name: lab-peers, ephemeral: false, allowExtraDnsLabels: false }
      status:
        observedGeneration: 1
        conditions:
          - { type: Ready, status: "False", reason: APIError, message: "management API: 401 unauthorized", lastTransitionTime: now-2h }
    - metadata: { name: new-peers, namespace: demo-lab, generation: 1 }
      spec: { name: new-peers, ephemeral: true, allowExtraDnsLabels: false }
  nbRouter:
    - metadata: { name: router, namespace: demo-legacy, creationTimestamp: now-200d }
      spec: { replicas: 2 }
      status:
        routerID: d1demorouterlegacy00
        networkID: d1demonetlegacy00000
        setupKeyID: d1demokeylegacy00000
        conditions:
          - { type: Ready, status: "True", lastTransitionTime: now-200d }
    - metadata: { name: router, namespace: demo-legacy-lab, creationTimestamp: now-100d }
      spec: {}
      status:
        conditions:
          - { type: Ready, status: "False", reason: APIError, message: "error creating network router: 403 permission denied", lastTransitionTime: now-1h }
    - metadata: { name: router, namespace: demo-legacy-new, creationTimestamp: now-5s }
      spec: {}
  nbResource:
    - metadata: { name: storefront, namespace: demo-legacy, creationTimestamp: now-200d }
      spec: { name: storefront, networkID: d1demonetlegacy00000, address: storefront.demo-legacy.svc.cluster.local, groups: [developers], tcpPorts: [80, 443] }
      status:
        networkResourceID: d1demoreslegacy00000
        conditions:
          - { type: Ready, status: "True", lastTransitionTime: now-200d }
    - metadata: { name: queue, namespace: demo-legacy, creationTimestamp: now-100d }
      spec: { name: queue, networkID: d1demonetlegacy00000, address: queue.demo-legacy.svc.cluster.local, groups: [developers], udpPorts: [5353] }
      status:
        conditions:
          - { type: Ready, status: "False", reason: APIError, message: "error creating network resource: 400 invalid address", lastTransitionTime: now-1h }
    - metadata: { name: cache, namespace: demo-legacy, creationTimestamp: now-1h }
      spec: { name: cache, networkID: d1demonetlegacy00000, address: cache.demo-legacy.svc.cluster.local, groups: [developers], tcpPorts: [6379] }
      status:
        conditions:
          - { type: Ready, status: "True", lastTransitionTime: now-1h }
    - metadata: { name: fresh, namespace: demo-legacy, creationTimestamp: now-5s }
      spec: { name: fresh, networkID: d1demonetlegacy00000, address: fresh.demo-legacy.svc.cluster.local, groups: [developers] }
  service:
    - metadata: { name: storefront, namespace: demo-shop }
    - metadata: { name: wiki, namespace: demo-lab }
    - metadata: { name: grafana, namespace: demo-shop }
    - metadata: { name: docs, namespace: demo-shop }
