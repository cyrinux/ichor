# yaml-language-server: $schema=../schema/plugin.schema.json
# The NetBird operator (netbird.io) puts cluster Services on a NetBird network. The current API
# is v1alpha1: a NetworkRouter runs the routing peers, a NetworkResource publishes a Service
# through a router (with a DNS record in the router's zone), a NetworkEgress routes to an
# outside host, Groups and SetupKeys mirror their NetBird objects. The legacy v1 API
# (NBRoutingPeer, NBResource) is deprecated upstream and still served during the migration:
# both are read, each optional, so a cluster serving one version reads the other as empty.
# They are separate objects (a migration creates the v1alpha1 ones), so both lists show.
# Every v1alpha1 kind sets one condition, Ready, with the reason Reconciled (True), Dependency
# (False: a referenced Service or NetworkRouter is missing or not ready) or Progressing (False:
# "N of M routing peers ready"); v1 sets Ready with internalError or APIError when False. A
# v1alpha1 controller error today only requeues, so the "other reason" rule is a guard; the
# samples give it an APIError reason.
# Read from api/v1alpha1/condition_types.go and internal/controller/*.go (main, 2026-11-10).
schemaVersion: ichor.dev/plugin/v1alpha1
id: netbird
name: NetBird
website: https://docs.netbird.io/manage/integrations/kubernetes/routing-peer
icon: netbird
category: networking
catalogId: netbird

detect:
  - group: netbird.io

resources:
  router:
    group: netbird.io
    version: v1alpha1
    resource: networkrouters
    kind: NetworkRouter
    scope: Namespaced
    optional: true
  resource:
    group: netbird.io
    version: v1alpha1
    resource: networkresources
    kind: NetworkResource
    scope: Namespaced
    optional: true
  egress:
    group: netbird.io
    version: v1alpha1
    resource: networkegresses
    kind: NetworkEgress
    scope: Namespaced
    optional: true
  group:
    group: netbird.io
    version: v1alpha1
    resource: groups
    kind: Group
    scope: Namespaced
    optional: true
  # The spec names the key and its groups; the key itself is never in the object.
  setupKey:
    group: netbird.io
    version: v1alpha1
    resource: setupkeys
    kind: SetupKey
    scope: Namespaced
    optional: true
  nbRouter:
    group: netbird.io
    version: v1
    resource: nbroutingpeers
    kind: NBRoutingPeer
    scope: Namespaced
    optional: true
  nbResource:
    group: netbird.io
    version: v1
    resource: nbresources
    kind: NBResource
    scope: Namespaced
    optional: true
  # The Service a NetworkResource publishes: names only.
  service:
    group: ""
    version: v1
    resource: services
    kind: Service
    scope: Namespaced
    list: { metadataOnly: true, limit: 2000 }
    optional: true

fields:
  router:
    dnsZone: $.spec.dnsZoneRef.name | default("")
    replicas: $.spec.workloadOverride.replicas | default(3)
    logLevel: $.spec.logLevel | default("info")
    routingPeerID: $.status.routingPeerID | default("")
    networkID: $.status.networkID | default("")
    # The status starts at observedGeneration -1: nothing reconciled yet.
    observed: $.status.observedGeneration | default(-1) == $.metadata.generation
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  resource:
    service: $.spec.serviceRef.name | default("")
    routerName: $.spec.networkRouterRef.name | default("")
    routerNamespace: $.spec.networkRouterRef.namespace | default($.metadata.namespace)
    groups: len($.spec.groups)
    resourceID: $.status.resourceID | default("")
    networkID: $.status.networkID | default("")
    dnsRecordID: $.status.dnsRecordID | default("")
    routerRef: join(router, $.metadata.namespace == fields.routerNamespace && $.metadata.name == fields.routerName)
    serviceRef: join(service, $.metadata.namespace == left.metadata.namespace && $.metadata.name == fields.service)
    observed: $.status.observedGeneration | default(-1) == $.metadata.generation
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  egress:
    target: $.spec.target.fqdn.hostname | default($.spec.target.ip.address) | default("")
    ports: join($.spec.ports[*].port, ", ")
    routerName: $.spec.networkRouterRef.name | default("")
    routerNamespace: $.spec.networkRouterRef.namespace | default($.metadata.namespace)
    routerRef: join(router, $.metadata.namespace == fields.routerNamespace && $.metadata.name == fields.routerName)
    observed: $.status.observedGeneration | default(-1) == $.metadata.generation
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  group:
    groupName: $.spec.name | default($.metadata.name)
    groupID: $.status.groupID | default("")
    observed: $.status.observedGeneration | default(-1) == $.metadata.generation
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  setupKey:
    keyName: $.spec.name | default($.metadata.name)
    ephemeral: $.spec.ephemeral | default(false)
    duration: $.spec.duration | default("")
    autoGroups: len($.spec.autoGroups)
    setupKeyID: $.status.setupKeyID | default("")
    observed: $.status.observedGeneration | default(-1) == $.metadata.generation
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  nbRouter:
    replicas: $.spec.replicas | default(3)
    routerID: $.status.routerID | default("")
    networkID: $.status.networkID | default("")
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
  nbResource:
    address: $.spec.address | default("")
    networkID: $.spec.networkID | default("")
    tcpPorts: join($.spec.tcpPorts, ", ")
    udpPorts: join($.spec.udpPorts, ", ")
    resourceID: $.status.networkResourceID | default("")
    ready: conditions.Ready
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")

# First match wins. A Dependency is waiting on another object (warning), Progressing is the
# routing peers coming up (info); any other False reason is an error of the operator (critical).
health:
  router:
    - when: fields.ready == false && !(fields.readyReason in ["Dependency", "Progressing"])
      health: critical
      reason: failed
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: fields.ready == false && fields.readyReason == "Dependency"
      health: warning
      reason: dependency
      message: "{{ fields.readyMessage }}"
    - when: fields.ready == false && fields.readyReason == "Progressing"
      health: info
      reason: progressing
      message: "{{ fields.readyMessage }}"
    - when: "!fields.observed"
      health: info
      reason: notReconciled
      message: "not reconciled yet"
    - when: fields.routingPeerID == ""
      health: warning
      reason: noRoutingPeer
      message: "no routing peer yet"
  resource:
    - when: fields.ready == false && !(fields.readyReason in ["Dependency", "Progressing"])
      health: critical
      reason: failed
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: fields.routerName != "" && !has(fields.routerRef)
      health: warning
      reason: routerMissing
      message: "its router {{ fields.routerNamespace }}/{{ fields.routerName }} does not exist"
    - when: fields.ready == false
      health: warning
      reason: dependency
      message: "{{ fields.readyMessage }}"
    - when: "!fields.observed"
      health: info
      reason: notReconciled
      message: "not reconciled yet"
    - when: fields.resourceID == ""
      health: warning
      reason: notPublished
      message: "not published yet"
  egress:
    - when: fields.ready == false && !(fields.readyReason in ["Dependency", "Progressing"])
      health: critical
      reason: failed
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: fields.routerName != "" && !has(fields.routerRef)
      health: warning
      reason: routerMissing
      message: "its router {{ fields.routerNamespace }}/{{ fields.routerName }} does not exist"
    - when: fields.ready == false
      health: warning
      reason: dependency
      message: "{{ fields.readyMessage }}"
    - when: "!fields.observed"
      health: info
      reason: notReconciled
      message: "not reconciled yet"
  group:
    - when: fields.ready == false
      health: critical
      reason: failed
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: "!fields.observed"
      health: info
      reason: notReconciled
      message: "not reconciled yet"
  setupKey:
    - when: fields.ready == false
      health: critical
      reason: failed
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: "!fields.observed"
      health: info
      reason: notReconciled
      message: "not reconciled yet"
  nbRouter:
    - when: fields.ready == false
      health: critical
      reason: failed
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: "!has(fields.ready)"
      health: info
      reason: notReconciled
      message: "not reconciled yet"
  nbResource:
    - when: fields.ready == false
      health: critical
      reason: failed
      message: "{{ fields.readyReason }}: {{ fields.readyMessage }}"
    - when: "!has(fields.ready)"
      health: info
      reason: notReconciled
      message: "not reconciled yet"
    - when: fields.resourceID == ""
      health: warning
      reason: notPublished
      message: "not published yet"

dataServices:
  summary:
    aggregate:
      resources: count(resource) + count(nbResource)
      routers: count(router) + count(nbRouter)
      routersDown: 'count(router, health == "critical" || health == "warning") + count(nbRouter, health == "critical")'
      unpublished: 'count(resource, health == "critical" || health == "warning") + count(nbResource, health == "critical" || health == "warning")'
      egresses: count(egress)
    health: >-
      worst([worst(router.health), worst(resource.health), worst(egress.health), worst(group.health),
        worst(setupKey.health), worst(nbRouter.health), worst(nbResource.health)])

cards:
  summary:
    title: { count: dataServices.summary.resources, one: "%d NetBird resource", other: "%d NetBird resources" }
    health: dataServices.summary.health
    badges:
      - { label: "routers", value: dataServices.summary.routers, tone: info }
      - { label: "egresses", value: dataServices.summary.egresses, tone: info, hideWhenZero: true }
      - { label: "routers down", value: dataServices.summary.routersDown, tone: critical, hideWhenZero: true }
      - { label: "resource problems", value: dataServices.summary.unpublished, tone: warning, hideWhenZero: true }
  resources:
    from: resource
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No network resources."
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + " · " + fields.service + " → " + fields.routerName'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Pending")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "Service", value: fields.service, mono: true }
            - { label: "Router", value: 'fields.routerNamespace + "/" + fields.routerName', mono: true }
            - { label: "Groups", value: fields.groups }
            - { label: "Resource ID", value: fields.resourceID, mono: true }
            - { label: "Network ID", value: fields.networkID, mono: true }
            - { label: "DNS record ID", value: fields.dnsRecordID, mono: true }
        - type: conditions
        - type: relations
          items:
            - { label: "Service", ref: fields.serviceRef }
            - { label: "Router", ref: fields.routerRef }
  routers:
    from: router
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No network routers."
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + (fields.dnsZone != "" ? " · " + fields.dnsZone : "")'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Pending")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "DNS zone", value: fields.dnsZone, mono: true }
            - { label: "Replicas", value: fields.replicas }
            - { label: "Log level", value: fields.logLevel }
            - { label: "Routing peer ID", value: fields.routingPeerID, mono: true }
            - { label: "Network ID", value: fields.networkID, mono: true }
        - type: conditions
  egresses:
    from: egress
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No network egresses."
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + " · " + fields.target + (fields.ports != "" ? ":" + fields.ports : "")'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Pending")'
      trailing: { text: $.metadata.creationTimestamp | relativeTime() }
      detail:
        - type: keyValues
          items:
            - { label: "Target", value: fields.target, mono: true }
            - { label: "Ports", value: fields.ports, mono: true }
            - { label: "Router", value: 'fields.routerNamespace + "/" + fields.routerName', mono: true }
        - type: conditions
        - type: relations
          items:
            - { label: "Router", ref: fields.routerRef }
  groups:
    from: group
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No NetBird groups."
    row:
      title: fields.groupName
      subtitle: '$.metadata.namespace + "/" + $.metadata.name'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Pending")'
      detail:
        - type: keyValues
          items:
            - { label: "Group ID", value: fields.groupID, mono: true }
        - type: conditions
  setupKeys:
    from: setupKey
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No setup keys."
    row:
      title: fields.keyName
      subtitle: '$.metadata.namespace + "/" + $.metadata.name'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Pending")'
      detail:
        - type: keyValues
          items:
            - { label: "Setup key ID", value: fields.setupKeyID, mono: true }
            - { label: "Ephemeral", value: fields.ephemeral }
            - { label: "Valid for", value: fields.duration }
            - { label: "Auto groups", value: fields.autoGroups }
        - type: conditions
  legacyRouters:
    from: nbRouter
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No NBRoutingPeers (legacy v1)."
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + " · NBRoutingPeer (v1)"'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Pending")'
      detail:
        - type: keyValues
          items:
            - { label: "Replicas", value: fields.replicas }
            - { label: "Router ID", value: fields.routerID, mono: true }
            - { label: "Network ID", value: fields.networkID, mono: true }
        - type: conditions
  legacyResources:
    from: nbResource
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No NBResources (legacy v1)."
    row:
      title: $.metadata.name
      subtitle: '$.metadata.namespace + " · " + fields.address'
      status:
        tone: health
        text: 'fields.ready == true ? "Ready" : (fields.readyReason != "" ? fields.readyReason : "Pending")'
      detail:
        - type: keyValues
          items:
            - { label: "Address", value: fields.address, mono: true }
            - { label: "TCP ports", value: fields.tcpPorts, mono: true }
            - { label: "UDP ports", value: fields.udpPorts, mono: true }
            - { label: "Resource ID", value: fields.resourceID, mono: true }
            - { label: "Network ID", value: fields.networkID, mono: true }
        - type: conditions

findings:
  - { id: router-failed, from: router, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: routers }
  - { id: router-problem, from: router, when: 'health == "warning"', severity: warning, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: routers }
  - { id: resource-failed, from: resource, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: resources }
  - { id: resource-problem, from: resource, when: 'health == "warning"', severity: warning, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: resources }
  - { id: egress-failed, from: egress, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: egresses }
  - { id: egress-problem, from: egress, when: 'health == "warning"', severity: warning, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: egresses }
  - { id: group-failed, from: group, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: groups }
  - { id: setup-key-failed, from: setupKey, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: setupKeys }
  - { id: legacy-router-failed, from: nbRouter, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: legacyRouters }
  - { id: legacy-resource-failed, from: nbResource, when: 'health == "critical"', severity: critical, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: legacyResources }
  - { id: legacy-resource-problem, from: nbResource, when: 'health == "warning"', severity: warning, title: "{{ namespace }}/{{ name }}", detail: "{{ message }}", opens: legacyResources }

