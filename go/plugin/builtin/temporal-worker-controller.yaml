# yaml-language-server: $schema=../schema/plugin.schema.json
# The Temporal Worker Controller (temporalio/temporal-worker-controller, temporal.io/v1alpha1)
# rolls out versioned Temporal workers: a WorkerDeployment ramps traffic from its current
# build to a target build, through a Connection (or ClusterConnection) to the Temporal
# server; WorkerResourceTemplates attach resources to each version. On the phone: is a
# rollout stalled or ramping, is the connection to the server healthy, which builds still drain.
# temporal.io is shared with the Temporal operator (temporal-operator.yaml): detection names
# workerdeployments, so a cluster that runs only the operator does not activate this plugin.
# The deprecated kinds TemporalWorkerDeployment and TemporalConnection are not read.
# The account needs list and get on the four resources; one it may not list lands in the
# render's errors, the others still show. Connection Secrets are shown by name only, never
# read. No action: the rollout levers are edits of spec.rollout.
schemaVersion: ichor.dev/plugin/v1alpha1
id: temporal-worker-controller
name: Temporal Worker Controller
website: https://github.com/temporalio/temporal-worker-controller
icon: temporal
category: workloads
catalogId: temporal-worker-controller

detect:
  - group: temporal.io
    resource: workerdeployments

resources:
  workerdeployment:
    group: temporal.io
    version: v1alpha1
    resource: workerdeployments
    kind: WorkerDeployment
    scope: Namespaced
  # No status upstream.
  connection:
    group: temporal.io
    version: v1alpha1
    resource: connections
    kind: Connection
    scope: Namespaced
  clusterconnection:
    group: temporal.io
    version: v1alpha1
    resource: clusterconnections
    kind: ClusterConnection
    scope: Cluster
  workerresourcetemplate:
    group: temporal.io
    version: v1alpha1
    resource: workerresourcetemplates
    kind: WorkerResourceTemplate
    scope: Namespaced

fields:
  workerdeployment:
    current: $.status.currentVersion.buildID | default("")
    target: $.status.targetVersion.buildID | default("")
    # NotRegistered, Created, Inactive, Ramping, Current, Draining or Drained.
    targetStatus: $.status.targetVersion.status | default("")
    ramp: $.status.targetVersion.rampPercentage | default(0)
    rampingSince: $.status.targetVersion.rampingSince | time()
    strategy: $.spec.rollout.strategy | default("")
    replicas: $.spec.replicas | default(1)
    versions: $.status.versionCount | default(0)
    draining: join($.status.deprecatedVersions[?(@.status == "Draining")].buildID | default([]), ", ")
    connection: coalesce($.status.observedConnectionRef.name, $.spec.workerOptions.connectionRef.name, "")
    temporalNamespace: $.spec.workerOptions.temporalNamespace | default("")
    createdAt: $.metadata.creationTimestamp | time()
  connection:
    host: $.spec.hostPort | default("")
    auth: 'has($.spec.mutualTLSSecretRef) ? "mTLS" : (has($.spec.apiKeySecretRef) ? "API key" : "none")'
    secret: coalesce($.spec.mutualTLSSecretRef.name, $.spec.apiKeySecretRef.name, "")
    tlsServerName: $.spec.tls.serverName | default("")
    createdAt: $.metadata.creationTimestamp | time()
  clusterconnection:
    host: $.spec.hostPort | default("")
    auth: 'has($.spec.mutualTLSSecretRef) ? "mTLS" : (has($.spec.apiKeySecretRef) ? "API key" : "none")'
    secret: coalesce($.spec.mutualTLSSecretRef.name, $.spec.apiKeySecretRef.name, "")
    tlsServerName: $.spec.tls.serverName | default("")
    createdAt: $.metadata.creationTimestamp | time()
  workerresourcetemplate:
    worker: coalesce($.spec.workerDeploymentRef.name, $.spec.temporalWorkerDeploymentRef.name, "")
    templateKind: $.spec.template.kind | default("")
    workerObj: join(workerdeployment, $.metadata.namespace == left.metadata.namespace && $.metadata.name == coalesce(left.spec.workerDeploymentRef.name, left.spec.temporalWorkerDeploymentRef.name, ""))
    createdAt: $.metadata.creationTimestamp | time()

health:
  workerdeployment:
    - when: conditions.Stalled == true
      health: critical
      reason: rolloutStalled
      message: 'rollout stalled: {{ condition("Stalled").message }}'
    - when: conditions.ConnectionHealthy == false
      health: critical
      reason: connectionUnhealthy
      message: 'cannot reach Temporal: {{ condition("ConnectionHealthy").message }}'
    - when: conditions.Ready == false
      health: warning
      reason: notReady
      message: 'not ready: {{ condition("Ready").message }}'
    - when: fields.targetStatus == "Ramping"
      health: info
      reason: ramping
      message: "ramping {{ fields.target }} at {{ fields.ramp }}%"
    - when: fields.target != "" && fields.current != fields.target
      health: info
      reason: rolloutInProgress
      message: "rolling out {{ fields.target }}"
    - when: conditions.Ready == null
      health: unknown
      reason: notReconciled
      message: "not reconciled yet"
  workerresourcetemplate:
    - when: fields.workerObj == null
      health: warning
      reason: workerMissing
      message: "worker deployment {{ fields.worker }} not found"

dataServices:
  summary:
    aggregate:
      workers: count(workerdeployment)
      ramping: count(workerdeployment, fields.targetStatus == "Ramping")
      stalled: count(workerdeployment, health == "critical")
    health: worst([worst(workerdeployment.health), worst(workerresourcetemplate.health)])

cards:
  summary:
    title: { count: dataServices.summary.workers, one: "%d worker deployment", other: "%d worker deployments" }
    health: dataServices.summary.health
    badges:
      - { label: "stalled", value: dataServices.summary.stalled, tone: critical, hideWhenZero: true }
      - { label: "ramping", value: dataServices.summary.ramping, tone: info, hideWhenZero: true }
  workers:
    from: workerdeployment
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No worker deployments."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.targetStatus
      trailing: { text: 'fields.targetStatus == "Ramping" ? string(fields.ramp) + "%" : fields.current' }
      detail:
        - type: gauge
          label: "Ramp"
          value: fields.ramp
          max: 100
          unit: "%"
          tone: health
        - type: keyValues
          items:
            - { label: "Current build", value: fields.current, mono: true }
            - { label: "Target build", value: fields.target, mono: true }
            - { label: "Strategy", value: fields.strategy }
            - { label: "Ramping since", value: fields.rampingSince | relativeTime() }
            - { label: "Replicas", value: fields.replicas }
            - { label: "Versions", value: fields.versions }
            - { label: "Draining builds", value: fields.draining, mono: true }
            - { label: "Connection", value: fields.connection, mono: true }
            - { label: "Temporal namespace", value: fields.temporalNamespace, mono: true }
            - { label: "Created", value: fields.createdAt | relativeTime() }
        - type: conditions
  connections:
    from: connection
    sort: [$.metadata.namespace, $.metadata.name]
    empty: "No connections."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.auth
      trailing: { text: fields.host }
      detail:
        - type: keyValues
          items:
            - { label: "Host", value: fields.host, mono: true }
            - { label: "Authentication", value: fields.auth }
            - { label: "Secret", value: fields.secret, mono: true }
            - { label: "TLS server name", value: fields.tlsServerName, mono: true }
            - { label: "Created", value: fields.createdAt | relativeTime() }
  clusterConnections:
    from: clusterconnection
    sort: [$.metadata.name]
    empty: "No cluster connections."
    row:
      title: $.metadata.name
      status:
        tone: health
        text: fields.auth
      trailing: { text: fields.host }
      detail:
        - type: keyValues
          items:
            - { label: "Host", value: fields.host, mono: true }
            - { label: "Authentication", value: fields.auth }
            - { label: "Secret", value: fields.secret, mono: true }
            - { label: "TLS server name", value: fields.tlsServerName, mono: true }
            - { label: "Created", value: fields.createdAt | relativeTime() }
  templates:
    from: workerresourcetemplate
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No worker resource templates."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.templateKind
      trailing: { text: fields.worker }
      detail:
        - type: keyValues
          items:
            - { label: "Worker deployment", value: fields.worker, mono: true }
            - { label: "Kind", value: fields.templateKind }
            - { label: "Created", value: fields.createdAt | relativeTime() }
        - type: relations
          items:
            - { label: "Worker deployment", ref: fields.workerObj }
        - type: conditions

findings:
  - id: rollout-stalled
    from: workerdeployment
    when: conditions.Stalled == true
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: workers
  - id: connection-unhealthy
    from: workerdeployment
    when: conditions.Stalled != true && conditions.ConnectionHealthy == false
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: workers
  - id: worker-not-ready
    from: workerdeployment
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: workers

