# Invented names. payments-worker ramps build-2a9f at 25%, orders-worker runs one build,
# reports-worker is stalled, fraud-worker cannot reach Temporal, mailer-worker is not ready,
# search-worker rolls out without ramping, new-worker is fresh.
samples:
  workerdeployment:
    - metadata: { name: payments-worker, namespace: demo-shop, creationTimestamp: now-20d }
      spec:
        replicas: 3
        rollout: { strategy: Progressive, steps: [{ rampPercentage: 25, pauseDuration: 10m }, { rampPercentage: 75, pauseDuration: 10m }] }
        sunset: { scaledownDelay: 1h, deleteDelay: 24h }
        workerOptions: { connectionRef: { name: temporal-prod }, temporalNamespace: payments }
      status:
        currentVersion: { buildID: build-17c4, status: Current }
        targetVersion: { buildID: build-2a9f, status: Ramping, rampPercentage: 25, rampingSince: now-7m }
        deprecatedVersions:
          - { buildID: build-0b31, status: Draining }
          - { buildID: build-0a02, status: Drained, drainedSince: now-2d }
        versionCount: 4
        conditions:
          - { type: Ready, status: "True", lastTransitionTime: now-20d }
          - { type: ConnectionHealthy, status: "True", lastTransitionTime: now-20d }
          - { type: Progressing, status: "True", reason: Ramping, lastTransitionTime: now-7m }
    - metadata: { name: orders-worker, namespace: demo-shop, creationTimestamp: now-40d }
      spec:
        rollout: { strategy: AllAtOnce }
        sunset: {}
        workerOptions: { connectionRef: { name: temporal-prod }, temporalNamespace: orders }
      status:
        currentVersion: { buildID: build-9e40, status: Current }
        targetVersion: { buildID: build-9e40, status: Current }
        versionCount: 1
        conditions:
          - { type: Ready, status: "True", lastTransitionTime: now-3d }
          - { type: ConnectionHealthy, status: "True", lastTransitionTime: now-40d }
          - { type: RolloutComplete, status: "True", lastTransitionTime: now-3d }
    - metadata: { name: reports-worker, namespace: demo-lab, creationTimestamp: now-9d }
      spec:
        rollout: { strategy: Progressive, steps: [{ rampPercentage: 10, pauseDuration: 5m }] }
        sunset: {}
        workerOptions: { connectionRef: { name: temporal-lab }, temporalNamespace: reports }
      status:
        currentVersion: { buildID: build-51aa, status: Current }
        targetVersion: { buildID: build-6c02, status: Inactive }
        versionCount: 2
        conditions:
          - { type: Ready, status: "True", lastTransitionTime: now-9d }
          - { type: ConnectionHealthy, status: "True", lastTransitionTime: now-9d }
          - { type: Stalled, status: "True", reason: GateWorkflowFailed, message: "gate workflow failed on build-6c02", lastTransitionTime: now-35m }
    - metadata: { name: fraud-worker, namespace: demo-lab, creationTimestamp: now-4d }
      spec:
        rollout: { strategy: Manual }
        sunset: {}
        workerOptions: { connectionRef: { name: temporal-lab }, temporalNamespace: fraud }
      status:
        currentVersion: { buildID: build-c3d1, status: Current }
        targetVersion: { buildID: build-c3d1, status: Current }
        conditions:
          - { type: ConnectionHealthy, status: "False", reason: AuthFailed, message: "temporal-frontend.demo-lab:7233: certificate expired", lastTransitionTime: now-12m }
    - metadata: { name: mailer-worker, namespace: demo-shop, creationTimestamp: now-6d }
      spec:
        rollout: { strategy: AllAtOnce }
        sunset: {}
        workerOptions: { connectionRef: { name: temporal-prod }, temporalNamespace: mail }
      status:
        currentVersion: { buildID: build-88f0, status: Current }
        targetVersion: { buildID: build-88f0, status: Current }
        conditions:
          - { type: Ready, status: "False", reason: PodsNotReady, message: "1 of 2 pods ready", lastTransitionTime: now-4m }
          - { type: ConnectionHealthy, status: "True", lastTransitionTime: now-6d }
    - metadata: { name: search-worker, namespace: demo-lab, creationTimestamp: now-11d }
      spec:
        rollout: { strategy: AllAtOnce }
        sunset: {}
        workerOptions: { connectionRef: { name: temporal-lab }, temporalNamespace: search }
      status:
        currentVersion: { buildID: build-1f2e, status: Current }
        targetVersion: { buildID: build-3b7d, status: Created }
        conditions:
          - { type: Ready, status: "True", lastTransitionTime: now-11d }
          - { type: ConnectionHealthy, status: "True", lastTransitionTime: now-11d }
    - metadata: { name: new-worker, namespace: demo-shop, creationTimestamp: now-1m }
      spec:
        rollout: { strategy: AllAtOnce }
        sunset: {}
        workerOptions: { connectionRef: { name: temporal-prod }, temporalNamespace: payments }
  connection:
    - metadata: { name: temporal-prod, namespace: demo-shop, creationTimestamp: now-40d }
      spec: { hostPort: "temporal-frontend.demo-shop:7233", mutualTLSSecretRef: { name: temporal-prod-mtls } }
    - metadata: { name: temporal-lab, namespace: demo-lab, creationTimestamp: now-12d }
      spec: { hostPort: "temporal-frontend.demo-lab:7233", apiKeySecretRef: { name: temporal-lab-key, key: api-key }, tls: { serverName: frontend.demo-lab } }
  clusterconnection:
    - metadata: { name: temporal-shared, creationTimestamp: now-50d }
      spec: { hostPort: "temporal-frontend.demo-shared:7233", mutualTLSSecretRef: { name: temporal-shared-mtls } }
    - metadata: { name: temporal-dev, creationTimestamp: now-5d }
      spec: { hostPort: "temporal-frontend.demo-dev:7233" }
  workerresourcetemplate:
    - metadata: { name: payments-hpa, namespace: demo-shop, creationTimestamp: now-20d }
      spec:
        workerDeploymentRef: { name: payments-worker }
        template: { apiVersion: autoscaling/v2, kind: HorizontalPodAutoscaler, spec: { minReplicas: 2, maxReplicas: 6 } }
    - metadata: { name: legacy-pdb, namespace: demo-lab, creationTimestamp: now-30d }
      spec:
        workerDeploymentRef: { name: old-worker }
        template: { apiVersion: policy/v1, kind: PodDisruptionBudget, spec: { minAvailable: 1 } }
