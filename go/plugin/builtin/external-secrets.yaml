# yaml-language-server: $schema=../schema/plugin.schema.json
# External Secrets Operator copies secrets from a backend (Vault, a cloud KMS…) into Kubernetes
# Secrets (ExternalSecret, SecretStore and ClusterSecretStore, external-secrets.io). A secret
# that stopped syncing keeps its last value silently: each ExternalSecret shows whether it
# syncs, from which store, how often and when it last refreshed, and links its target Secret
# (its name only; its data stays masked). version: preferred reads v1 on current ESO and
# v1beta1 on older ones: the paths used here exist in both. Up to 2000 ExternalSecrets are
# read; more is a partial tree.
# The cluster checkup still has its own ESO findings (checkupExternalSecrets in
# go/ichorgo/kube_checkup_addons.go) until plugin findings feed it.
schemaVersion: ichor.dev/plugin/v1alpha1
id: external-secrets
name: External Secrets
website: https://external-secrets.io
icon: external-secrets
category: security
catalogId: external-secrets

detect:
  - group: external-secrets.io
    resource: externalsecrets

resources:
  externalSecret:
    group: external-secrets.io
    version: preferred
    resource: externalsecrets
    kind: ExternalSecret
    scope: Namespaced
    list: { limit: 2000 }
  # The stores are optional: an account that may not list them still sees the ExternalSecrets,
  # without the store's readiness.
  secretStore:
    group: external-secrets.io
    version: preferred
    resource: secretstores
    kind: SecretStore
    scope: Namespaced
    optional: true
  clusterSecretStore:
    group: external-secrets.io
    version: preferred
    resource: clustersecretstores
    kind: ClusterSecretStore
    scope: Cluster
    optional: true
  # The Secrets ESO writes, all labelled reconcile.external-secrets.io/managed=true: only their
  # names are shown, as links. Optional: an account that may not list Secrets sees the rows
  # without the link, and no error. So a missing target is the controller's own reason
  # (SecretDeleted, SecretMissing), never a join that found nothing.
  targetSecret:
    group: ""
    version: v1
    resource: secrets
    kind: Secret
    scope: Namespaced
    list: { labelSelector: "reconcile.external-secrets.io/managed=true" }
    optional: true

fields:
  externalSecret:
    targetName: $.spec.target.name | default($.metadata.name)
    creationPolicy: $.spec.target.creationPolicy | default("Owner")
    storeKind: $.spec.secretStoreRef.kind | default("SecretStore")
    storeName: $.spec.secretStoreRef.name | default("")
    refreshInterval: $.spec.refreshInterval | default("1h0m0s")
    refreshPolicy: $.spec.refreshPolicy | default("Periodic")
    refreshedAt: $.status.refreshTime | time()
    readyReason: condition("Ready").reason | default("")
    readyMessage: condition("Ready").message | default("")
    # Both come with Ready=True (see the first health rule).
    targetDeleted: fields.readyReason == "SecretDeleted"
    targetMissing: fields.readyReason == "SecretMissing"
    # A SecretStore is in the ExternalSecret's namespace; a ClusterSecretStore has none.
    store: >-
      fields.storeKind == "ClusterSecretStore"
      ? join(clusterSecretStore, $.metadata.name == left.spec.secretStoreRef.name)
      : join(secretStore, $.metadata.namespace == left.metadata.namespace && $.metadata.name == left.spec.secretStoreRef.name)
    # null when the store cannot be read or has not been validated yet: nothing to say then.
    storeCondition: condition(fields.store, "Ready")
    storeReady: 'has(fields.storeCondition) ? fields.storeCondition.status == "True" : null'
    target: join(targetSecret, $.metadata.namespace == left.metadata.namespace && $.metadata.name == (left.spec.target.name | default(left.metadata.name)))
    # Stale: synced, but a periodic refresh missed for two intervals plus ten minutes of grace
    # (one that does not sync says so already). "0s" never refreshes, and CreatedOnce or
    # OnChange do not refresh on a clock.
    intervalMs: duration(fields.refreshInterval)
    # Sync windows (spec.syncWindows) may hold refreshes back on purpose: never stale then.
    stale: 'conditions.Ready == true && fields.refreshPolicy == "Periodic" && !has($.spec.syncWindows) && fields.intervalMs > 0 && fields.refreshedAt != 0 && age(fields.refreshedAt) > 2 * fields.intervalMs + 600000'

health:
  externalSecret:
    # The controller reports both with Ready=True: SecretDeleted, it deleted the target because
    # the provider returned no data (deletionPolicy: Delete); SecretMissing, creationPolicy:
    # Merge waits for a Secret nobody created. The Deleted condition type is only set on an
    # ExternalSecret already gone, read here should a release store it.
    - when: conditions.Deleted || fields.targetDeleted || fields.targetMissing
      health: critical
      reason: targetMissing
      message: "its Secret is missing"
    - when: conditions.Ready == false
      health: warning
      reason: notSynced
      message: "does not sync: {{ fields.readyMessage }}"
    - when: fields.storeReady == false
      health: warning
      reason: storeNotReady
      message: "its store is not ready"
    - when: fields.stale
      health: warning
      reason: stale
      message: "last refreshed {{ relativeTime(fields.refreshedAt) }}"
    - when: "!has(conditions.Ready)"
      health: idle
      reason: neverSynced
      message: "not synced yet"
  secretStore:
    - when: conditions.Ready == false
      health: critical
      reason: storeNotReady
      message: 'cannot reach its backend: {{ condition("Ready").message }}'
    - when: "!has(conditions.Ready)"
      health: unknown
      reason: notValidated
      message: "not validated yet"
  clusterSecretStore:
    - when: conditions.Ready == false
      health: critical
      reason: storeNotReady
      message: 'cannot reach its backend: {{ condition("Ready").message }}'
    - when: "!has(conditions.Ready)"
      health: unknown
      reason: notValidated
      message: "not validated yet"

dataServices:
  summary:
    aggregate:
      total: count(externalSecret)
      notSynced: count(externalSecret, conditions.Ready == false)
      stale: count(externalSecret, fields.stale)
      stores: count(secretStore) + count(clusterSecretStore)
      storesNotReady: count(secretStore, health == "critical") + count(clusterSecretStore, health == "critical")
    health: worst([worst(externalSecret.health), worst(secretStore.health), worst(clusterSecretStore.health)])

cards:
  summary:
    title: { count: dataServices.summary.total, one: "%d external secret", other: "%d external secrets" }
    health: dataServices.summary.health
    badges:
      - { label: "not synced", value: dataServices.summary.notSynced, tone: warning, hideWhenZero: true }
      - { label: "stale", value: dataServices.summary.stale, tone: warning, hideWhenZero: true }
      - { label: "stores down", value: dataServices.summary.storesNotReady, tone: critical, hideWhenZero: true }
  secrets:
    from: externalSecret
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No external secrets."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: 'fields.targetDeleted ? "Deleted" : (fields.targetMissing ? "Missing" :(conditions.Ready ? "Synced" : (has(conditions.Ready) ? "Not synced" : "Pending")))'
      trailing: { text: relativeTime(fields.refreshedAt) }
      detail:
        - type: keyValues
          items:
            - { label: "Store", value: 'fields.storeKind + "/" + fields.storeName', mono: true }
            - { label: "Refresh interval", value: fields.refreshInterval, mono: true }
            - { label: "Refresh policy", value: fields.refreshPolicy }
            - { label: "Target Secret", value: fields.targetName, mono: true }
            - { label: "Creation policy", value: fields.creationPolicy }
            - { label: "Last refresh", value: fields.refreshedAt | relativeTime() }
        - type: conditions
        - type: relations
          items:
            - { label: "Store", ref: fields.store }
            - { label: "Target Secret", ref: fields.target }
        - type: actions
          items: [forceSync]
  stores:
    from: secretStore
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No secret stores."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: 'conditions.Ready ? "Ready" : (has(conditions.Ready) ? "Not ready" : "Pending")'
      detail:
        - type: keyValues
          items:
            - { label: "Capabilities", value: $.status.capabilities | default("") }
            - { label: "Created", value: $.metadata.creationTimestamp | relativeTime() }
        - type: conditions
  clusterStores:
    from: clusterSecretStore
    sort: [health desc, $.metadata.name]
    empty: "No cluster secret stores."
    row:
      title: $.metadata.name
      subtitle: '"ClusterSecretStore"'
      status:
        tone: health
        text: 'conditions.Ready ? "Ready" : (has(conditions.Ready) ? "Not ready" : "Pending")'
      detail:
        - type: keyValues
          items:
            - { label: "Capabilities", value: $.status.capabilities | default("") }
            - { label: "Created", value: $.metadata.creationTimestamp | relativeTime() }
        - type: conditions

findings:
  - id: secret-warning
    from: externalSecret
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: secrets
  - id: target-missing
    from: externalSecret
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: secrets
  - id: store-not-ready
    from: secretStore
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: stores
  - id: cluster-store-not-ready
    from: clusterSecretStore
    when: health == "critical"
    severity: critical
    title: "{{ name }}"
    detail: "{{ message }}"
    opens: clusterStores

# ESO re-syncs an ExternalSecret as soon as its external-secrets.io/force-sync annotation
# changes (any new value: {{ now }} is unix milliseconds). Upstream, shouldRefresh never
# refreshes a CreatedOnce secret that synced once, whatever its annotations: the button is off
# there. The enabledWhen pins the patch to the resourceVersion the policy was checked on.
actions:
  forceSync:
    label: "Refresh now"
    on: externalSecret
    verb: annotate
    body:
      "external-secrets.io/force-sync": "{{ now }}"
    rbac: { verbs: [patch], group: external-secrets.io, resource: externalsecrets }
    confirm: plain
    audit: external-secrets.forceSync
    enabledWhen: fields.refreshPolicy != "CreatedOnce"
    disabledReason: "refreshed once by policy"

# Invented names. demo-shop reads a Vault store that works: one secret synced 20 minutes ago,
# one the backend refuses, one not refreshed for 5 hours. demo-lab's secrets: one whose target
# Secret was deleted, one on a store not validated yet that never synced, one on the shared
# ClusterSecretStore, which fails. demo-lab's legacy-vault store fails too, and the
# shared-vault ClusterSecretStore is not validated yet. Times are relative to the clock (now-20m): a fixed date
# would read stale a day later.
samples:
  externalSecret:
    - metadata: { name: api-credentials, namespace: demo-shop }
      spec:
        refreshInterval: 1h0m0s
        secretStoreRef: { kind: SecretStore, name: demo-vault }
        target: { name: api-credentials, creationPolicy: Owner }
      status:
        refreshTime: now-20m
        conditions:
          - { type: Ready, status: "True", reason: SecretSynced, message: secret synced, lastTransitionTime: now-2d }
    - metadata: { name: payment-keys, namespace: demo-shop }
      spec:
        refreshInterval: 15m
        secretStoreRef: { name: demo-vault }
      status:
        refreshTime: now-3h
        conditions:
          - { type: Ready, status: "False", reason: SecretSyncedError, message: "could not get secret data from provider: permission denied", lastTransitionTime: now-3h }
    - metadata: { name: smtp-relay, namespace: demo-shop }
      spec:
        refreshInterval: 1h0m0s
        secretStoreRef: { kind: SecretStore, name: demo-vault }
      status:
        refreshTime: now-5h
        conditions:
          - { type: Ready, status: "True", reason: SecretSynced, message: secret synced, lastTransitionTime: now-5d }
    - metadata: { name: registry-pull, namespace: demo-lab }
      spec:
        refreshInterval: 1h0m0s
        secretStoreRef: { kind: ClusterSecretStore, name: shared-kms }
        target: { name: registry-auth }
      status:
        refreshTime: now-40m
        conditions:
          - { type: Ready, status: "True", reason: SecretDeleted, message: secret deleted due to DeletionPolicy=Delete, lastTransitionTime: now-40m }
    - metadata: { name: feature-flags, namespace: demo-lab }
      spec:
        refreshPolicy: OnChange
        secretStoreRef: { name: demo-new }
    - metadata: { name: tls-bundle, namespace: demo-lab }
      spec:
        refreshInterval: 24h
        secretStoreRef: { kind: ClusterSecretStore, name: shared-kms }
        target: { name: tls-bundle, creationPolicy: Merge }
      status:
        refreshTime: now-30m
        conditions:
          - { type: Ready, status: "True", reason: SecretSynced, message: secret synced, lastTransitionTime: now-30m }
  secretStore:
    - metadata: { name: demo-vault, namespace: demo-shop }
      spec: { provider: { vault: { server: "https://vault.demo-shop.svc:8200", path: secret } } }
      status:
        capabilities: ReadWrite
        conditions:
          - { type: Ready, status: "True", reason: Valid, message: store validated, lastTransitionTime: now-7d }
    - metadata: { name: demo-new, namespace: demo-lab }
      spec: { provider: { fake: { data: [] } } }
    - metadata: { name: legacy-vault, namespace: demo-lab }
      spec: { provider: { vault: { server: "https://vault.demo-lab.svc:8200", path: kv } } }
      status:
        capabilities: ReadOnly
        conditions:
          - { type: Ready, status: "False", reason: InvalidProviderConfig, message: "unable to log in to vault: token expired", lastTransitionTime: now-2h }
  clusterSecretStore:
    - metadata: { name: shared-kms }
      spec: { provider: { aws: { service: SecretsManager, region: eu-west-1 } } }
      status:
        conditions:
          - { type: Ready, status: "False", reason: ValidationFailed, message: "could not validate provider: access denied", lastTransitionTime: now-1h }
    - metadata: { name: shared-vault }
      spec: { provider: { vault: { server: "https://vault.demo-shared.svc:8200", path: kv } } }
  targetSecret:
    - metadata: { name: api-credentials, namespace: demo-shop, labels: { reconcile.external-secrets.io/managed: "true" } }
      type: Opaque
    - metadata: { name: smtp-relay, namespace: demo-shop, labels: { reconcile.external-secrets.io/managed: "true" } }
      type: Opaque
    - metadata: { name: tls-bundle, namespace: demo-lab, labels: { reconcile.external-secrets.io/managed: "true" } }
      type: Opaque

