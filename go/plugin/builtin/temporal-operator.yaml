# Invented names. demo-shop's orders-cluster is ready; demo-lab's billing-cluster is not
# (its frontend is down), and analytics upgrades. Namespaces, schedules and clients cover
# every rule; nightly-report is paused, cleanup ran out of actions.
samples:
  temporalcluster:
    - metadata: { name: orders-cluster, namespace: demo-shop, creationTimestamp: now-30d }
      spec:
        version: 1.28.1
        numHistoryShards: 512
        persistence:
          defaultStore: { name: default, sql: { pluginName: postgres12, databaseName: temporal, connectAddr: "postgres.demo-shop:5432", connectProtocol: tcp, user: temporal }, passwordSecretRef: { name: temporal-db, key: password } }
          visibilityStore: { name: visibility, sql: { pluginName: postgres12, databaseName: temporal_visibility, connectAddr: "postgres.demo-shop:5432", connectProtocol: tcp, user: temporal }, passwordSecretRef: { name: temporal-db, key: password } }
        ui: { enabled: true }
        mTLS: { provider: cert-manager }
      status:
        version: 1.28.1
        persistence: { defaultStore: { type: postgres12, setup: true, created: true, schemaVersion: "1.15" } }
        services:
          - { name: frontend, ready: true, version: 1.28.1 }
          - { name: history, ready: true, version: 1.28.1 }
          - { name: matching, ready: true, version: 1.28.1 }
          - { name: worker, ready: true, version: 1.28.1 }
        conditions:
          - { type: Ready, status: "True", reason: ServicesReady, message: all services are ready, lastTransitionTime: now-2d }
          - { type: ReconcileSuccess, status: "True", reason: ReconcileSuccess, lastTransitionTime: now-5m }
    - metadata: { name: billing-cluster, namespace: demo-lab, creationTimestamp: now-12d }
      spec:
        version: 1.28.1
        numHistoryShards: 4
        persistence:
