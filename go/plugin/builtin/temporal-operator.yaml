# yaml-language-server: $schema=../schema/plugin.schema.json
# The Temporal operator (alexandrevilain/temporal-operator, temporal.io/v1beta1) runs the
# Temporal server: TemporalCluster, its TemporalNamespaces and TemporalSchedules, and the
# TemporalClusterClients that get an mTLS certificate. On the phone: is the server Ready and
# which of its services are not, does a namespace or a schedule fail to reconcile, is a
# schedule paused or out of actions; and pause or unpause a schedule.
# temporal.io is shared with the Temporal Worker Controller (temporal-worker-controller.yaml):
# detection names temporalclusters, so a cluster that runs only the controller does not
# activate this plugin.
# The account needs list and get on the four resources; one it may not list lands in the
# render's errors, the others still show. Pause and unpause need patch on temporalschedules.
# A client's certificate Secret is shown by name only, never read.
schemaVersion: ichor.dev/plugin/v1alpha1
id: temporal-operator
name: Temporal
website: https://github.com/alexandrevilain/temporal-operator
icon: temporal
category: workloads
catalogId: temporal

detect:
  - group: temporal.io
    resource: temporalclusters

resources:
  temporalcluster:
    group: temporal.io
    version: v1beta1
    resource: temporalclusters
    kind: TemporalCluster
    scope: Namespaced
  # No printer columns upstream.
  temporalnamespace:
    group: temporal.io
    version: v1beta1
    resource: temporalnamespaces
    kind: TemporalNamespace
    scope: Namespaced
  temporalschedule:
    group: temporal.io
    version: v1beta1
    resource: temporalschedules
    kind: TemporalSchedule
    scope: Namespaced
  # No printer columns and no conditions upstream.
  temporalclusterclient:
    group: temporal.io
    version: v1beta1
    resource: temporalclusterclients
    kind: TemporalClusterClient
    scope: Namespaced

fields:
  temporalcluster:
    version: $.status.version | default("")
    wantVersion: $.spec.version | default("")
    shards: $.spec.numHistoryShards | default(0)
    # status.services is absent until the operator reconciles once.
    servicesTotal: len($.status.services | default([]))
    servicesReady: len($.status.services[?(@.ready == true)] | default([]))
    servicesDown: join($.status.services[?(@.ready != true)].name | default([]), ", ")
    storeType: $.status.persistence.defaultStore.type | default("")
    storeSetup: $.status.persistence.defaultStore.setup | default(false)
    uiEnabled: $.spec.ui.enabled | default(false)
    mtls: $.spec.mTLS.provider | default("")
    createdAt: $.metadata.creationTimestamp | time()
  temporalnamespace:
    cluster: $.spec.clusterRef.name | default("")
    retention: $.spec.retentionPeriod | default("")
    global: $.spec.isGlobalNamespace | default(false)
    owner: $.spec.ownerEmail | default("")
    description: $.spec.description | default("")
    clusterObj: join(temporalcluster, $.metadata.name == (left.spec.clusterRef.name | default("")) && $.metadata.namespace == (left.spec.clusterRef.namespace | default(left.metadata.namespace)))
    createdAt: $.metadata.creationTimestamp | time()
  temporalschedule:
    temporalNamespace: $.spec.namespaceRef.name | default("")
    paused: $.spec.schedule.state.paused | default(false)
    notes: $.spec.schedule.state.notes | default("")
    workflowType: $.spec.schedule.action.workflow.type | default("")
    taskQueue: $.spec.schedule.action.workflow.taskQueue | default("")
    crons: join($.spec.schedule.spec.crons | default([]), ", ")
    intervals: len($.spec.schedule.spec.intervals | default([]))
    calendars: len($.spec.schedule.spec.calendars | default([]))
    tz: $.spec.schedule.spec.timezoneName | default("UTC")
    remaining: $.spec.schedule.state.remainingActions | default(0)
    limited: $.spec.schedule.state.limitedActions | default(false)
    state: 'fields.paused ? "Paused" : "Active"'
    createdAt: $.metadata.creationTimestamp | time()
  temporalclusterclient:
    cluster: $.spec.clusterRef.name | default("")
    serverName: $.status.serverName | default("")
    secret: $.status.secretRef.name | default("")
    createdAt: $.metadata.creationTimestamp | time()

health:
  temporalcluster:
    - when: conditions.Ready == false
      health: critical
      reason: notReady
      message: 'not ready: {{ condition("Ready").message }}'
    - when: conditions.ReconcileSuccess == false
      health: warning
      reason: reconcileFailed
      message: 'reconcile failed: {{ condition("ReconcileSuccess").message }}'
    - when: fields.servicesReady < fields.servicesTotal
      health: warning
      reason: servicesDown
      message: "services not ready: {{ fields.servicesDown }}"
    - when: fields.wantVersion != "" && fields.version != "" && fields.version != fields.wantVersion
      health: info
      reason: upgrading
      message: "upgrading to {{ fields.wantVersion }}"
    - when: conditions.Ready == null
      health: unknown
      reason: notReconciled
      message: "not reconciled yet"
  temporalnamespace:
    - when: conditions.Ready == false
      health: critical
      reason: notReady
      message: 'not ready: {{ condition("Ready").message }}'
    - when: conditions.ReconcileSuccess == false
      health: warning
      reason: reconcileFailed
      message: 'reconcile failed: {{ condition("ReconcileSuccess").message }}'
    - when: conditions.Ready == null
      health: unknown
      reason: notReconciled
      message: "not reconciled yet"
  temporalschedule:
    - when: conditions.Ready == false
      health: critical
      reason: notReady
      message: 'not ready: {{ condition("Ready").message }}'
    - when: conditions.ReconcileSuccess == false
      health: warning
      reason: reconcileFailed
      message: 'reconcile failed: {{ condition("ReconcileSuccess").message }}'
    - when: fields.paused
      health: idle
      reason: paused
      message: "paused"
    - when: fields.limited && fields.remaining == 0
      health: warning
      reason: exhausted
      message: "no action left"
    - when: conditions.Ready == null
      health: unknown
      reason: notReconciled
      message: "not reconciled yet"
  temporalclusterclient:
    - when: fields.secret == ""
      health: unknown
      reason: notReconciled
      message: "no certificate yet"

dataServices:
  summary:
    aggregate:
      clusters: count(temporalcluster)
      clustersNotReady: count(temporalcluster, health == "critical")
      namespaces: count(temporalnamespace)
      schedules: count(temporalschedule)
      schedulesPaused: count(temporalschedule, fields.paused)
    health: worst([worst(temporalcluster.health), worst(temporalnamespace.health), worst(temporalschedule.health), worst(temporalclusterclient.health)])

cards:
  summary:
    title: { count: dataServices.summary.clusters, one: "%d Temporal cluster", other: "%d Temporal clusters" }
    health: dataServices.summary.health
    badges:
      - { label: "not ready", value: dataServices.summary.clustersNotReady, tone: critical, hideWhenZero: true }
      - { label: "paused schedules", value: dataServices.summary.schedulesPaused, tone: info, hideWhenZero: true }
  clusters:
    from: temporalcluster
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No Temporal clusters."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.version
      trailing: { text: 'string(fields.servicesReady) + "/" + string(fields.servicesTotal)' }
      detail:
        - type: gauge
          label: "Services ready"
          value: fields.servicesReady
          max: fields.servicesTotal
          tone: health
        - type: keyValues
          items:
            - { label: "Version", value: fields.version, mono: true }
            - { label: "Wanted", value: fields.wantVersion, mono: true }
            - { label: "Services not ready", value: fields.servicesDown }
            - { label: "History shards", value: fields.shards }
            - { label: "Default store", value: fields.storeType }
            - { label: "Store set up", value: fields.storeSetup }
            - { label: "Web UI", value: fields.uiEnabled }
            - { label: "mTLS", value: fields.mtls }
            - { label: "Created", value: fields.createdAt | relativeTime() }
        - type: conditions
  namespaces:
    from: temporalnamespace
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No Temporal namespaces."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.retention
      trailing: { text: fields.cluster }
      detail:
        - type: keyValues
          items:
            - { label: "Cluster", value: fields.cluster, mono: true }
            - { label: "Retention", value: fields.retention }
            - { label: "Global", value: fields.global }
            - { label: "Owner", value: fields.owner }
            - { label: "Description", value: fields.description }
            - { label: "Created", value: fields.createdAt | relativeTime() }
        - type: relations
          items:
            - { label: "Cluster", ref: fields.clusterObj }
        - type: conditions
  schedules:
    from: temporalschedule
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No Temporal schedules."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.state
      trailing: { text: fields.workflowType }
      detail:
        - type: keyValues
          items:
            - { label: "Temporal namespace", value: fields.temporalNamespace, mono: true }
            - { label: "Workflow", value: fields.workflowType, mono: true }
            - { label: "Task queue", value: fields.taskQueue, mono: true }
            - { label: "Crons", value: fields.crons, mono: true }
            - { label: "Intervals", value: fields.intervals }
            - { label: "Calendars", value: fields.calendars }
            - { label: "Time zone", value: fields.tz }
            - { label: "Remaining actions", value: 'fields.limited ? string(fields.remaining) : ""' }
            - { label: "Notes", value: fields.notes }
            - { label: "Created", value: fields.createdAt | relativeTime() }
        - type: conditions
        - type: actions
          items: [pauseSchedule, unpauseSchedule]
  clients:
    from: temporalclusterclient
    sort: [health desc, $.metadata.namespace, $.metadata.name]
    empty: "No Temporal cluster clients."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: fields.cluster
      detail:
        - type: keyValues
          items:
            - { label: "Cluster", value: fields.cluster, mono: true }
            - { label: "Server name", value: fields.serverName, mono: true }
            - { label: "Certificate Secret", value: fields.secret, mono: true }
            - { label: "Created", value: fields.createdAt | relativeTime() }

# The schedule's own lever: spec.schedule.state.paused, which the operator applies to the
# Temporal schedule.
actions:
  pauseSchedule:
    label: "Pause"
    on: temporalschedule
    verb: mergePatch
    body: { spec: { schedule: { state: { paused: true } } } }
    rbac: { verbs: [patch], group: temporal.io, resource: temporalschedules }
    confirm: plain
    audit: temporal.schedulePause
    enabledWhen: "!fields.paused"
    disabledReason: "already paused"
  unpauseSchedule:
    label: "Unpause"
    on: temporalschedule
    verb: mergePatch
    body: { spec: { schedule: { state: { paused: false } } } }
    rbac: { verbs: [patch], group: temporal.io, resource: temporalschedules }
    confirm: plain
    audit: temporal.scheduleUnpause
    enabledWhen: fields.paused
    disabledReason: "not paused"

findings:
  - id: cluster-not-ready
    from: temporalcluster
    when: health == "critical"
    severity: critical
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: clusters
  - id: cluster-unhealthy
    from: temporalcluster
    when: health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: clusters
  - id: namespace-not-ready
    from: temporalnamespace
    when: health == "critical" || health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: namespaces
  - id: schedule-not-ready
    from: temporalschedule
    when: health == "critical" || health == "warning"
    severity: warning
    title: "{{ namespace }}/{{ name }}"
    detail: "{{ message }}"
    opens: schedules

