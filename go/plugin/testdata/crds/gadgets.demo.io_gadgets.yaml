# Invented: a namespaced kind with status.conditions and a condition-filter printer column.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.gadgets.demo.io
spec:
  group: gadgets.demo.io
  names:
    kind: Gadget
    plural: gadgets
    singular: gadget
    shortNames: [gdg]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - { name: Ready, type: string, jsonPath: '.status.conditions[?(@.type=="Ready")].status' }
        - { name: Endpoint, type: string, jsonPath: .spec.endpoint.host }
        - { name: Last Sync, type: date, jsonPath: .status.lastSyncTime }
        - { name: Age, type: date, jsonPath: .metadata.creationTimestamp }
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: object
                  required: [host]
                  properties:
                    host: { type: string, description: Where the gadget connects. }
                    port: { type: integer, default: 443 }
                interval: { type: string, default: 1m }
            status:
              type: object
              properties:
                lastSyncTime: { type: string, format: date-time }
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [Ready, Synced]
                      status: { type: string }
                      reason: { type: string }
                      message: { type: string }
