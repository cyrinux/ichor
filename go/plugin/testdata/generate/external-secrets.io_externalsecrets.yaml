# yaml-language-server: $schema=../schema/plugin.schema.json
# Draft written by probe plugin-from-crd from externalsecrets.external-secrets.io (v1). Review the health rules, translate the labels (i18n), then move it to go/plugin/builtin/.

schemaVersion: ichor.dev/plugin/v1alpha1
id: external-secrets
name: external-secrets
website: https://external-secrets.io
category: security
detect:
  - group: external-secrets.io
    resource: externalsecrets
resources:
  externalsecret:
    group: external-secrets.io
    version: v1
    resource: externalsecrets
    kind: ExternalSecret
    scope: Namespaced
fields:
  externalsecret:
    # RefreshInterval is the amount of time before the values are read again from the SecretStore provider, specified as Go…
    refreshInterval: '$.spec.refreshInterval | default("1h0m0s")'
    # RefreshPolicy determines how the ExternalSecret should be refreshed: - CreatedOnce: Creates the Secret only if it doe…
    refreshPolicy: $.spec.refreshPolicy
    # Kind of the SecretStore resource (SecretStore or ClusterSecretStore) Defaults to `SecretStore`
    secretStoreRefKind: $.spec.secretStoreRef.kind
    # Name of the SecretStore resource
    secretStoreRefName: $.spec.secretStoreRef.name
    # Kind applies to every window in the list.
    syncWindowsKind: $.spec.syncWindows.kind
    # CreationPolicy defines rules on how to create the resulting Secret.
    targetCreationPolicy: '$.spec.target.creationPolicy | default("Owner")'
    # DeletionPolicy defines rules on how to delete the resulting Secret.
    targetDeletionPolicy: '$.spec.target.deletionPolicy | default("Retain")'
    # Immutable defines if the final secret will be immutable
    targetImmutable: $.spec.target.immutable
    # The name of the Secret resource to be managed.
    targetName: $.spec.target.name
    # refreshTime is the time and date the external secret was fetched and the target secret updated
    refreshTime: $.status.refreshTime
    # SyncedResourceVersion keeps track of the last synced version
    syncedResourceVersion: $.status.syncedResourceVersion
health:
  externalsecret:
    - when: conditions.Ready == false
      health: warning
      reason: ready-false
      message: "Ready is not true"
    - when: conditions.Deleted == false
      health: warning
      reason: deleted-false
      message: "Deleted is not true"
dataServices:
  summary:
    aggregate:
      total: count(externalsecret)
      warnings: 'count(externalsecret, health == "warning")'
      critical: 'count(externalsecret, health == "critical")'
    health: worst(externalsecret.health)
cards:
  summary:
    title:
      count: dataServices.summary.total
      one: "%d ExternalSecret"
      other: "%d ExternalSecrets"
    health: dataServices.summary.health
    badges:
      - label: "warnings"
        value: dataServices.summary.warnings
        tone: warning
        hideWhenZero: true
      - label: "critical"
        value: dataServices.summary.critical
        tone: critical
        hideWhenZero: true
  list:
    from: externalsecret
    sort:
      - health desc
      - $.metadata.namespace
      - $.metadata.name
    empty: "No ExternalSecrets."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: $.spec.secretStoreRef.kind
      trailing:
        text: $.status.refreshTime | relativeTime()
      detail:
        - type: keyValues
          items:
            - label: "StoreType"
              value: $.spec.secretStoreRef.kind
            - label: "Store"
              value: $.spec.secretStoreRef.name
            - label: "Refresh Interval"
              value: $.spec.refreshInterval
            - label: "Status"
              value: 'condition("Ready").status | default("")'
            - label: "Ready"
              value: 'condition("Ready").status | default("")'
        - type: conditions
findings:
  - id: external-secrets-warning
    from: externalsecret
    when: 'health == "warning"'
    severity: warning
    title: "{{ name }}: {{ message }}"
    detail: "{{ namespace }}/{{ name }}: {{ message }}"
    opens: list
# Invented names. The first sample is healthy, the second fails.
# Rules without a sample: warning (conditions.Deleted == false).
samples:
  externalsecret:
    - metadata:
        creationTimestamp: now-4m
        name: demo-one
        namespace: demo-shop
      status:
        conditions:
          - lastTransitionTime: now-4m
            reason: Demo
            status: "True"
            type: Ready
          - lastTransitionTime: now-4m
            reason: Demo
            status: "True"
            type: Deleted
    - metadata:
        creationTimestamp: now-4m
        name: demo-two
        namespace: demo-lab
      status:
        conditions:
          - lastTransitionTime: now-4m
            reason: Demo
            status: "False"
            type: Ready
          - lastTransitionTime: now-4m
            reason: Demo
            status: "True"
            type: Deleted
