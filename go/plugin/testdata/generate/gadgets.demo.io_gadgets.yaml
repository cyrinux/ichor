# yaml-language-server: $schema=../schema/plugin.schema.json
# Draft written by probe plugin-from-crd from gadgets.gadgets.demo.io (v1alpha1). Review the health rules, translate the labels (i18n), then move it to go/plugin/builtin/.

schemaVersion: ichor.dev/plugin/v1alpha1
id: gadgets
name: gadgets
category: data-services
detect:
  - group: gadgets.demo.io
    resource: gadgets
resources:
  gadget:
    group: gadgets.demo.io
    version: v1alpha1
    resource: gadgets
    kind: Gadget
    scope: Namespaced
fields:
  gadget:
    # Where the gadget connects.
    endpointHost: $.spec.endpoint.host
    endpointPort: $.spec.endpoint.port | default(443)
    interval: '$.spec.interval | default("1m")'
    lastSyncTime: $.status.lastSyncTime
health:
  gadget:
    - when: conditions.Ready == false
      health: warning
      reason: ready-false
      message: "Ready is not true"
    - when: conditions.Synced == false
      health: warning
      reason: synced-false
      message: "Synced is not true"
dataServices:
  summary:
    aggregate:
      total: count(gadget)
      warnings: 'count(gadget, health == "warning")'
      critical: 'count(gadget, health == "critical")'
    health: worst(gadget.health)
cards:
  summary:
    title:
      count: dataServices.summary.total
      one: "%d Gadget"
      other: "%d Gadgets"
    health: dataServices.summary.health
    badges:
      - label: "warnings"
        value: dataServices.summary.warnings
        tone: warning
        hideWhenZero: true
      - label: "critical"
        value: dataServices.summary.critical
        tone: critical
        hideWhenZero: true
  list:
    from: gadget
    sort:
      - health desc
      - $.metadata.namespace
      - $.metadata.name
    empty: "No Gadgets."
    row:
      title: $.metadata.name
      subtitle: $.metadata.namespace
      status:
        tone: health
        text: 'condition("Ready").status | default("")'
      trailing:
        text: $.status.lastSyncTime | relativeTime()
      detail:
        - type: keyValues
          items:
            - label: "Ready"
              value: 'condition("Ready").status | default("")'
            - label: "Endpoint"
              value: $.spec.endpoint.host
            - label: "Age"
              value: $.metadata.creationTimestamp | relativeTime()
        - type: conditions
findings:
  - id: gadgets-warning
    from: gadget
    when: 'health == "warning"'
    severity: warning
    title: "{{ name }}: {{ message }}"
    detail: "{{ namespace }}/{{ name }}: {{ message }}"
    opens: list
# Invented names. The first sample is healthy, the second fails.
# Rules without a sample: warning (conditions.Synced == false).
samples:
  gadget:
    - metadata:
        creationTimestamp: now-4m
        name: demo-one
        namespace: demo-shop
      spec:
        endpoint:
          host: demo-host
      status:
        conditions:
          - lastTransitionTime: now-4m
            reason: Demo
            status: "True"
            type: Ready
          - lastTransitionTime: now-4m
            reason: Demo
            status: "True"
            type: Synced
    - metadata:
        creationTimestamp: now-4m
        name: demo-two
        namespace: demo-lab
      spec:
        endpoint:
          host: demo-host
      status:
        conditions:
          - lastTransitionTime: now-4m
            reason: Demo
            status: "False"
            type: Ready
          - lastTransitionTime: now-4m
            reason: Demo
            status: "True"
            type: Synced
