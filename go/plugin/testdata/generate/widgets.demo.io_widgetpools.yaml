# yaml-language-server: $schema=../schema/plugin.schema.json
# Draft written by probe plugin-from-crd from widgetpools.widgets.demo.io (v1). Review the health rules, translate the labels (i18n), then move it to go/plugin/builtin/.

schemaVersion: ichor.dev/plugin/v1alpha1
id: widgets
name: Widgets
category: data-services
detect:
  - group: widgets.demo.io
    resource: widgetpools
resources:
  widgetpool:
    group: widgets.demo.io
    version: v1
    resource: widgetpools
    kind: WidgetPool
    scope: Cluster
fields:
  widgetpool:
    paused: $.spec.paused | default(false)
    # How many widgets the pool keeps running.
    replicas: $.spec.replicas | default(2)
    # The size of each widget.
    size: $.spec.size
    # The widgets' color.
    templateColor: $.spec.template.color
    phase: $.status.phase
    readyReplicas: $.status.readyReplicas
    statusReplicas: $.status.replicas
health:
  widgetpool:
    - when: 'fields.phase == "Failed" || fields.phase == "Degraded"'
      health: critical
      reason: phase-failed
      message: "phase {{ fields.phase }}"
    - when: 'fields.phase == "Pending"'
      health: info
      reason: phase-pending
      message: "phase {{ fields.phase }}"
    - when: 'fields.phase == "Running"'
      health: ok
      reason: phase-ok
      message: "phase {{ fields.phase }}"
dataServices:
  summary:
    aggregate:
      total: count(widgetpool)
      warnings: 'count(widgetpool, health == "warning")'
      critical: 'count(widgetpool, health == "critical")'
    health: worst(widgetpool.health)
cards:
  summary:
    title:
      count: dataServices.summary.total
      one: "%d WidgetPool"
      other: "%d WidgetPools"
    health: dataServices.summary.health
    badges:
      - label: "warnings"
        value: dataServices.summary.warnings
        tone: warning
        hideWhenZero: true
      - label: "critical"
        value: dataServices.summary.critical
        tone: critical
        hideWhenZero: true
  list:
    from: widgetpool
    sort:
      - health desc
      - $.metadata.name
    empty: "No WidgetPools."
    row:
      title: $.metadata.name
      status:
        tone: health
        text: $.status.phase
      trailing:
        text: $.metadata.creationTimestamp | relativeTime()
      detail:
        - type: keyValues
          items:
            - label: "Phase"
              value: $.status.phase
            - label: "Replicas"
              value: $.spec.replicas
            - label: "Ready"
              value: $.status.readyReplicas
actions:
  scale:
    label: "Scale"
    on: widgetpool
    verb: subresource
    subresource: scale
    method: PATCH
    body:
      spec:
        replicas: "{{ params.replicas }}"
    rbac:
      verbs:
        - patch
      group: widgets.demo.io
      resource: widgetpools/scale
    confirm: plain
    audit: widgets.scale
    params:
      - name: replicas
        label: "Replicas"
        type: int
        default: 1
findings:
  - id: widgets-critical
    from: widgetpool
    when: 'health == "critical"'
    severity: critical
    title: "{{ name }}: {{ message }}"
    detail: "{{ name }}: {{ message }}"
    opens: list
# Invented names. The first sample is healthy, the second fails.
# Rules without a sample: info (fields.phase == "Pending").
samples:
  widgetpool:
    - metadata:
        creationTimestamp: now-4m
        name: demo-one
      spec:
        replicas: 1
        size: small
      status:
        phase: Running
    - metadata:
        creationTimestamp: now-4m
        name: demo-two
      spec:
        replicas: 1
        size: small
      status:
        phase: Failed
