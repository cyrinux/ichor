# The relay runs alone in its namespace: its Role, its Secret and its NetworkPolicy stay scoped
# to it. It passes the restricted Pod Security profile (Talos enforces baseline by default on
# non-system namespaces), so the namespace enforces restricted.
apiVersion: v1
kind: Namespace
metadata:
  name: ichor-relay
  labels:
    app.kubernetes.io/name: ichor-relay
    app.kubernetes.io/part-of: ichor
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
