# XcodeGen spec: `xcodegen generate` (scripts/ios-build.sh does it) creates Ichor.xcodeproj.
name: Ichor
options:
  bundleIdPrefix: name.levis
  # English is the development language; the other regions (fr, es, uk, de, it) come from the
  # *.lproj folders (InfoPlist.strings) and the String Catalogs (Localizable.xcstrings).
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    # The Apple Watch app and its complication (single-target watch app: watchOS 10).
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is optional: CI builds unsigned (CODE_SIGNING_ALLOWED=NO); set ICHOR_IOS_TEAM_ID to sign.
    DEVELOPMENT_TEAM: ${ICHOR_IOS_TEAM_ID}
packages:
  IchorCore:
    path: IchorCore
  # Terminal emulator for the debug shell (MIT). Pinned: 1.99.0 dropped TerminalView.getTerminal().
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.20.0
  # Security keys (YubiKey…) over NFC, Lightning and USB-C for the app lock: Yubico's Swift SDK
  # talks CTAP2 to the key itself (Apache-2.0).
  YubiKit:
    url: https://github.com/Yubico/yubikit-swift
    from: 1.4.0
targets:
  Ichor:
    type: application
    platform: iOS
    sources:
      - Ichor
      # Compiled into the app and the widget: the Live Activity's buttons (OperationIntent)
      # run in the app's process, and both must know the intent type.
      - Shared
      # The app-inventory icons, shared with Android (scripts/sync-app-icons.py): a folder
      # reference, so they land in the bundle under appicons/.
      - path: ../app/src/main/assets/appicons
        type: folder
        buildPhase: resources
    # Explicit shared scheme, so CI never depends on xcodebuild's autogenerated one.
    scheme: {}
    dependencies:
      - package: IchorCore
      - package: SwiftTerm
      - package: YubiKit
      # Built by gomobile (scripts/ios-build.sh); a static framework, so it is linked, not embedded.
      - framework: Frameworks/Ichorgo.xcframework
        embed: false
      - target: TalosWidget
      # Not embedded yet (IchorWatch below): the App Store path for a watch app (its bundle IDs'
      # profiles, watch screenshots) is unverified. Embedding it is `- target: IchorWatch` here
      # (XcodeGen puts a watchOS app dependency in "Embed Watch Content", Ichor.app/Watch).
      # The Apple Watch's data (WatchLink): harmless without the watch app.
      - sdk: WatchConnectivity.framework
      # "Open in Ichor" (Ichor/Intents): the app's AppShortcutsProvider, listed in the Shortcuts app.
      - sdk: AppIntents.framework
    # GOOGLE_IOS_CLIENT_ID and GOOGLE_IOS_REVERSED_CLIENT_ID (GKE's Sign in with Google): empty
    # unless a git-ignored Config/GoogleSignIn.local.xcconfig sets them.
    configFiles:
      Debug: Config/GoogleSignIn.xcconfig
      Release: Config/GoogleSignIn.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: name.levis.ichor
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Go runtime's resolver needs libresolv.
        OTHER_LDFLAGS: [-lresolv]
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Ichor/Ichor.entitlements
      properties:
        com.apple.security.application-groups: [group.name.levis.ichor]
        # Security keys: NFC tag reading, and USB-C smart cards (iOS 16+).
        com.apple.developer.nfc.readersession.formats: [TAG]
        com.apple.security.smartcard: true
    info:
      path: Ichor/Info.plist
      properties:
        CFBundleDisplayName: Ichor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declaring the localizations lets iOS offer a per-app language in the Settings app.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es, uk, de, it]
        UILaunchScreen: {}
        # Share links (ichor://open?…, see ShareLinks.swift); the scene delegate receives them.
        CFBundleURLTypes:
          - CFBundleURLName: name.levis.ichor
            CFBundleURLSchemes: [ichor]
          # GKE's Sign in with Google: Google's iOS client redirects to its reversed client ID
          # (Config/GoogleSignIn.xcconfig); empty, and unused, in a build without a client.
          - CFBundleURLName: name.levis.ichor.google
            CFBundleURLSchemes: [$(GOOGLE_IOS_REVERSED_CLIENT_ID)]
        # The client ID the app hands the Go core at start ("" when the build has none).
        GoogleSignInClientID: $(GOOGLE_IOS_CLIENT_ID)
        # One scene; its delegate (QuickActions.swift) receives the Home Screen quick actions.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        # The Go core brings its own TLS and age encryption (standard algorithms, not the OS's):
        # not exempt from the export documentation. See fastlane/APP_STORE_CONNECT.md.
        ITSAppUsesNonExemptEncryption: true
        NSCameraUsageDescription: Scan a talosconfig QR code to import it.
        NSFaceIDUsageDescription: Unlock Ichor and confirm reboot or shutdown.
        # Security keys (YubiKey…) tapped on the phone: the FIDO applet over NFC, and the 5Ci over Lightning.
        NFCReaderUsageDescription: Read your security key to unlock Ichor.
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [A0000006472F0001]
        UISupportedExternalAccessoryProtocols: [com.yubico.ylp]
        # Reaching nodes on the Wi-Fi network, searching it for them, and Wake-on-LAN.
        NSLocalNetworkUsageDescription: Reach your clusters' nodes on this network, search it for them, and wake them with Wake-on-LAN.
        UIBackgroundModes: [fetch]
        # A run the app follows (upgrade, maintenance, config try…) shows as a Live Activity,
        # updated while the app runs (no push updates).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        BGTaskSchedulerPermittedIdentifiers: [name.levis.ichor.refresh]
        # "Open with", the share sheet and AirDrop: YAML files (talosconfigs, kubeconfigs) and
        # *.kubeconfig land in the import preview (IncomingConfig.swift). A copy, not in place.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Talos or Kubernetes config
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.yaml, name.levis.ichor.kubeconfig]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: name.levis.ichor.kubeconfig
            UTTypeDescription: Kubernetes config
            UTTypeConformsTo: [public.yaml]
            UTTypeTagSpecification:
              public.filename-extension: [kubeconfig]
        LSSupportsOpeningDocumentsInPlace: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # Home-screen widget; reads the last snapshot from the shared App Group.
  TalosWidget:
    type: app-extension
    platform: iOS
    sources: [TalosWidget, Shared]
    dependencies:
      - package: IchorCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      # The runs' Live Activity and its buttons.
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: name.levis.ichor.widget
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: TalosWidget/TalosWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.name.levis.ichor]
    info:
      path: TalosWidget/Info.plist
      properties:
        CFBundleDisplayName: Ichor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es, uk, de, it]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Apple Watch app (CYR-339), read-only: the clusters and nodes of the iPhone's last background
  # check, sent over WatchConnectivity (Ichor/Services/WatchLink.swift); no config on the watch.
  # A single-target watch app (watchOS 10, WKApplication). Built by CI on its own scheme
  # (scripts/ios-build.sh watch), with its complication; not in the IPA yet.
  IchorWatch:
    type: application
    platform: watchOS
    sources: [IchorWatch, WatchShared]
    scheme: {}
    dependencies:
      - package: IchorCore
      - target: IchorWatchWidget
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: name.levis.ichor.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
        # Once embedded: inside Ichor.app, not a product of its own in an archive.
        SKIP_INSTALL: YES
    entitlements:
      path: IchorWatch/IchorWatch.entitlements
      properties:
        # The watch's own App Group (not the phone's): where the app leaves the last payload for
        # its complication.
        com.apple.security.application-groups: [group.name.levis.ichor]
    info:
      path: IchorWatch/Info.plist
      properties:
        CFBundleDisplayName: Ichor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es, uk, de, it]
        WKApplication: true
        WKCompanionAppBundleIdentifier: name.levis.ichor
        # It only shows what the iPhone sends.
        WKRunsIndependentlyOfCompanionApp: false

  # The watch face complication (accessory families), reading the watch app's App Group.
  IchorWatchWidget:
    type: app-extension
    platform: watchOS
    sources: [IchorWatchWidget, WatchShared]
    dependencies:
      - package: IchorCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: name.levis.ichor.watchkitapp.widget
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: IchorWatchWidget/IchorWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.name.levis.ichor]
    info:
      path: IchorWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Ichor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr, es, uk, de, it]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
