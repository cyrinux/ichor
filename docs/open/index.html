<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Ichor</title>
<!-- A share link from the app: https://cyrinux.github.io/ichor/open/#v=1&c=…&t=…
     Everything after # stays in the browser (never sent to the server); this page only hands
     it to the app as ichor://open?…, which checks it. No third-party request, no tracking. -->
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../brand/ichor.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #E9EEF2;
    --surface: #F6F8FA;
    --ink: #14243B;
    --ink-2: #51627A;
    --line: #C9D3DD;
    --accent: #FF7A45;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101823;
      --surface: #16212F;
      --ink: #E4EAF1;
      --ink-2: #9AABC0;
      --line: #2A3A4E;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font: 400 1.0625rem/1.6 system-ui, sans-serif;
  }
  main {
    max-width: 30rem;
    margin: 1.5rem;
    padding: 2rem 1.75rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    text-align: center;
  }
  img { width: 56px; height: 56px; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: .75rem 0 .25rem; }
  p { color: var(--ink-2); margin: .5rem 0; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .open {
    display: inline-block;
    margin: 1.25rem 0 .75rem;
    padding: .7rem 1.4rem;
    border-radius: 999px;
    background: var(--accent);
    color: #14243B;
    font-weight: 600;
    text-decoration: none;
  }
  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <img src="../brand/ichor.svg" alt="">
  <h1>Open in Ichor</h1>
  <div id="link">
    <p>Someone shared a screen of a Talos cluster. It opens in Ichor on a phone holding a
      talosconfig for the same cluster.</p>
    <a class="open" id="open" href="../">Open in Ichor</a>
  </div>
  <p id="invalid" hidden>This link is incomplete: ask for it again.</p>
  <p>No Ichor yet? <a href="../">Get the app</a>, free and open source.</p>
</main>
<script>
  // The app checks every value again (ParseShareLink); this only refuses what cannot be a link.
  (function () {
    var params = location.hash.slice(1);
    var valid = /^[A-Za-z0-9._~%&=+-]*$/.test(params) && /(^|&)v=1(&|$)/.test(params);
    if (!valid || params.length > 2048) {
      document.getElementById("link").hidden = true;
      document.getElementById("invalid").hidden = false;
      return;
    }
    var app = "ichor://open?" + params;
    document.getElementById("open").href = app;
    location.replace(app);
  })();
</script>
</body>
</html>
