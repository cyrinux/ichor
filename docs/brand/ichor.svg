  <path d="M256,64 C288,64 308,88 308,120 L308,158 L290,182 L274,182 L274,138 L256,128 Z" fill="url(#bronzeR)"/>
  <path d="M208,100 L256,114 L304,100 L300,128 L278,138 L268,138 L268,190 L244,190 L244,138 L234,138 L212,128 Z" fill="#141518"/>
