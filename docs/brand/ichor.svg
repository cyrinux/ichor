    <path d="M72,338 Q88,398 142,436 L150,418 Q108,386 88,332 Z"/>
    <path d="M444,234 Q458,282 444,326 L429,314 Q438,282 429,240 Z"/>
    <path d="M440,338 Q424,398 370,436 L362,418 Q404,386 424,332 Z"/>
