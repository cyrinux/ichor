    <path stroke-opacity="0.14" stroke-width="24" d="M222,110 L256,121 L290,110 M256,121 L256,364 M256,292 C218,292 166,298 146,326 M256,292 C294,292 346,298 366,326"/>
    <path stroke-opacity="0.3" stroke-width="13" d="M222,110 L256,121 L290,110 M256,121 L256,364 M256,292 C218,292 166,298 146,326 M256,292 C294,292 346,298 366,326"/>
