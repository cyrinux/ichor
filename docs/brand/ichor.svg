  <circle cx="256" cy="256" r="34" fill="#FFA914" fill-opacity="0.16"/>
  <circle cx="256" cy="256" r="27" fill="#FFA914" fill-opacity="0.3"/>
  <circle cx="256" cy="256" r="21" fill="url(#bronzeR)" stroke="#0E0F11" stroke-width="3"/>
  <circle cx="256" cy="256" r="15" fill="url(#core)"/>
