  <path d="M282,192 C326,192 380,202 408,234 C422,250 426,272 424,304 L404,304 C406,282 402,266 391,254 C366,228 322,214 276,212 Z" fill="url(#bronzeR)" stroke="#0E0F11" stroke-width="3"/>
