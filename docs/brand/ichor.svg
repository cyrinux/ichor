<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Ichor</title>
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="256" y1="40" x2="256" y2="500">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="0.55" stop-color="#E29A2B"/>
      <stop offset="1" stop-color="#A9661C"/>
    </linearGradient>
    <linearGradient id="bronzeL" gradientUnits="userSpaceOnUse" x1="150" y1="60" x2="300" y2="300">
      <stop offset="0" stop-color="#E9B266"/>
      <stop offset="1" stop-color="#B27A3A"/>
    </linearGradient>
    <linearGradient id="bronzeR" gradientUnits="userSpaceOnUse" x1="256" y1="60" x2="380" y2="300">
      <stop offset="0" stop-color="#B98243"/>
      <stop offset="1" stop-color="#7E5225"/>
    </linearGradient>
    <linearGradient id="armor" gradientUnits="userSpaceOnUse" x1="256" y1="180" x2="256" y2="340">
