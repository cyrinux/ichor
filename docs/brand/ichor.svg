    <path d="M308,326 L366,304 L422,326 L364,348 Z" fill="#3C3E42"/>
    <path d="M308,326 L364,348 L364,416 L308,394 Z" fill="#28292C"/>
    <path d="M364,348 L422,326 L422,394 L364,416 Z" fill="#1B1C1F"/>

