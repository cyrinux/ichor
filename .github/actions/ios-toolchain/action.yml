name: iOS toolchain
description: >
  Go with its module and build caches, the Swift package checkouts and XcodeGen. The Go cache
  is keyed on the sources (go.sum and OS prefixes as fallbacks) and only written by the test
  job on main, through its own save step, so both iOS jobs read the same cache.

outputs:
  go-cache-key:
    description: Primary key of the Go module and build cache, for actions/cache/save.
    value: ${{ steps.go.outputs.cache-primary-key }}
  go-cache-hit:
    description: Whether the Go cache hit its primary key (nothing to save then).
    value: ${{ steps.go.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # setup-go's own cache is keyed on go.sum alone, so its build cache goes stale as the
    # sources change; the restore below keys on the sources instead.
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go/go.mod
        cache: false

    - id: go
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/Library/Caches/go-build
        key: go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}-${{ hashFiles('go/**/*.go') }}
        restore-keys: |
          go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}-
          go-${{ runner.os }}-

    # Swift package checkouts (SwiftTerm, YubiKit), cloned by -resolvePackageDependencies
    # into the derived data path of scripts/ios-build.sh.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ios/build/SourcePackages
        key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
        restore-keys: spm-${{ runner.os }}-

    - name: Install XcodeGen
      shell: bash
      run: brew install xcodegen
