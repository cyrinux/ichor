name: Android toolchain
description: >
  The Nix dev shell (JDK, Gradle, Go, Android SDK and NDK) with the Nix store, Gradle user home
  and Go caches restored from the Actions cache. Caches are written on main only, so pull
  requests read main's caches and the cache does not fill with one entry per push: the Nix
  store by the check job (`save`), the Go cache by its own save step, the Gradle home by every
  job.

inputs:
  save:
    description: Save the Nix store cache when its key missed, on main (the check job only).
    default: "false"

outputs:
  go-cache-key:
    description: Primary key of the Go module and build cache, for actions/cache/save.
    value: ${{ steps.go.outputs.cache-primary-key }}
  go-cache-hit:
    description: Whether the Go cache hit its primary key (nothing to save then).
    value: ${{ steps.go.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

    # /nix/store, keyed on the flake: without it every job downloads the Android SDK and NDK
    # zips from Google and unpacks them (the androidsdk derivation is not in cache.nixos.org).
    # No prefix fallback on purpose: the action merges a restored store into the fresh one, so
    # restoring the previous flake's closure and saving both would grow the entry at every
    # flake.lock bump. A bump costs one cold run on main instead.
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        save: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}

    # GRADLE_USER_HOME: dependencies and the local build cache (org.gradle.caching in
    # gradle.properties). Each job writes its own entry on main (the artifacts themselves are
    # deduplicated across jobs by the action), read-only on pull requests and tags.
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    # Go modules and build cache (GOMODCACHE and GOCACHE defaults of the Nix shell): a warm
    # cache turns `gomobile bind` from two minutes into twenty seconds. Keyed on the sources
    # with go.sum and OS prefixes as fallbacks, so the closest cache is restored.
    - id: go
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}-${{ hashFiles('go/**/*.go') }}
        restore-keys: |
          go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}-
          go-${{ runner.os }}-
