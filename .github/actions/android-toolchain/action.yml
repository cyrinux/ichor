name: Android toolchain
description: >
  The Nix dev shell (JDK, Gradle, Go, Android SDK and NDK) with the Nix store, Gradle user home
  and Go caches restored from the Actions cache. Caches are written on main only, so pull
  requests read main's caches and the cache does not fill with one entry per push: the Nix
  store by the check job (`save`), the Go cache by its own save step, the Gradle home by every
  job.

# Cache budget: GitHub keeps 10 GB of Actions cache per repository and evicts the least
# recently used entries beyond it, so pull requests then miss caches at random (`gh cache
# list` shows what is there). Cached: the Nix store (one nix-Linux-* entry, trimmed by GC and
# its predecessor purged when the check job saves it), the Go caches (one go-Linux-* and one
# go-macOS-*, the replaced entry deleted by .github/actions/cache-prune), the Gradle home
# (setup-gradle's own entries, per job) and the Swift packages (spm-macOS-*). Saves happen on
# main only; pull requests and tags read main's entries.

inputs:
  save:
    description: Save the Nix store cache when its key missed, on main (the check job only).
    default: "false"

outputs:
  go-cache-key:
    description: Primary key of the Go module and build cache, for actions/cache/save.
    value: ${{ steps.go.outputs.cache-primary-key }}
  go-cache-hit:
    description: Whether the Go cache hit its primary key (nothing to save then).
    value: ${{ steps.go.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

    # /nix/store, keyed on the flake: without it every job downloads the Android SDK and NDK
    # zips from Google and unpacks them (the androidsdk derivation is not in cache.nixos.org).
    # A flake.lock bump restores the previous store (prefix fallback) and builds only what
    # changed. When it saves (check job, main, key missed), the action first garbage-collects
    # the store down to gc-max-store-size-linux, then deletes the other nix-Linux-* entries
    # (purge-*; the one it just saved is kept). GC only removes unreachable paths: the next step
    # makes the dev shell a GC root, so what goes is the previous flake's closure and build-time
    # leftovers (SDK zips, build inputs), never the toolchain; a store still bigger than the cap
    # is saved as it is. Bump the v2 to force a trimmed re-save without a flake change.
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-v2-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
        save: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
        gc-max-store-size-linux: 2500M
        purge: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
        purge-prefixes: nix-${{ runner.os }}-
        purge-created: 0
        purge-primary-key: never

    # The dev shell build.sh enters (`nix develop`), registered as a GC root for the GC above.
    - if: inputs.save == 'true' && github.ref == 'refs/heads/main'
      shell: bash
      run: nix develop --profile "$RUNNER_TEMP/ichor-dev-shell" --command true

    # GRADLE_USER_HOME: dependencies and the local build cache (org.gradle.caching in
    # gradle.properties). Each job writes its own entry on main (the artifacts themselves are
    # deduplicated across jobs by the action), read-only on pull requests and tags.
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    # Go modules and build cache (GOMODCACHE and GOCACHE defaults of the Nix shell): a warm
    # cache turns `gomobile bind` from two minutes into twenty seconds. Keyed on go.sum, so it is
    # saved once per dependency change: keyed on the sources, every main push restored the
    # previous build cache, added its own builds and saved the lot (go-Linux grew to 3 GB in two
    # days). The build cache goes slowly colder between go.sum changes; the module cache never.
    - id: go
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ hashFiles('go/go.sum') }}
        restore-keys: go-${{ runner.os }}-
