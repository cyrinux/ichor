name: Plugin request from a CRD
description: Give a public CRD manifest link; a draft plugin pull request is opened from it
title: "Plugin request: "
labels: ["crd-request", "integration"]
# The field ids are the query parameters that prefill the form (the site's "Ask for a plugin"
# form builds that URL), and the labels are the body's headings the generator workflow reads
# ("### CRD manifest URL"): keep both.
body:
  - type: markdown
    attributes:
      value: |
        Search the [open requests](https://github.com/cyrinux/ichor/issues?q=is%3Aissue+label%3Acrd-request) first: a 👍 on an existing one counts as much as a new issue.
        What happens next: a workflow fetches the CRD, writes a draft plugin, opens a pull request and comments here with its link. A maintainer then reviews it, translates it and adds it to the app.
        The link must be public and carry nothing private.
  - type: input
    id: crd_url
    attributes:
      label: CRD manifest URL
      description: >-
        A public link on raw.githubusercontent.com, github.com (a `blob` link is fine), gitlab.com
        or codeberg.org: one CRD or a file of several, YAML or JSON, 4 MiB at most.
      placeholder: https://raw.githubusercontent.com/<org>/<repo>/main/config/crd/bases/<group>_<plural>.yaml
    validations:
      required: true
  - type: input
    id: operator
    attributes:
      label: Operator
      description: The project name or its API domain (kube-green, external-secrets.io…).
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Documentation link
      description: The operator's documentation, if it helps to read the CRD.
  - type: textarea
    id: notes
    attributes:
      label: What should the app show?
      description: Which condition means healthy, which field matters, an action users need.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: The CRD is public and its link carries nothing private (no cluster, account or company name)
          required: true
