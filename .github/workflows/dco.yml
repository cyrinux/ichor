name: DCO

# Every commit of an outside contribution must carry a Signed-off-by line matching its
# author (see CONTRIBUTING.md). The maintainer's and bots' pull requests are skipped.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    if: github.event.pull_request.user.login != 'cyrinux' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha"): no 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off your commits with 'git rebase --signoff origin/main' and force-push (see CONTRIBUTING.md)."
            exit 1
          fi
