name: Auto-release

# Every day, tags a release when main has user-facing commits since the last tag, the way
# `just release-tag auto` does by hand: the version is bumped from the conventional commits
# (scripts/next-version.py: breaking -> major, feat -> minor, fix/perf -> patch), the tag is
# annotated with the changelog, and Google Play's notes are committed as with --yes. chore,
# ci, docs, test and refactor commits alone release nothing. Only a commit whose Android and
# iOS builds passed is tagged; otherwise the next run tries again.
#
# The rulesets keep GITHUB_TOKEN off main and v* tags, so the notes commit and the tag are
# pushed with a deploy key allowed past them (`just auto-release-setup`); a tag pushed that
# way starts release.yml, which builds and publishes it.
on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  # Run by hand, e.g. from the GitHub mobile app (repo > Actions > Auto-release > Run workflow):
  # `bump` forces a release of that size even with only chore/docs/... commits since the tag.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Only print the version that would be tagged
        type: boolean
        default: false

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: auto-release # RELEASE_DEPLOY_KEY, main only
    permissions:
      contents: read # pushes go through the deploy key
      actions: read # CI runs of the commit
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
    steps:
      - name: Check the deploy key
        if: env.DEPLOY_KEY == ''
        run: echo "::notice::RELEASE_DEPLOY_KEY is not set (just auto-release-setup); only a dry run is possible."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # tags and history to bump from
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }} # empty: HTTPS with GITHUB_TOKEN, read only
          # Neither the key nor the token stays in .git/config; the push step below sets the
          # key up for itself.
          persist-credentials: false

      - name: Next version
        id: next
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          args=(--json)
          [[ "$BUMP" == auto ]] || args+=(--bump "$BUMP")
          result="$(scripts/next-version.py "${args[@]}")"
          echo "$result"
          next="$(jq -r '.next // empty' <<<"$result")"
          if [[ -z "$next" ]]; then
            echo "::notice::Nothing to release since v$(jq -r .current <<<"$result") (bump: $BUMP)."
          fi
          echo "version=$next" >>"$GITHUB_OUTPUT"

      # The commit's own CI must be green: the tag ships what android.yml and ios.yml built.
      - name: Check CI on the commit
        id: ci
        if: steps.next.outputs.version != ''
        run: |
          sha="$(git rev-parse HEAD)"
          ok=true
          for workflow in android.yml ios.yml; do
            conclusion="$(gh run list --workflow "$workflow" --commit "$sha" --event push --limit 1 \
              --json conclusion --jq '.[0].conclusion // "missing"')"
            echo "$workflow on ${sha:0:12}: ${conclusion:-in progress}"
            [[ "$conclusion" == success ]] || ok=false
          done
          if [[ "$ok" != true ]]; then
            echo "::warning::CI has not passed on ${sha:0:12} yet; not releasing today."
          fi
          echo "ok=$ok" >>"$GITHUB_OUTPUT"

      # From the Ubuntu archive rather than a third-party action, as this job holds the key.
      - name: Install just
        if: steps.ci.outputs.ok == 'true' && !inputs.dry_run && env.DEPLOY_KEY != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q just

      # --yes commits the drafted Play notes ("docs: Google Play release notes for vX.Y.Z")
      # and the tag goes on that commit, as `just release-tag X --yes` does by hand. The checks
      # already ran in CI, hence ICHOR_RELEASE_SKIP_GATE. --atomic: if main moved since the
      # checkout, neither the commit nor the tag lands, and the next run retries.
      - name: Commit the Play notes, tag and push
        if: steps.ci.outputs.ok == 'true' && !inputs.dry_run && env.DEPLOY_KEY != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
          ICHOR_RELEASE_SKIP_GATE: "1"
        run: |
          # The deploy key for `git fetch` in release-tag and the push, and GitHub's host
          # keys from its API (over TLS) rather than trusting whatever answers on port 22.
          key="$RUNNER_TEMP/deploy_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o StrictHostKeyChecking=yes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          just release-tag "$VERSION" --yes --unsigned
          git push --atomic origin HEAD:main "v$VERSION"
          echo "::notice::Tagged v$VERSION; release.yml builds and publishes it."
