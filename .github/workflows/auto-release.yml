name: Auto-release

# Every day, tags a release when main has user-facing commits since the last tag, the way
# `just release-tag auto` does by hand: the version is bumped from the conventional commits
# (scripts/next-version.py: breaking -> major, feat -> minor, fix/perf -> patch), the tag is
# annotated with the changelog, then release.yml builds and publishes it. chore, ci, docs,
# test and refactor commits alone release nothing. Only a commit whose Android and iOS
# builds passed is tagged; otherwise the next run tries again. Google Play's notes are
# generated by release.yml, as for a tag pushed without them.
on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only print the version that would be tagged
        type: boolean
        default: false

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # push the tag
      actions: write # start release.yml on it
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history to bump from

      - name: Next version
        id: next
        run: |
          result="$(scripts/next-version.py --json)"
          echo "$result"
          next="$(jq -r '.next // empty' <<<"$result")"
          if [[ -z "$next" ]]; then
            echo "::notice::No feat, fix, perf or breaking commit since v$(jq -r .current <<<"$result"): nothing to release."
          fi
          echo "version=$next" >>"$GITHUB_OUTPUT"

      # The commit's own CI must be green: the tag ships what android.yml and ios.yml built.
      - name: Check CI on the commit
        id: ci
        if: steps.next.outputs.version != ''
        run: |
          sha="$(git rev-parse HEAD)"
          ok=true
          for workflow in android.yml ios.yml; do
            conclusion="$(gh run list --workflow "$workflow" --commit "$sha" --event push --limit 1 \
              --json conclusion --jq '.[0].conclusion // "missing"')"
            echo "$workflow on ${sha:0:12}: ${conclusion:-in progress}"
            [[ "$conclusion" == success ]] || ok=false
          done
          if [[ "$ok" != true ]]; then
            echo "::warning::CI has not passed on ${sha:0:12} yet; not releasing today."
          fi
          echo "ok=$ok" >>"$GITHUB_OUTPUT"

      - uses: extractions/setup-just@v3
        if: steps.ci.outputs.ok == 'true' && !inputs.dry_run

      # No terminal and no --yes: release-tag commits no Play notes, so the tag stays on
      # main's commit. The checks already ran in CI, hence ICHOR_RELEASE_SKIP_GATE.
      - name: Tag and start the release
        if: steps.ci.outputs.ok == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.next.outputs.version }}
          ICHOR_RELEASE_SKIP_GATE: "1"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          just release-tag "$VERSION" --unsigned
          git push origin "v$VERSION"
          gh workflow run release.yml --ref "v$VERSION"
          echo "::notice::Tagged v$VERSION and started the release."
