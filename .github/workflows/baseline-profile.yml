name: Baseline profile

# Regenerates the Android app's baseline profile (:baselineprofile, BaselineProfileGenerator) on
# an emulator: a cold start into the offline demo, a node, its kernel log. Run by hand after a
# big navigation or start-up change (CONTRIBUTING.md "Baseline profile"); it opens no pull
# request: the profile comes back as the `baseline-profile` artifact. Unzip it into
# app/src/main/generated/baselineProfiles/ and commit baseline-prof.txt.
# Pull requests only compile the generator (android.yml's ui-smoke, `./build.sh smoke`).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate the baseline profile (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/version.sh derives the version from tags and history
          persist-credentials: false

      # Reads the caches, never writes one: the cache is near its 10 GB quota.
      - uses: ./.github/actions/android-toolchain
        with:
          gradle-read-only: "true"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34, the plain AOSP image (aosp_atd leaves out parts of the system the walk goes
      # through, the launcher among them). Gradle builds the app and the generator, installs
      # them on the emulator and writes the profile into src/main.
      - name: Generate the profile on an emulator
        env:
          ICHOR_SKIP_TESTS: "1"
          ICHOR_LOCAL_MODEL: "0"
          EMULATOR_TARGET: default
        run: scripts/ci-emulator.sh ./build.sh baseline

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles/baseline-prof.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: baseline-profile-report
          path: |
            baselineprofile/build/outputs/androidTest-results/
            baselineprofile/build/reports/androidTests/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
