name: Android

on:
  # Website-only changes (pages.yml's paths) build nothing here.
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-i18n/**", "scripts/site-i18n.py", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["docs/**", "docs-i18n/**", "scripts/site-i18n.py", ".github/workflows/pages.yml"]
  # Tags: release.yml calls this, then publishes the release once with all files.
  # Artifacts are only uploaded then (github.ref is the caller's tag); pushes and PRs
  # just build.
  workflow_call:
    secrets:
      ICHOR_KEYSTORE_BASE64:
        required: false
      ICHOR_KEYSTORE_PASSWORD:
        required: false
      ICHOR_KEY_ALIAS:
        required: false

permissions:
  contents: read

# Four jobs in parallel rather than four build.sh runs in a row: the run takes as long as the
# slowest variant instead of their sum. Each job binds the Go core itself (seconds with a warm
# Go cache, see .github/actions/android-toolchain) and runs one Gradle build; the checks and
# the Go and Kotlin unit tests run once, in `check`, so the others skip them
# (ICHOR_SKIP_TESTS). A newer push to a pull request cancels its running jobs; main and tag
# runs each get their own concurrency group, so they neither queue nor cancel each other
# (auto-release.yml reads main's conclusions).
jobs:
  check:
    name: Check (gofmt, vet, staticcheck, Go and Kotlin unit tests)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/version.sh derives the version from tags and history
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/android-toolchain
        with:
          save: "true"

      - run: ./build.sh check

      # The Go cache is written here only, on main: pull requests read it, so the cache does
      # not fill with one entry per push.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.toolchain.outputs.go-cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.toolchain.outputs.go-cache-key }}

  debug:
    name: Debug APK
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-debug-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/android-toolchain

      - name: Build debug APK
        env:
          ICHOR_SKIP_TESTS: "1"
        run: ./build.sh debug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Release APKs
    runs-on: ubuntu-latest
    # The signing secrets live in the `release` environment, which only v* tags may use:
    # pull request and main builds get no secrets and come out unsigned.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/android-toolchain

      # Signed when the ICHOR_KEYSTORE_BASE64 / ICHOR_KEYSTORE_PASSWORD / ICHOR_KEY_ALIAS
      # secrets of the `release` environment are available (base64 of the .jks from
      # `just android-keystore-gen`), so on tags only; else unsigned.
      - name: Build release APK
        env:
          ICHOR_SKIP_TESTS: "1"
          ICHOR_KEYSTORE_BASE64: ${{ secrets.ICHOR_KEYSTORE_BASE64 }}
          ICHOR_KEYSTORE_PASSWORD: ${{ secrets.ICHOR_KEYSTORE_PASSWORD }}
          ICHOR_KEY_ALIAS: ${{ secrets.ICHOR_KEY_ALIAS }}
        run: |
          if [ -n "$ICHOR_KEYSTORE_BASE64" ]; then
            echo "$ICHOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ICHOR_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./build.sh release

      # ichor-v<version>-<abi>.apk; the in-app updater only picks signed ones,
      # so unsigned builds get an explicit -unsigned suffix.
      - name: Name release APKs
        run: |
          version="$(scripts/version.sh)"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/app-*-release*.apk; do
            file="$(basename "$apk")"
            abi="${file#app-}"; abi="${abi%%-release*}"
            suffix=""; [[ "$file" == *unsigned* ]] && suffix="-unsigned"
            cp "$apk" "dist/ichor-v${version}-${abi}${suffix}.apk"
          done
          # Published with the release, so installed apps can show what an update brings.
          scripts/changelog.py --limit 30 -o dist/changelog.json
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: android-release
          path: |
            dist/*.apk
            dist/changelog.json

      # R8 mapping, to decode obfuscated stack traces from release builds.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: android-mapping
          path: app/build/outputs/mapping/release/mapping.txt

  # Google Play App Bundle: the release build without the self-updater and donation links,
  # signed with the same key (Play's upload key). Kept out of the GitHub release.
  play:
    name: Play bundle
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    concurrency:
      group: ${{ github.workflow }}-play-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/android-toolchain

      - name: Build Play bundle
        env:
          ICHOR_SKIP_TESTS: "1"
          ICHOR_KEYSTORE_BASE64: ${{ secrets.ICHOR_KEYSTORE_BASE64 }}
          ICHOR_KEYSTORE_PASSWORD: ${{ secrets.ICHOR_KEYSTORE_PASSWORD }}
          ICHOR_KEY_ALIAS: ${{ secrets.ICHOR_KEY_ALIAS }}
        run: |
          if [ -n "$ICHOR_KEYSTORE_BASE64" ]; then
            echo "$ICHOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ICHOR_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./build.sh play

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: android-play
          path: |
            app/build/outputs/bundle/play/*.aab
            app/build/outputs/mapping/play/mapping.txt
