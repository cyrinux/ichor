name: Android

on:
  push:
    branches: [main]
  pull_request:
  # Tags: release.yml calls this, then publishes the release once with all files.
  workflow_call:
    secrets:
      TALOS_KEYSTORE_BASE64:
        required: false
      TALOS_KEYSTORE_PASSWORD:
        required: false
      TALOS_KEY_ALIAS:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/version.sh derives the version from tags and history

      - uses: cachix/install-nix-action@v31

      - name: Check (gofmt, vet, Go and Kotlin unit tests)
        run: ./build.sh check

      - name: Build debug APK
        run: ./build.sh debug

      # Signed when the TALOS_KEYSTORE_BASE64 / TALOS_KEYSTORE_PASSWORD / TALOS_KEY_ALIAS
      # secrets are set (base64 of the .jks from `just android-keystore-gen`), else unsigned.
      - name: Build release APK
        env:
          TALOS_KEYSTORE_BASE64: ${{ secrets.TALOS_KEYSTORE_BASE64 }}
          TALOS_KEYSTORE_PASSWORD: ${{ secrets.TALOS_KEYSTORE_PASSWORD }}
          TALOS_KEY_ALIAS: ${{ secrets.TALOS_KEY_ALIAS }}
        run: |
          if [ -n "$TALOS_KEYSTORE_BASE64" ]; then
            echo "$TALOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export TALOS_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./build.sh release

      # talosdev-mobile-v<version>-<abi>.apk; the in-app updater only picks signed ones,
      # so unsigned builds get an explicit -unsigned suffix.
      - name: Name release APKs
        run: |
          version="$(scripts/version.sh)"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/app-*-release*.apk; do
            file="$(basename "$apk")"
            abi="${file#app-}"; abi="${abi%%-release*}"
            suffix=""; [[ "$file" == *unsigned* ]] && suffix="-unsigned"
            cp "$apk" "dist/talosdev-mobile-v${version}-${abi}${suffix}.apk"
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*.apk

      # R8 mapping, to decode obfuscated stack traces from release builds.
      - uses: actions/upload-artifact@v4
        with:
          name: android-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/*.apk
