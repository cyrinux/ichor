name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "docs-i18n/**", "scripts/site-i18n.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true # turns GitHub Pages on (source: Actions) on first run
      # docs/<lang>/ from the English pages and docs-i18n/; a string not translated yet
      # stays in English (and is flagged as a warning) rather than blocking the deploy.
      - run: python3 scripts/site-i18n.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true # v4+ drops dotfiles (docs/.nojekyll) by default
      - id: deployment
        uses: actions/deploy-pages@v5
