name: Screenshots

# The website and store screenshots, taken from the offline demo on an emulator
# (androidTest DemoScreenshots, scripts/ci-screenshots.sh). Run by hand before a release or a
# website change; the images come back as the `screenshots` artifact, laid out as in the repo:
# unzip it at the root and commit docs/screenshots/ and the store's phoneScreenshots/.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/src/androidTest/java/name/levis/ichor/DemoScreenshots.kt
      - scripts/ci-screenshots.sh
      - scripts/screenshot.sh
      - .github/workflows/screenshots.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture the demo (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/android-toolchain

      - name: Build the app and its instrumentation tests
        env:
          ICHOR_SKIP_TESTS: "1"
          ICHOR_LOCAL_MODEL: "0"
        run: ./build.sh smoke

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A Pixel 4 (1080x2280, the AVD's default is small): 1080 wide like the old captures,
      # and short enough that the image without its bars stays within the Play Store's 2:1.
      # The plain AOSP image: aosp_atd's screencaps are black.
      - name: Capture the screenshots on an emulator
        env:
          EMULATOR_DEVICE: pixel_4
          EMULATOR_TARGET: default
        run: nix shell nixpkgs#imagemagick --command scripts/ci-emulator.sh scripts/ci-screenshots.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            docs/screenshots/*.webp
            fastlane/metadata/android/en-US/images/phoneScreenshots/*.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots-report
          path: |
            app/build/reports/screenshots.txt
            app/build/reports/screenshots/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore
