name: Screenshots

# The website and store screenshots, taken from the offline demo on an emulator
# (androidTest DemoScreenshots, scripts/ci-screenshots.sh). Run by hand before a release or a
# website change; the images come back as the `screenshots` artifact, laid out as in the repo:
# unzip it at the root and commit docs/screenshots/ and the store's phoneScreenshots/. The iPhone
# ones (ios/IchorUITests/DemoScreenshotTests.swift, scripts/ios-screenshots.sh) are taken on a
# simulator and come back as `screenshots-ios`: unzip it at the root too and commit
# docs/screenshots/ios/.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/src/androidTest/java/name/levis/ichor/DemoScreenshots.kt
      - scripts/ci-screenshots.sh
      - scripts/screenshot.sh
      - .github/workflows/screenshots.yml
      - ios/IchorUITests/**
      - ios/Ichor/App/UITestLaunch.swift
      - scripts/ios-screenshots.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture the demo (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/android-toolchain

      - name: Build the app and its instrumentation tests
        env:
          ICHOR_SKIP_TESTS: "1"
          ICHOR_LOCAL_MODEL: "0"
        run: ./build.sh smoke

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A Pixel 4 (1080x2280, the AVD's default is small): 1080 wide like the old captures,
      # and short enough that the image without its bars stays within the Play Store's 2:1.
      # The plain AOSP image: aosp_atd's screencaps are black.
      - name: Capture the screenshots on an emulator
        env:
          EMULATOR_DEVICE: pixel_4
          EMULATOR_TARGET: default
        run: nix shell nixpkgs#imagemagick --command scripts/ci-emulator.sh scripts/ci-screenshots.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            docs/screenshots/*.webp
            fastlane/metadata/android/en-US/images/phoneScreenshots/*.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots-report
          path: |
            app/build/reports/screenshots.txt
            app/build/reports/screenshots/
            ${{ runner.temp }}/emulator.log
          if-no-files-found: ignore

  capture-ios:
    name: Capture the demo (simulator)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/version.sh derives the version from tags and history
          persist-credentials: false

      - uses: ./.github/actions/ios-toolchain

      # Restored, never saved here: ios.yml's test job on main is the only writer of the caches.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/llama-xcframework-*
          key: llama-xcframework-${{ runner.os }}-${{ hashFiles('native/llama-cpp.env') }}

      - name: Install cwebp
        run: brew install webp

      - name: Walk the demo on a simulator, in both appearances
        env:
          ICHOR_SKIP_TESTS: "1" # ios.yml's test job runs the core tests
        run: scripts/ios-build.sh screenshots

      - name: Write the images
        run: scripts/ios-screenshots.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-ios
          path: docs/screenshots/ios/*.webp

      # What the walk captured, with the element tree of a screen that never showed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots-ios-report
          path: |
            ios/build/screenshots-dark.xcresult
            ios/build/screenshots-light.xcresult
          retention-days: 7
          if-no-files-found: ignore
