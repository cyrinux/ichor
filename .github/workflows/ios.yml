name: iOS

on:
  push:
    branches: [main]
  pull_request:
  # Tags: release.yml calls this, then publishes the release once with all files.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scripts/version.sh derives the version from tags and history

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests and simulator build
        run: scripts/ios-build.sh test

      - name: Unsigned IPA
        run: scripts/ios-build.sh ipa

      - uses: actions/upload-artifact@v6
        with:
          name: ios-release
          path: ios/build/*.ipa
