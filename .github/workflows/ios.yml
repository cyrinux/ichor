name: iOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach the IPA to releases on tags

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/version.sh derives the version from tags and history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests and simulator build
        run: scripts/ios-build.sh test

      - name: Unsigned IPA
        run: scripts/ios-build.sh ipa

      - uses: actions/upload-artifact@v4
        with:
          name: talos-viewer-ios
          path: ios/build/*.ipa

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/*.ipa
