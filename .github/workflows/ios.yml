name: iOS

on:
  # Website-only changes (pages.yml's paths) build nothing here.
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-i18n/**", "scripts/site-i18n.py", "scripts/site-plugins.py", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["docs/**", "docs-i18n/**", "scripts/site-i18n.py", "scripts/site-plugins.py", ".github/workflows/pages.yml"]
  # Tags: release.yml calls this, then publishes the release once with all files.
  # Artifacts are only uploaded then (github.ref is the caller's tag); pushes and PRs
  # just build.
  workflow_call:

permissions:
  contents: read

# Two jobs in parallel, each binding the Go core itself (see .github/actions/ios-toolchain for
# the caches): the core tests with the simulator build, and the Release IPA. A newer push to a
# pull request cancels its running jobs; main and tag runs each get their own concurrency
# group, so they neither queue nor cancel each other (auto-release.yml reads main's conclusions).
jobs:
  test:
    name: Core tests and simulator build
    runs-on: macos-26
    permissions:
      contents: read
      actions: write # cache-prune deletes the cache entries this job replaces
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/version.sh derives the version from tags and history
          persist-credentials: false

      - id: toolchain
        uses: ./.github/actions/ios-toolchain

      - run: scripts/ios-build.sh test

      # The Apple Watch app and its complication (IchorWatch scheme), unsigned, for the watchOS
      # simulator: built, not embedded in the IPA yet.
      - run: scripts/ios-build.sh watch

      # The Go and Swift package caches are written here only, on main: pull requests read
      # them, so the cache does not fill with one entry per push. The entry each replaces is
      # deleted right after.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.toolchain.outputs.go-cache-hit != 'true'
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ steps.toolchain.outputs.go-cache-key }}

      - uses: ./.github/actions/cache-prune
        if: github.ref == 'refs/heads/main' && steps.toolchain.outputs.go-cache-hit != 'true'
        with:
          prefix: go-${{ runner.os }}-
          keep: ${{ steps.toolchain.outputs.go-cache-key }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.toolchain.outputs.spm-cache-hit != 'true'
        with:
          path: ios/build/SourcePackages
          key: ${{ steps.toolchain.outputs.spm-cache-key }}

      - uses: ./.github/actions/cache-prune
        if: github.ref == 'refs/heads/main' && steps.toolchain.outputs.spm-cache-hit != 'true'
        with:
          prefix: spm-${{ runner.os }}-
          keep: ${{ steps.toolchain.outputs.spm-cache-key }}

  ipa:
    name: Unsigned IPA
    runs-on: macos-26
    # Future signing / App Store Connect secrets go in the `release` environment, which only
    # v* tags may use, like android.yml.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    concurrency:
      group: ${{ github.workflow }}-ipa-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/ios-toolchain

      - name: Unsigned IPA
        env:
          ICHOR_SKIP_TESTS: "1" # the test job runs the core tests
        run: scripts/ios-build.sh ipa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ios-release
          path: ios/build/*.ipa

      # The App Store build (no donation links), signed by Xcode with the App Store Connect API
      # key and uploaded to TestFlight; submit it for review by hand in App Store Connect. Tags
      # only, and skipped until the IOS_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the
      # AuthKey_<id>.p8 contents) secrets of the `release` environment are set.
      - name: Check App Store secrets
        id: asc
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_P8" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "ASC_KEY_P8 is not set, skipping the App Store upload."
          fi

      - name: Upload to App Store Connect (TestFlight)
        if: steps.asc.outputs.enabled == 'true'
        env:
          ICHOR_SKIP_TESTS: "1"
          ICHOR_IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          # Set the repository variable IOS_MULTICAST=1 once Apple granted the multicast
          # entitlement (Wake-on-LAN broadcasts); see fastlane/APP_STORE_CONNECT.md.
          ICHOR_IOS_MULTICAST: ${{ vars.IOS_MULTICAST }}
          # The code App Store Connect gives once the encryption documentation is approved.
          ICHOR_IOS_EXPORT_CODE: ${{ vars.IOS_EXPORT_COMPLIANCE_CODE }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          scripts/ios-build.sh appstore
