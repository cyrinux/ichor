name: Release

# One release per tag, created once with every file: the Android and iOS builds used to
# create it concurrently and could replace each other's release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    uses: ./.github/workflows/ios.yml

  # Uploads the App Bundle (the `play` build from android.yml, not bundleRelease), its R8
  # mapping and the release notes (fastlane/metadata/android/*/changelogs) to Play's internal
  # track as a draft, to promote by hand in the Play Console. Authenticates with Workload
  # Identity Federation, so no service account key is stored. Skipped until the WIF_PROVIDER
  # and SERVICE_ACCOUNT secrets are set (see fastlane/PLAY_CONSOLE.md).
  play:
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for Google credentials
    env:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
    steps:
      - name: Check Play secrets
        if: env.WIF_PROVIDER == '' || env.SERVICE_ACCOUNT == ''
        run: echo "WIF_PROVIDER or SERVICE_ACCOUNT is not set, skipping the Play upload."

      - uses: actions/checkout@v4
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          fetch-depth: 0 # scripts/version.sh derives the versionCode from tags and history

      - uses: actions/download-artifact@v4
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          name: android-play
          path: play

      # Play wants whatsnew-<locale> files; fastlane keeps changelogs/<versionCode>.txt
      # (default.txt as fallback) per locale.
      - name: Release notes
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        run: |
          code="$(scripts/version.sh --field BUILD_NUMBER)"
          mkdir -p whatsnew
          for dir in fastlane/metadata/android/*/; do
            locale="$(basename "$dir")"
            for notes in "$dir/changelogs/$code.txt" "$dir/changelogs/default.txt"; do
              if [ -f "$notes" ]; then cp "$notes" "whatsnew/whatsnew-$locale"; break; fi
            done
          done
          echo "versionCode $code"; ls -l whatsnew

      - id: auth
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Upload to Google Play (internal track, draft)
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: name.levis.ichor
          releaseFiles: play/bundle/play/*.aab
          mappingFile: play/mapping/play/mapping.txt
          whatsNewDirectory: whatsnew
          track: internal
          status: draft

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
