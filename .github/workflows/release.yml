name: Release

# One release per tag, created once with every file: the Android and iOS builds used to
# create it concurrently and could replace each other's release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    # The signing key is in the `release` environment, but a called workflow only sees the
    # secrets its caller passes: without these, android.yml's job gets them empty even in
    # that environment, and the APKs and App Bundle come out unsigned.
    uses: ./.github/workflows/android.yml
    # A called workflow gets no more than this: its check job asks for actions: write (cache-prune).
    permissions:
      contents: read
      actions: write
    secrets:
      ICHOR_KEYSTORE_BASE64: ${{ secrets.ICHOR_KEYSTORE_BASE64 }}
      ICHOR_KEYSTORE_PASSWORD: ${{ secrets.ICHOR_KEYSTORE_PASSWORD }}
      ICHOR_KEY_ALIAS: ${{ secrets.ICHOR_KEY_ALIAS }}

  ios:
    uses: ./.github/workflows/ios.yml
    permissions:
      contents: read
      actions: write

  # The plugin catalog the apps browse (plugins/index.json) lists the plugin files of this tag.
  plugin-index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache: false

      - name: Check that plugins/index.json is not stale
        working-directory: go
        run: ICHOR_PROBE_CWD="$GITHUB_WORKSPACE" go run ./cmd/probe plugin-index -check go/plugin/drafts

  # Uploads the App Bundle (the `play` build from android.yml, not bundleRelease), its R8
  # mapping, the release notes and the store listing (texts, icon, feature graphic,
  # screenshots) from fastlane/metadata/android to Play's internal track, rolled out to
  # testers; promote it by hand in the Play Console. The PLAY_RELEASE_STATUS repository
  # variable overrides the status (`draft` to review it first). Authenticates with Workload
  # Identity Federation, so no service account key is stored. Skipped until the WIF_PROVIDER
  # and SERVICE_ACCOUNT secrets of the `release` environment are set (see
  # fastlane/PLAY_CONSOLE.md).
  play:
    needs: [android]
    runs-on: ubuntu-latest
    environment: release # WIF_PROVIDER and SERVICE_ACCOUNT are environment secrets
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for Google credentials
    env:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
    steps:
      - name: Check Play secrets
        if: env.WIF_PROVIDER == '' || env.SERVICE_ACCOUNT == ''
        run: echo "WIF_PROVIDER or SERVICE_ACCOUNT is not set, skipping the Play upload."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          fetch-depth: 0 # scripts/play-notes.py reads the tags and history
          persist-credentials: false

      # en-US release notes from the commits since the previous tag, unless notes for this
      # versionCode were committed by hand (`just release-tag` drafts them).
      - name: Release notes
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        run: cat "$(scripts/play-notes.py)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          name: android-play
          path: play

      - id: auth
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          ruby-version: "3.4"

      # fastlane 2.240+ reads the external_account credentials WIF writes. Release notes come
      # from <locale>/changelogs/<versionCode>.txt (default.txt as fallback; en-US is written
      # by the step above); images are only re-uploaded when their checksum changed.
      - name: Upload to Google Play (internal track)
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        env:
          CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          gem install --no-document fastlane -v '>= 2.240'
          aab="$(find play -name '*.aab' | head -1)"
          fastlane supply \
            --package_name name.levis.ichor \
            --json_key "$CREDENTIALS" \
            --aab "$aab" \
            --mapping play/mapping/play/mapping.txt \
            --track internal \
            --release_status "$RELEASE_STATUS" \
            --metadata_path fastlane/metadata/android \
            --sync_image_upload true

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/changelog.py reads the tags and history for the notes
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -l dist

      # A draft: invisible to the self-updater and to "latest" (the app's changelog link) until
      # the promote job publishes it, once verify has rebuilt the APK. The notes are the tag's
      # changelog entry. The preinstalled gh CLI rather than a third-party action: nothing
      # outside this repository and GitHub runs with the token that can write releases.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/discord-notes.py --markdown >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  # Rebuilds the drafted arm64 APK from the tag (unsigned, in the same Nix shell and with
  # the same Gradle heap as android.yml's release job) and compares it with the one just
  # drafted, signatures stripped (scripts/verify-release.py). A difference fails the run
  # with the differing entries attached: a packager rebuilding from the tag would get
  # another APK. It reads the caches the android job reads and saves none.
  verify:
    needs: [publish]
    runs-on: ubuntu-latest
    # A draft release is invisible to a read-only token ("release not found"): only the
    # download step gets the token, the rebuild step (Gradle, third-party plugins) does not.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scripts/version.sh counts the commits for the versionCode
          persist-credentials: false

      - name: Download the drafted APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ichor-$TAG-arm64-v8a.apk" --dir "$RUNNER_TEMP/published"

      - uses: ./.github/actions/android-toolchain

      - name: Rebuild and compare
        env:
          TAG: ${{ github.ref_name }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: python3 -I scripts/verify-release.py verify "$TAG" --repo "$GITHUB_REPOSITORY" --published "$RUNNER_TEMP/published/ichor-$TAG-arm64-v8a.apk" --report "$RUNNER_TEMP/differences.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reproducibility-differences
          path: ${{ runner.temp }}/differences.txt
          if-no-files-found: ignore

  # Publishes the draft once the rebuild matched. When verify fails the draft stays: read the
  # reproducibility-differences artifact, then delete the draft and tag (fix, tag again) or
  # publish it by hand (`gh release edit vX.Y.Z --draft=false`) if the difference is understood.
  promote:
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Announces the release in the Discord #changelog channel through its webhook, once the
  # GitHub release exists so the title can link to it. The message is the release's entry
  # from scripts/changelog.py (scripts/discord-notes.py). Skipped until the
  # DISCORD_CHANGELOG_WEBHOOK secret of the `release` environment is set (channel settings >
  # Integrations > Webhooks > New Webhook > Copy Webhook URL).
  discord:
    needs: [promote]
    runs-on: ubuntu-latest
    environment: release # DISCORD_CHANGELOG_WEBHOOK is an environment secret
    permissions:
      contents: read
    env:
      WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
    steps:
      - name: Check the webhook
        if: env.WEBHOOK == ''
        run: echo "DISCORD_CHANGELOG_WEBHOOK is not set, skipping the Discord announcement."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WEBHOOK != ''
        with:
          fetch-depth: 0 # scripts/changelog.py reads the tags and history
          persist-credentials: false

      - name: Post to #changelog
        if: env.WEBHOOK != ''
        env:
          URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          scripts/discord-notes.py --url "$URL" >payload.json
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            --data @payload.json "$WEBHOOK"
