name: Release

# One release per tag, created once with every file: the Android and iOS builds used to
# create it concurrently and could replace each other's release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  ios:
    uses: ./.github/workflows/ios.yml

  # Uploads the App Bundle (the `play` build from android.yml, not bundleRelease), its R8
  # mapping, the release notes and the store listing (texts, icon, feature graphic,
  # screenshots) from fastlane/metadata/android to Play's internal track, rolled out to
  # testers; promote it by hand in the Play Console. The PLAY_RELEASE_STATUS repository
  # variable overrides the status (`draft` to review it first). Authenticates with Workload
  # Identity Federation, so no service account key is stored. Skipped until the WIF_PROVIDER
  # and SERVICE_ACCOUNT secrets of the `release` environment are set (see
  # fastlane/PLAY_CONSOLE.md).
  play:
    needs: [android]
    runs-on: ubuntu-latest
    environment: release # WIF_PROVIDER and SERVICE_ACCOUNT are environment secrets
    permissions:
      contents: read
      id-token: write # OIDC token exchanged for Google credentials
    env:
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
    steps:
      - name: Check Play secrets
        if: env.WIF_PROVIDER == '' || env.SERVICE_ACCOUNT == ''
        run: echo "WIF_PROVIDER or SERVICE_ACCOUNT is not set, skipping the Play upload."

      - uses: actions/checkout@v7
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          fetch-depth: 0 # scripts/play-notes.py reads the tags and history

      # en-US release notes from the commits since the previous tag, unless notes for this
      # versionCode were committed by hand (`just release-tag` drafts them).
      - name: Release notes
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        run: cat "$(scripts/play-notes.py)"

      - uses: actions/download-artifact@v8
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          name: android-play
          path: play

      - id: auth
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: ruby/setup-ruby@v1
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        with:
          ruby-version: "3.4"

      # fastlane 2.240+ reads the external_account credentials WIF writes. Release notes come
      # from <locale>/changelogs/<versionCode>.txt (default.txt as fallback; en-US is written
      # by the step above); images are only re-uploaded when their checksum changed.
      - name: Upload to Google Play (internal track)
        if: env.WIF_PROVIDER != '' && env.SERVICE_ACCOUNT != ''
        env:
          CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          gem install --no-document fastlane -v '>= 2.240'
          aab="$(find play -name '*.aab' | head -1)"
          fastlane supply \
            --package_name name.levis.ichor \
            --json_key "$CREDENTIALS" \
            --aab "$aab" \
            --mapping play/mapping/play/mapping.txt \
            --track internal \
            --release_status "$RELEASE_STATUS" \
            --metadata_path fastlane/metadata/android \
            --sync_image_upload true

  publish:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
