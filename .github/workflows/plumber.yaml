name: Plumber

on:
  # It lints the workflows: website pages alone give it nothing to check.
  pull_request:
    paths-ignore: ["docs/**", "docs-i18n/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-i18n/**"]

permissions:
  contents: read
  security-events: write

jobs:
  plumber:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: getplumber/plumber@bdac4bb86e112220f05aaaa52264b9a25e21a9f5 # v0.6.3
