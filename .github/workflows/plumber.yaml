name: Plumber

on:
  # It lints the workflows: website pages alone give it nothing to check.
  pull_request:
    paths-ignore: ["docs/**", "docs-i18n/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-i18n/**"]

permissions:
  contents: read
  security-events: write

jobs:
  plumber:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: getplumber/plumber@a7fa2feca21bd02c21c2e45d87e352b5ff7e7f28 # v0.3.43
