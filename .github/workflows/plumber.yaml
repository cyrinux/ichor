name: Plumber

on:
  # It lints the workflows: website pages alone give it nothing to check.
  pull_request:
    paths-ignore: ["docs/**", "docs-i18n/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "docs-i18n/**"]

permissions:
  contents: read
  security-events: write

jobs:
  plumber:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: getplumber/plumber@d1133cdac48cfdf0c0004637ae4af38bcf9f16c7 # v0.7.11
