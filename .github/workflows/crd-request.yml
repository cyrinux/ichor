name: CRD request

# A "Plugin request from a CRD" issue (.github/ISSUE_TEMPLATE/crd-request.yml) becomes a plugin
# draft pull request: the CRD is fetched from its public link (or, when the request names the
# CRDs instead, as the app's Request an integration does, found on public GitHub by its name
# and the project's home page read from the repository), `probe plugin-from-crd` writes
# go/plugin/drafts/<id>.yaml, `plugin-i18n` translates its labels (the built-in plugins'
# glossary, then GitHub Models for the rest, checked before it is written), `plugin-lint -crd`
# checks it, and a draft pull request links the issue. A maintainer reviews, proofreads the
# translations and promotes it (go/plugin/drafts/README.md).
#
# Issue bodies are written by anyone: scripts/crd-request.py reads them from the environment
# and hands the shell only validated one-line values (an https link on a public forge, never
# an IP address or a host that resolves to a private address, and an operator name of plain
# characters). A request from the owner, a member or a collaborator
# runs when opened; anyone else's waits for a maintainer to add the `crd-approved` label, and
# removing and adding it again reruns the request (the pull request is then updated).
#
# A pull request opened with GITHUB_TOKEN starts no checks, and this repository does not let
# GITHUB_TOKEN open pull requests at all: with the CRD bot App's secrets (CONTRIBUTING.md
# "Plugin requests") the App opens it and CI runs; without them the branch is pushed and the
# issue gets the link to open the pull request by hand.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read

jobs:
  draft:
    name: Plugin draft from the CRD
    if: >-
      contains(github.event.issue.labels.*.name, 'crd-request') && (
        (github.event.action == 'opened' && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event.action == 'labeled' && github.event.label.name == 'crd-approved'))
    # On the job, not the workflow: the form's own `labeled` events (crd-request, integration)
    # skip the job and so never cancel the run of the `opened` event.
    concurrency:
      group: crd-request-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the crd-request/* branch (the rulesets protect main and v* only)
      pull-requests: write # the draft pull request, or its update on a rerun
      issues: write # comments and labels on the request
      models: read # GitHub Models translates the draft's labels
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the request
        id: request
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 -I scripts/crd-request.py parse >"$RUNNER_TEMP/request.txt" 2>"$RUNNER_TEMP/reason.txt"; then
            python3 -I scripts/crd-request.py refused "$RUNNER_TEMP/reason.txt" >"$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
            gh issue edit "$ISSUE_NUMBER" --add-label crd-request:failed
            echo "::error::Request refused: $(head -c 300 "$RUNNER_TEMP/reason.txt")"
            exit 1
          fi
          cat "$RUNNER_TEMP/request.txt" >>"$GITHUB_OUTPUT"

      # No link: the manifest is searched for on GitHub by the CRD's name (code search, which
      # the workflow token may use), in the repository named after the project or else the most
      # starred one. The pull request names it, for the reviewer to check.
      - name: Find the CRD on GitHub
        id: find
        if: steps.request.outputs.crd_url == ''
        env:
          CRDS: ${{ steps.request.outputs.crds }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 -I scripts/crd-request.py search >"$RUNNER_TEMP/found.txt" 2>"$RUNNER_TEMP/reason.txt"; then
            python3 -I scripts/crd-request.py refused "$RUNNER_TEMP/reason.txt" >"$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
            gh issue edit "$ISSUE_NUMBER" --add-label crd-request:failed
            echo "::error::CRD not found: $(head -c 300 "$RUNNER_TEMP/reason.txt")"
            exit 1
          fi
          cat "$RUNNER_TEMP/found.txt" >>"$GITHUB_OUTPUT"

      # Into its own new directory, never the checkout. A redirect may only end on a public
      # forge too, else the file is thrown away. A GitLab file comes through its files API
      # (fetch_url); a web page served instead of the file (a bot check) is refused by name.
      - name: Fetch the CRD
        id: fetch
        env:
          FETCH_URL: ${{ steps.request.outputs.fetch_url || steps.find.outputs.crd_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/crd"
          mkdir "$dir"
          refuse() {
            rm -f "$dir/manifest.yaml"
            python3 -I scripts/crd-request.py refused "$RUNNER_TEMP/reason.txt" >"$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
            gh issue edit "$ISSUE_NUMBER" --add-label crd-request:failed
            echo "::error::Request refused: $(head -c 300 "$RUNNER_TEMP/reason.txt")"
            exit 1
          }
          if ! effective="$(curl --globoff --proto '=https' --proto-redir '=https' --tlsv1.2 --location --max-redirs 2 \
              --max-filesize 4194304 --max-time 20 --fail --silent --show-error \
              --write-out '%{url_effective}' --output "$dir/manifest.yaml" "$FETCH_URL" 2>"$RUNNER_TEMP/reason.txt")" ||
             ! python3 -I scripts/crd-request.py check-url "$effective" 2>>"$RUNNER_TEMP/reason.txt"; then
            echo "the CRD could not be fetched from its link" >"$RUNNER_TEMP/reason.txt"
            refuse
          fi
          python3 -I scripts/crd-request.py check-manifest "$dir/manifest.yaml" 2>"$RUNNER_TEMP/reason.txt" || refuse
          echo "manifest=$dir/manifest.yaml" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          # No cache: a workflow anyone can trigger writes none (a poisoned entry would reach
          # the next run); the probe builds in seconds.
          cache: false

      # A CRD the app already reads ("already covered by …") is a duplicate, not a failure.
      - name: Generate the draft and lint it
        id: generate
        working-directory: go
        env:
          MANIFEST: ${{ steps.fetch.outputs.manifest }}
          ID: ${{ steps.request.outputs.id }}
          OPERATOR: ${{ steps.request.outputs.operator }}
          # The project's home page when the CRD was found on GitHub, else the documentation link.
          WEBSITE: ${{ steps.find.outputs.website || steps.request.outputs.docs }}
          GH_TOKEN: ${{ github.token }}
        run: |
          go build -o "$RUNNER_TEMP/probe" ./cmd/probe
          log="$RUNNER_TEMP/generate.txt"
          args=(plugin-from-crd "$MANIFEST" -id "$ID" -name "$OPERATOR" -out "plugin/drafts/$ID.yaml")
          [[ -z "$WEBSITE" ]] || args+=(-website "$WEBSITE")
          if ! "$RUNNER_TEMP/probe" "${args[@]}" >"$log" 2>&1; then
            if python3 -I ../scripts/crd-request.py is-covered "$log"; then
              python3 -I ../scripts/crd-request.py covered "$log" >"$RUNNER_TEMP/comment.md"
              gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
              gh issue edit "$ISSUE_NUMBER" --add-label duplicate
              echo "covered=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            python3 -I ../scripts/crd-request.py failed "$log" >"$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
            gh issue edit "$ISSUE_NUMBER" --add-label crd-request:failed
            exit 1
          fi
          if ! "$RUNNER_TEMP/probe" plugin-lint "plugin/drafts/$ID.yaml" -crd "$MANIFEST" >"$RUNNER_TEMP/lint.txt" 2>&1; then
            python3 -I ../scripts/crd-request.py failed "$RUNNER_TEMP/lint.txt" >"$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
            gh issue edit "$ISSUE_NUMBER" --add-label crd-request:failed
            exit 1
          fi
          echo "covered=false" >>"$GITHUB_OUTPUT"

      # The labels the built-in plugins already translate come from their glossary; GitHub
      # Models (the Actions token, `models: read`, no secret) is asked for the rest, and its
      # answer is data: scripts/crd-request.py keeps its shape only and `plugin-i18n -fill`
      # refuses a text that is not a label of the plugin or loses a {{ hole }}. Whatever fails
      # here leaves those labels English, and the lint in the pull request says which.
      - name: Translate the labels
        if: steps.generate.outputs.covered == 'false'
        working-directory: go
        env:
          MANIFEST: ${{ steps.fetch.outputs.manifest }}
          ID: ${{ steps.request.outputs.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          draft="plugin/drafts/$ID.yaml"
          probe="$RUNNER_TEMP/probe"
          cp "$draft" "$RUNNER_TEMP/english.yaml"
          "$probe" plugin-i18n "$draft" >"$RUNNER_TEMP/i18n.json"
          python3 -I ../scripts/crd-request.py translate-request "$RUNNER_TEMP/i18n.json" "$draft" >"$RUNNER_TEMP/request.json"
          if [[ -s "$RUNNER_TEMP/request.json" ]]; then
            if curl --fail --silent --show-error --max-time 120 --proto '=https' --tlsv1.2 \
                 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                 -H "Content-Type: application/json" --data @"$RUNNER_TEMP/request.json" \
                 -o "$RUNNER_TEMP/response.json" https://models.github.ai/inference/chat/completions &&
               python3 -I ../scripts/crd-request.py translate-response "$RUNNER_TEMP/response.json" >"$RUNNER_TEMP/fill.json" &&
               "$probe" plugin-i18n "$draft" -fill "$RUNNER_TEMP/fill.json" >"$RUNNER_TEMP/i18n.json"; then
              echo "Translated: $(cat "$RUNNER_TEMP/i18n.json")"
            else
              echo "::warning::The model's translations were not applied; those labels stay English."
            fi
          fi
          if ! "$probe" plugin-lint "$draft" -crd "$MANIFEST" >"$RUNNER_TEMP/lint.txt" 2>&1; then
            echo "::warning::The translated draft fails the lint; the English one is kept."
            cp "$RUNNER_TEMP/english.yaml" "$draft"
            "$probe" plugin-lint "$draft" -crd "$MANIFEST" >"$RUNNER_TEMP/lint.txt" 2>&1
          fi

      # `if` cannot read secrets: the check goes through an environment variable.
      - name: Check for the CRD bot App
        id: app
        if: steps.generate.outputs.covered == 'false'
        env:
          CLIENT_ID: ${{ secrets.CRD_BOT_CLIENT_ID }}
        run: echo "configured=$([[ -n "$CLIENT_ID" ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

      - name: App token
        id: token
        if: steps.app.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CRD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CRD_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Branch and pull request
        if: steps.generate.outputs.covered == 'false'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          ID: ${{ steps.request.outputs.id }}
          OPERATOR: ${{ steps.request.outputs.operator }}
          CRD_URL: ${{ steps.request.outputs.crd_url || steps.find.outputs.crd_url }}
          FOUND_REPO: ${{ steps.find.outputs.repo }}
          BRANCH: ${{ steps.request.outputs.branch }}
          FALLBACK: ${{ steps.token.outputs.token == '' && '1' || '0' }}
        run: |
          if [[ -n "$APP_SLUG" ]]; then
            name="${APP_SLUG}[bot]"
            email="$(gh api "users/$name" --jq .id)+$name@users.noreply.github.com"
          else
            name="github-actions[bot]"
            email="41898282+github-actions[bot]@users.noreply.github.com"
          fi
          git config user.name "$name"
          git config user.email "$email"
          git switch -c "$BRANCH"
          git add "go/plugin/drafts/$ID.yaml"
          git commit -q -s -m "feat: $OPERATOR plugin draft from its CRD"
          # The token for this push only, never written to .git/config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force origin "HEAD:refs/heads/$BRANCH"

          python3 -I scripts/crd-request.py pr-body "$RUNNER_TEMP/lint.txt" >"$RUNNER_TEMP/pr.md"
          title="feat: $OPERATOR plugin draft from its CRD"
          open="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$open" ]]; then
            gh pr edit "$open" --body-file "$RUNNER_TEMP/pr.md"
            gh issue comment "$ISSUE_NUMBER" --body "Updated the draft: $open"
          elif url="$(gh pr create --draft --head "$BRANCH" --base main --title "$title" --body-file "$RUNNER_TEMP/pr.md")"; then
            gh issue comment "$ISSUE_NUMBER" --body "A plugin draft is ready for review: $url"
          else
            # GITHUB_TOKEN may not open pull requests here (Settings > Actions).
            export COMPARE_URL="https://github.com/$GH_REPO/compare/main...$BRANCH?expand=1"
            python3 -I scripts/crd-request.py pushed "$RUNNER_TEMP/lint.txt" >"$RUNNER_TEMP/comment.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/comment.md"
          fi
